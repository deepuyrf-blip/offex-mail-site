<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="Four step upload and download flow"><title>Four step upload and download flow</title><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#d946ef"/></linearGradient><linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d946ef"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs><rect width="960" height="380" rx="18" fill="#0d1020"/><rect x="0.5" y="0.5" width="959" height="379" rx="18" fill="none" stroke="#242a48"/>
<rect x="60" y="70" width="840" height="60" rx="14" fill="#12162a" stroke="#242a48"/>
<text x="90" y="108" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="700" fill="#eef1fb" text-anchor="start">1. Choose a file</text>
<rect x="60" y="150" width="840" height="60" rx="14" fill="#12162a" stroke="#242a48"/>
<text x="90" y="188" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="700" fill="#eef1fb" text-anchor="start">2. Upload to our secure server</text>
<rect x="760" y="164" width="120" height="32" rx="8" fill="#22d3ee" opacity="0.25"/>
<text x="820" y="186" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#22d3ee" text-anchor="middle">0 → 100%</text>
<rect x="60" y="230" width="840" height="60" rx="14" fill="#12162a" stroke="#242a48"/>
<text x="90" y="268" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="700" fill="#eef1fb" text-anchor="start">3. Preview the result</text>
<rect x="60" y="310" width="840" height="50" rx="14" fill="#12162a" stroke="#242a48"/>
<text x="90" y="342" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="700" fill="#eef1fb" text-anchor="start">4. Download MP3 or WAV</text>
</svg>