<text x="560" y="80" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#22d3ee" text-anchor="middle">Voice energy</text>
<rect x="640" y="180" width="240" height="140" rx="8" fill="#d946ef" opacity="0.18"/>
<text x="760" y="260" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#d946ef" text-anchor="middle">Hiss / sibilance</text>
