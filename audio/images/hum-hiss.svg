<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Frequency ranges of hum and hiss"><title>Frequency ranges of hum and hiss</title><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#d946ef"/></linearGradient><linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d946ef"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs><rect width="960" height="400" rx="18" fill="#0d1020"/><rect x="0.5" y="0.5" width="959" height="399" rx="18" fill="none" stroke="#242a48"/>
<text x="40" y="44" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700" fill="#9aa3c0" text-anchor="start">Where hum and hiss live</text>
<line x1="60" y1="320" x2="900" y2="320" stroke="#242a48" stroke-width="2"/>
<text x="60" y="350" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="#9aa3c0" text-anchor="start">50 Hz</text>
<text x="480" y="350" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="#9aa3c0" text-anchor="start">1 kHz</text>
<text x="860" y="350" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="#9aa3c0" text-anchor="start">16 kHz</text>
<rect x="60" y="120" width="70" height="200" rx="8" fill="#fbbf24" opacity="0.5"/>
<text x="150" y="150" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="start">Mains hum</text>
<rect x="120" y="200" width="90" height="120" rx="8" fill="#6366f1" opacity="0.4"/>
<text x="230" y="230" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" fill="#6366f1" text-anchor="start">Rumble</text>
