<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="Audio glossary terms diagram"><title>Audio glossary terms diagram</title><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#d946ef"/></linearGradient><linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d946ef"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs><rect width="960" height="380" rx="18" fill="#0d1020"/><rect x="0.5" y="0.5" width="959" height="379" rx="18" fill="none" stroke="#242a48"/>
<text x="40" y="44" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700" fill="#9aa3c0" text-anchor="start">Key terms at a glance</text>
<rect x="40" y="76" width="880" height="48" rx="10" fill="#12162a" stroke="#242a48"/><text x="66" y="106" font-family="Inter,sans-serif" font-size="16" font-weight="700" fill="#22d3ee">Noise floor</text><text x="260" y="106" font-family="Inter,sans-serif" font-size="14" fill="#9aa3c0">The steady background level under the voice</text><rect x="40" y="134" width="880" height="48" rx="10" fill="#12162a" stroke="#242a48"/><text x="66" y="164" font-family="Inter,sans-serif" font-size="16" font-weight="700" fill="#22d3ee">De-noise</text><text x="260" y="164" font-family="Inter,sans-serif" font-size="14" fill="#9aa3c0">Reducing constant hum, hiss and rumble</text><rect x="40" y="192" width="880" height="48" rx="10" fill="#12162a" stroke="#242a48"/><text x="66" y="222" font-family="Inter,sans-serif" font-size="16" font-weight="700" fill="#22d3ee">Gate</text><text x="260" y="222" font-family="Inter,sans-serif" font-size="14" fill="#9aa3c0">Muting the signal when nobody is speaking</text><rect x="40" y="250" width="880" height="48" rx="10" fill="#12162a" stroke="#242a48"/><text x="66" y="280" font-family="Inter,sans-serif" font-size="16" font-weight="700" fill="#22d3ee">Normalise</text><text x="260" y="280" font-family="Inter,sans-serif" font-size="14" fill="#9aa3c0">Raising the peak to a target level</text><rect x="40" y="308" width="880" height="48" rx="10" fill="#12162a" stroke="#242a48"/><text x="66" y="338" font-family="Inter,sans-serif" font-size="16" font-weight="700" fill="#22d3ee">Stem</text><text x="260" y="338" font-family="Inter,sans-serif" font-size="14" fill="#9aa3c0">A single separated part, such as the voice</text>
</svg>