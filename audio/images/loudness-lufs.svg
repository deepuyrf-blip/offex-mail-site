<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Loudness targets in LUFS for streaming, podcasts and broadcast"><title>Loudness targets in LUFS for streaming, podcasts and broadcast</title><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#d946ef"/></linearGradient><linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d946ef"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs><rect width="960" height="400" rx="18" fill="#0d1020"/><rect x="0.5" y="0.5" width="959" height="399" rx="18" fill="none" stroke="#242a48"/><text x="40" y="46" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="700" fill="#c7d2fe" text-anchor="start">Integrated loudness targets (LUFS)</text><text x="40" y="70" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500" fill="#9aa3c0" text-anchor="start">Lower number = louder. Platforms turn quiet audio up and loud audio down.</text><text x="40" y="128" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="600" fill="#dfe3f5" text-anchor="start">Spotify</text><rect x="220" y="110" width="520" height="22" rx="11" fill="#141a33"/><rect x="220" y="110" width="303.3" height="22" rx="11" fill="url(#g1)"/><text x="756" y="127" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">-14 LUFS</text><text x="40" y="174" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="600" fill="#dfe3f5" text-anchor="start">YouTube</text><rect x="220" y="156" width="520" height="22" rx="11" fill="#141a33"/><rect x="220" y="156" width="303.3" height="22" rx="11" fill="url(#g1)"/><text x="756" y="173" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">-14 LUFS</text><text x="40" y="220" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="600" fill="#dfe3f5" text-anchor="start">Apple Podcasts</text><rect x="220" y="202" width="520" height="22" rx="11" fill="#141a33"/><rect x="220" y="202" width="346.7" height="22" rx="11" fill="url(#g2)"/><text x="756" y="219" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">-16 LUFS</text><text x="40" y="266" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="600" fill="#dfe3f5" text-anchor="start">Podcast (spoken)</text><rect x="220" y="248" width="520" height="22" rx="11" fill="#141a33"/><rect x="220" y="248" width="346.7" height="22" rx="11" fill="url(#g2)"/><text x="756" y="265" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">-16 LUFS</text><text x="40" y="312" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="600" fill="#dfe3f5" text-anchor="start">TV / broadcast</text><rect x="220" y="294" width="520" height="22" rx="11" fill="#141a33"/><rect x="220" y="294" width="498.3" height="22" rx="11" fill="url(#g3)"/><text x="756" y="311" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">-23 LUFS</text><line x1="220" y1="98" x2="220" y2="352" stroke="#3b3f63" stroke-width="1"/><text x="40" y="372" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500" fill="#9aa3c0" text-anchor="start">Target: about -14 LUFS for streaming, -16 LUFS for podcasts, peaks under -1 dBTP</text></svg>