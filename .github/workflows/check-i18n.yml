name: check-i18n
on:
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check live i18n and bump version
        run: |
          set +e
          O=/tmp/o.txt
          : > "$O"
          echo "== live /i18n.js?v=5 banner lines ==" >> "$O"
          curl -s --max-time 60 "https://mytemp-mail.online/i18n.js?v=5" | grep -o 'banner:"[^"]*"' | head -2 >> "$O" 2>&1
          echo "== live 100% in banner/el_head count ==" >> "$O"
          curl -s --max-time 60 "https://mytemp-mail.online/i18n.js?v=5" | grep -c '\(banner\|el_head\):"[^"]*100' >> "$O" 2>&1
          echo "== live i18n.js bytes ==" >> "$O"
          curl -s --max-time 60 "https://mytemp-mail.online/i18n.js?v=5" | wc -c >> "$O" 2>&1
          echo "== bump ?v=5 -> ?v=6 ==" >> "$O"
          sed -i 's#/i18n.js?v=5#/i18n.js?v=6#' public/index.html
          grep -o '/i18n.js?v=[0-9]*' public/index.html >> "$O" 2>&1
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          git add public/index.html
          git commit -m "chore: cache-bust i18n.js (?v=6)" || echo "no changes"
          git push
          head -c 4000 "$O" > /tmp/iss.txt
      - name: Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "i18n check results" --body-file /tmp/iss.txt
