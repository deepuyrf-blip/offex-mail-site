name: Deploy Offex API proxy worker

# Deploys the Cloudflare Worker `offex-api-proxy` (offex-proxy-worker.js) which
# fronts api.mytemp-mail.online. Uses the repo's CLOUDFLARE_API_TOKEN secret.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "offex-proxy-worker.js"
      - "wrangler.worker.toml"
      - ".github/workflows/deploy-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy worker (offex-api-proxy)
        run: |
          set -o pipefail
          npx --yes wrangler@3 deploy --config wrangler.worker.toml 2>&1 | tee /tmp/wrangler.log
          echo "----- deploy summary -----"
          grep -Ei "version id|uploaded|deployed|api.mytemp-mail" /tmp/wrangler.log || true
