name: cf-diag
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Read error page
        run: |
          set +e
          O=/tmp/o.txt
          : > "$O"
          sleep 40
          for u in /ping /api/status /; do
            echo "===== $u =====" >> "$O"
            curl -s -D - --max-time 60 "https://offex-mail.pages.dev$u" -o /tmp/b >> "$O" 2>&1
            echo "" >> "$O"
            echo "[body $(( $(wc -c < /tmp/b) )) bytes]" >> "$O"
            grep -ioE "error [0-9]+|ray id[^<]*|<title>[^<]*|you have been|rate limit[^<]*|banned|origin[^<]*|function[^<]*" /tmp/b | head -12 >> "$O"
            head -c 400 /tmp/b >> "$O"
            echo >> "$O"
          done
          head -c 12000 "$O" > /tmp/iss.txt
      - name: Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "cf-errpage results" --body-file /tmp/iss.txt
