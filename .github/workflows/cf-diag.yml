name: cf-diag
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      A: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - name: Revert fail_open to true
        run: |
          set +e
          O=/tmp/o.txt
          : > "$O"
          curl -s -X PATCH --max-time 30 -H "Authorization: Bearer $T" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/accounts/$A/pages/projects/offex-mail" -d '{"deployment_configs":{"production":{"fail_open":true},"preview":{"fail_open":true}}}' | python3 -c "import sys,json;d=json.load(sys.stdin);r=(d.get('result') or {}).get('deployment_configs') or {};print('ok',d.get('success'));print('prod fail_open',(r.get('production') or {}).get('fail_open'));print('preview fail_open',(r.get('preview') or {}).get('fail_open'))" >> "$O" 2>&1
          head -c 3000 "$O" > /tmp/iss.txt
      - name: Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "cf-revert results" --body-file /tmp/iss.txt
