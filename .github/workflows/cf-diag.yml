name: cf-diag
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe after wait
        run: |
          set +e
          O=/tmp/o.txt
          : > "$O"
          sleep 150
          for u in "https://8c04e99c.offex-mail.pages.dev/ping" "https://8c04e99c.offex-mail.pages.dev/api/status" "https://offex-mail.pages.dev/ping" "https://offex-mail.pages.dev/api/status"; do
            echo "===== $u =====" >> "$O"
            code=$(curl -s -o /tmp/b -w "%{http_code}" --max-time 60 "$u")
            echo "status=$code bytes=$(wc -c </tmp/b) ctype=$(curl -s -o /dev/null -w '%{content_type}' --max-time 60 "$u")" >> "$O"
            head -c 220 /tmp/b >> "$O"
            echo >> "$O"
          done
          head -c 8000 "$O" > /tmp/iss.txt
      - name: Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "cf-probe3 results" --body-file /tmp/iss.txt
