name: Admin Panel Probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: curl admin page and APIs
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          echo "===== /admin?code=Hyco (browser headers) ====="
          curl -sS -L --max-time 40 -A "$UA" -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' -H 'Accept-Language: en-US,en;q=0.9' -H 'Origin: https://api.mytemp-mail.online' -H 'Referer: https://api.mytemp-mail.online/admin?code=Hyco' 'https://api.mytemp-mail.online/admin?code=Hyco' | head -c 40000
          echo
          echo "===== /api/app-config ====="
          curl -sS -L --max-time 30 -A "$UA" -H 'Accept: application/json' -H 'Origin: https://mytemp-mail.online' -H 'Referer: https://mytemp-mail.online/' 'https://api.mytemp-mail.online/api/app-config' | head -c 4000
          echo
          echo "===== /api/admin/app-config (x-admin-code) ====="
          curl -sS -L --max-time 30 -A "$UA" -H 'Accept: application/json' -H 'x-admin-code: Hyco' -H 'Origin: https://api.mytemp-mail.online' -H 'Referer: https://api.mytemp-mail.online/admin?code=Hyco' 'https://api.mytemp-mail.online/api/admin/app-config' | head -c 4000
          echo
          echo "===== HTTP status codes ====="
          curl -s -o /dev/null -w 'admin:%{http_code}\n' -A "$UA" 'https://api.mytemp-mail.online/admin?code=Hyco'
          curl -s -o /dev/null -w 'app-config:%{http_code}\n' -A "$UA" 'https://api.mytemp-mail.online/api/app-config'
          curl -s -o /dev/null -w 'admin-api:%{http_code}\n' -A "$UA" -H 'x-admin-code: Hyco' 'https://api.mytemp-mail.online/api/admin/app-config'
