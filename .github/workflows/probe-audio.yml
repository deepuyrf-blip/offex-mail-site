name: Probe audio project
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - name: Project object
        run: |
          curl -s --max-time 30 "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/audio" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result') or {}; print('name',r.get('name')); print('subdomain',r.get('subdomain')); print('domains',r.get('domains')); print('source',json.dumps(r.get('source'))); print('build_config',json.dumps(r.get('build_config'))); print('production_branch',r.get('production_branch'))"
      - name: Sitemap (pages.dev)
        run: echo "--- audio-2i8 sitemap ---"; curl -s --max-time 30 https://audio-2i8.pages.dev/sitemap.xml | head -c 1500
      - name: Sitemap (offexmail.online)
        run: echo "--- offexmail.online sitemap ---"; curl -s --max-time 30 https://offexmail.online/sitemap.xml | head -c 1500
      - name: Root domain check
        run: echo "offexmail.online root: $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://offexmail.online/)"
