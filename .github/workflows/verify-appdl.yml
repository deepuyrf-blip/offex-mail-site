name: Verify app-download promo (temp)
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check live pages
        run: |
          set -u
          check () {
            url="$1"; label="$2"
            html="$(curl -sL --max-time 30 "$url" || true)"
            code="$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$url" || true)"
            echo "===== $label ($url) ====="
            echo "HTTP_CODE: $code"
            echo "BANNER_appdl_class: $(printf '%s' "$html" | grep -o 'class="appdl"' | wc -l)"
            echo "SHARED_SCRIPT_ref: $(printf '%s' "$html" | grep -o 'app-promo.js' | wc -l)"
            echo "SHEET_id_appSheet: $(printf '%s' "$html" | grep -o 'id="appSheet"' | wc -l)"
            echo "APK_URL_present: $(printf '%s' "$html" | grep -o 'releases/latest/download/OffexMail.apk' | wc -l)"
            echo "I18N_VER: $(printf '%s' "$html" | grep -o 'i18n.js?v=[0-9]*' | head -1)"
            echo "NEW_I18N_KEY_appdl_banner: $(printf '%s' "$html" | grep -o 'appdl_banner' | wc -l)"
          }
          check "https://mytemp-mail.online/" "HOME"
          check "https://mytemp-mail.online/hi/" "HUB_HI"
          check "https://mytemp-mail.online/es/" "HUB_ES"
          check "https://mytemp-mail.online/de/" "HUB_DE"
          check "https://mytemp-mail.online/ar/" "HUB_AR"
          check "https://mytemp-mail.online/ja/" "HUB_JA"
          check "https://mytemp-mail.online/privacy.html" "PRIVACY"
          check "https://mytemp-mail.online/amazon.html" "AMAZON"
          echo "APP_PROMO_JS: $(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 https://mytemp-mail.online/app-promo.js)"
          echo "I18N_JS: $(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 https://mytemp-mail.online/i18n.js)"
          echo "I18N_KEY_LIVE: $(curl -sL --max-time 30 https://mytemp-mail.online/i18n.js | grep -o 'appdl_banner' | wc -l)"
