name: zz verify offex.cyou migration
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check new domain and old domain
        run: |
          set +e
          echo "=== NEW DOMAIN https://offex.cyou/ ==="
          echo "status: $(curl -s -o /tmp/new.html -w '%{http_code}' --max-time 30 https://offex.cyou/)"
          echo "canonical: $(grep -o 'rel="canonical" href="[^"]*"' /tmp/new.html | head -1)"
          echo "hreflang count: $(grep -o 'rel="alternate" hreflang' /tmp/new.html | wc -l)"
          echo "old-domain occurrences in served HTML: $(grep -o 'offexmail\.online' /tmp/new.html | wc -l)"
          echo
          echo "=== OLD DOMAIN https://offexmail.online/ ==="
          curl -sI --max-time 30 https://offexmail.online/ | tr -d '\r' | grep -Ei '^(HTTP/|location|cf-)' | head -5
          curl -sL -o /tmp/old.html -w 'followed status: %{http_code}\n' --max-time 40 https://offexmail.online/
          echo "canonical after redirect: $(grep -o 'rel="canonical" href="[^"]*"' /tmp/old.html | head -1)"
          echo "old-domain occurrences after redirect: $(grep -o 'offexmail\.online' /tmp/old.html | wc -l)"
          echo
          echo "=== /app-ui (Android app entry) ==="
          echo "new: $(curl -sL -o /tmp/app.html -w '%{http_code}' --max-time 40 https://offex.cyou/app-ui)"
          echo "new canonical: $(grep -o 'rel="canonical" href="[^"]*"' /tmp/app.html | head -1)"
          echo "old -> $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 30 https://offexmail.online/app-ui)"
          echo "old-domain occurrences: $(grep -o 'offexmail\.online' /tmp/app.html | wc -l)"
          echo
          echo "=== /sitemap.xml ==="
          curl -s --max-time 30 https://offex.cyou/sitemap.xml -o /tmp/sm.xml
          echo "locs: $(grep -c '<loc>' /tmp/sm.xml)"
          echo "new-domain locs: $(grep -o 'https://offex\.cyou/' /tmp/sm.xml | wc -l)"
          echo "old-domain locs: $(grep -o 'offexmail\.online' /tmp/sm.xml | wc -l)"
          echo "first loc: $(grep -o '<loc>[^<]*</loc>' /tmp/sm.xml | head -1)"
          echo
          echo "=== /robots.txt ==="
          curl -s --max-time 30 https://offex.cyou/robots.txt | tail -2
          echo
          echo "=== hub /hi/ ==="
          curl -s --max-time 30 https://offex.cyou/hi/ -o /tmp/hi.html
          echo "canonical: $(grep -o 'rel="canonical" href="[^"]*"' /tmp/hi.html | head -1)"
          echo "hreflang count: $(grep -o 'rel="alternate" hreflang' /tmp/hi.html | wc -l)"
          echo "old-domain occurrences: $(grep -o 'offexmail\.online' /tmp/hi.html | wc -l)"
          echo
          echo "=== guide /remove-echo-from-a-voice-memo ==="
          curl -sL --max-time 30 https://offex.cyou/remove-echo-from-a-voice-memo -o /tmp/g.html -w 'status: %{http_code}\n'
          echo "canonical: $(grep -o 'rel="canonical" href="[^"]*"' /tmp/g.html | head -1)"
          echo "old-domain occurrences: $(grep -o 'offexmail\.online' /tmp/g.html | wc -l)"
          echo
          echo "=== JSON-LD on homepage ==="
          python3 -c 'import json,re;s=open("/tmp/new.html",encoding="utf-8",errors="replace").read();b=re.findall("<script type=\"application/ld\\+json\">(.*?)</script>",s,re.S);print("blocks:",len(b));[json.loads(x) for x in b];print("all JSON-LD blocks parsed OK")'
