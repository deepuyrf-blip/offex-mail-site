name: apply-audio
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix audio URLs + keywords + sitemap, commit
        run: |
          set -e
          python3 fix_audio.py
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          git add audio/
          git commit -m "fix(audio): extensionless URLs (canonical/links/sitemap) + per-page keywords" || echo "no changes"
          git push
