name: Build Native APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate project, build and sign the APK
        run: |
          set -euo pipefail
          pip install --quiet pillow
          for f in gn_a gn_b gn_c gn_d gn_e gn_f gn_g gn_h gn_i gn_j gn_k gn_l gn_m gn_n gn_o gn_p gn_q gn_r gn_s gn_t gn_u gn_v gn_w gn_x gn_y gn_z gn_aa gn_ab gn_ac gn_ad gn_ae gn_af; do
            echo "== generating $f =="
            python3 "$f.py"
          done
          SRC=android/app/src/main/java/online/mytempmail/app
          UA='Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Mobile Safari/537.36'
          sed -i "s|OffexMail-Android/2.0|$UA|" "$SRC/ApiClient.java"
          sed -i 's|__VER__|4.9|' "$SRC/Config.java"
          sed -i '/AdminActivity/d' android/app/src/main/AndroidManifest.xml
          sed -i 's|versionName "[^"]*"|versionName "4.9"|' android/app/build.gradle
          sed -i 's|versionCode [0-9]*|versionCode 39|' android/app/build.gradle
          grep -q 'versionName "4.9"' android/app/build.gradle
          grep -q 'versionCode 39' android/app/build.gradle
          cd android
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "=== apk files produced by gradle ==="
          find app/build/outputs -name '*.apk' -print || true
          if [ ! -f "$APK" ]; then
            echo "::error::gradle finished but no APK was produced at android/$APK"
            exit 1
          fi
          BT=$(ls -d "${ANDROID_HOME:-}"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "${BT:-}" ]; then
            echo "::error::no Android build-tools found under ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            exit 1
          fi
          echo "using build-tools: $BT"
          "$BT/apksigner" sign --ks ../offex.keystore --ks-pass pass:offexpass123 --key-pass pass:offexpass123 --out /tmp/OffexMail.apk "$APK"
          cd ..
          if [ ! -f /tmp/OffexMail.apk ]; then
            echo "::error::signing did not produce the expected APK at /tmp/OffexMail.apk"
            exit 1
          fi
          ls -la /tmp/OffexMail.apk
          cp /tmp/OffexMail.apk public/OffexMail.apk
          cp /tmp/OffexMail.apk public/OffexMail-v4.9.apk
          echo "staged public/OffexMail.apk ($(stat -c%s public/OffexMail.apk) bytes)"
      - name: Commit signed APK to public/
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/OffexMail.apk public/OffexMail-v4.9.apk
          if git diff --cached --quiet; then
            echo "committed public APK is unchanged; nothing to commit"
          else
            git commit -m "chore(apk): publish signed OffexMail v4.9 APK (versionName 4.9 / versionCode 39)"
            git push
            echo "pushed updated public/OffexMail.apk"
          fi
      - name: Create or update GitHub Release v4.9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/notes.txt <<'NOTES'
          v4.9 changes: four fixes to the WebView UI and notifications. (1) Deleting an inbox no longer shows a confirmation dialog - the Delete control now deletes directly (the native Delete button already did, and deleting a saved inbox never confirmed). (2) The Inbox item in the bottom navigation now opens a dedicated, separate Inbox screen (a full-screen view in the bundled page) that lists the received mail - sender, subject, service/OTP tags and time - with tap-to-open on each message and a back arrow to return; the original page's CSS and markup are unchanged, only additive wiring was added. (3) Tapping a new-mail notification now opens the app directly on that mail: the notification's PendingIntent carries the message id and address and the app opens the reader for that message, whether it was closed (cold start) or in the background (singleTop onNewIntent). (4) The three notification tones were replaced with new, higher-quality, pleasant two-tone message bells in a Samsung/Vivo style (~1.25 s, soft attack, short tail); the More -> Notification sound picker keeps working and the default is the nicest one ("Bell"). Version bumped 4.8 to 4.9.
          NOTES
          if ! gh release view v4.9 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v4.9 --repo "$GITHUB_REPOSITORY" --title "Offex Mail v4.9" --notes-file /tmp/notes.txt || true
          fi
          gh release edit v4.9 --repo "$GITHUB_REPOSITORY" --title "Offex Mail v4.9" --notes-file /tmp/notes.txt --draft=false
          gh release upload v4.9 /tmp/OffexMail.apk --clobber --repo "$GITHUB_REPOSITORY"
          echo "=== release v4.9 ==="
          gh release view v4.9 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,assets
      - name: Deploy site to Cloudflare Pages
        continue-on-error: true
        run: |
          npx --yes wrangler pages deploy public --project-name offex-mail --branch main --commit-dirty=true
