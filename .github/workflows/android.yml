name: Build Native APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate project, build and sign the APK
        run: |
          set -euo pipefail
          pip install --quiet pillow
          for f in gn_a gn_b gn_c gn_d gn_e gn_f gn_g gn_h gn_i gn_j gn_k gn_l gn_m gn_n gn_o gn_p gn_q gn_r gn_s gn_t gn_u gn_v gn_w gn_x gn_y gn_z gn_aa gn_ab gn_ac gn_ad; do
            echo "== generating $f =="
            python3 "$f.py"
          done
          SRC=android/app/src/main/java/online/mytempmail/app
          UA='Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Mobile Safari/537.36'
          sed -i "s|OffexMail-Android/2.0|$UA|" "$SRC/ApiClient.java"
          sed -i 's|__VER__|4.7|' "$SRC/Config.java"
          sed -i '/AdminActivity/d' android/app/src/main/AndroidManifest.xml
          sed -i 's|versionName "[^"]*"|versionName "4.7"|' android/app/build.gradle
          sed -i 's|versionCode [0-9]*|versionCode 37|' android/app/build.gradle
          grep -q 'versionName "4.7"' android/app/build.gradle
          grep -q 'versionCode 37' android/app/build.gradle
          cd android
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "=== apk files produced by gradle ==="
          find app/build/outputs -name '*.apk' -print || true
          if [ ! -f "$APK" ]; then
            echo "::error::gradle finished but no APK was produced at android/$APK"
            exit 1
          fi
          BT=$(ls -d "${ANDROID_HOME:-}"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "${BT:-}" ]; then
            echo "::error::no Android build-tools found under ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            exit 1
          fi
          echo "using build-tools: $BT"
          "$BT/apksigner" sign --ks ../offex.keystore --ks-pass pass:offexpass123 --key-pass pass:offexpass123 --out /tmp/OffexMail.apk "$APK"
          cd ..
          if [ ! -f /tmp/OffexMail.apk ]; then
            echo "::error::signing did not produce the expected APK at /tmp/OffexMail.apk"
            exit 1
          fi
          ls -la /tmp/OffexMail.apk
          cp /tmp/OffexMail.apk public/OffexMail.apk
          cp /tmp/OffexMail.apk public/OffexMail-v4.7.apk
          echo "staged public/OffexMail.apk ($(stat -c%s public/OffexMail.apk) bytes)"
      - name: Commit signed APK to public/
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/OffexMail.apk public/OffexMail-v4.7.apk
          if git diff --cached --quiet; then
            echo "committed public APK is unchanged; nothing to commit"
          else
            git commit -m "chore(apk): publish signed OffexMail v4.7 APK (versionName 4.7 / versionCode 37)"
            git push
            echo "pushed updated public/OffexMail.apk"
          fi
      - name: Create or update GitHub Release v4.7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/notes.txt <<'NOTES'
          v4.7 changes: the main screen is now the supplied HTML UI rendered in a WebView, so it matches the approved design exactly and can be updated remotely later. The HTML is bundled as app/src/main/assets/offex_ui.html with everything inlined (CSS + SVG icons, no external requests). A JavaScript interface (OffexNative) bridges the page to the EXISTING native code - createInbox, refresh, deleteInbox, copyAddress, openMessage, switchTo, deleteSaved, openSettings, openMore, pickDomain, nav and openLink all call the same methods/API the old buttons did, so no business logic was reimplemented. Java pushes live data into the page via window.OffexUI.render(state): current address, message list (sender/subject/tags/timestamp/otp), saved inboxes, the N-new count, the live/expiry status, the section toggles, the announcement/banner text, and the remote appearance (accent/gradient/radius/titles) as CSS variables. An FCM push now refreshes the open WebView and still posts the system notification. Every view id the generated Java looks up is kept in the layout under the WebView, so nothing else had to change: the same API endpoints/JSON fields, the support screen, the bundled notification sounds, the AdMob placements, the notification-permission gate, the 7-locale multi-language support (English default + Hindi Devanagari + es/pt/ar/ru/in, driven by string resources), the install analytics, the OTP precision fix, the tappable verification links and the circular logo. Version bumped 4.6 to 4.7.
          NOTES
          if ! gh release view v4.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v4.7 --repo "$GITHUB_REPOSITORY" --title "Offex Mail v4.7" --notes-file /tmp/notes.txt || true
          fi
          gh release edit v4.7 --repo "$GITHUB_REPOSITORY" --title "Offex Mail v4.7" --notes-file /tmp/notes.txt --draft=false
          gh release upload v4.7 /tmp/OffexMail.apk --clobber --repo "$GITHUB_REPOSITORY"
          echo "=== release v4.7 ==="
          gh release view v4.7 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,assets
      - name: Deploy site to Cloudflare Pages
        continue-on-error: true
        run: |
          npx --yes wrangler pages deploy public --project-name offex-mail --branch main --commit-dirty=true
