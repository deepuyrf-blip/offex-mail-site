name: Build Native APK
on: workflow_dispatch
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          set +e
          pip install --quiet pillow > /tmp/gen.txt 2>&1
          for f in gn_a gn_b gn_c gn_d gn_e gn_f; do python3 $f.py >> /tmp/gen.txt 2>&1; done
          python3 gn_g.py >> /tmp/gen.txt 2>&1
          S=android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="ob1_body">.*</string>|<string name="ob1_body">Get a private disposable inbox in one tap - for OTPs, verification links and test emails.</string>|' $S
          sed -i 's|<string name="ob2_body">.*</string>|<string name="ob2_body">The app keeps checking in the background, so you get a notification the moment new mail arrives.</string>|' $S
          sed -i 's|<string name="ob3_body">.*</string>|<string name="ob3_body">No account, no password. Every inbox expires on its own after a while.</string>|' $S
          sed -i 's|<string name="no_messages">.*</string>|<string name="no_messages">No mail yet. Paste this address wherever you need it and mail will land here.</string>|' $S
          sed -i 's|</resources>|    <string name="tagline">Temp Mail - Instant Inbox</string>\n</resources>|' $S
          sed -i 's|versionName "2.0"|versionName "2.3"|' android/app/build.gradle
          sed -i 's|versionCode 2|versionCode 5|' android/app/build.gradle
          SRC=android/app/src/main/java/online/mytempmail/app
          sed -i 's/Prefs\.notify()/Prefs.notifyOn()/g' $SRC/AdminActivity.java
          cd android
          gradle wrapper --gradle-version 8.7 >> /tmp/gen.txt 2>&1
          ./gradlew assembleDebug --no-daemon > /tmp/b.txt 2>&1
          GR=$?
          {
            echo "gradle exit: $GR"
            echo "=== gen ==="
            tail -c 400 /tmp/gen.txt
            echo "=== apk ==="
            ls -la app/build/outputs/apk/debug/ 2>&1
            echo "=== errors ==="
            grep -iE "error:|FAILED|What went wrong|AAPT" /tmp/b.txt | head -30
          } > /tmp/iss.txt 2>&1
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s /tmp/iss.txt ]; then echo "no log" > /tmp/iss.txt; fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "history + notif build" --body-file /tmp/iss.txt || true
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            cp "$APK" /tmp/OffexMail-v2.3.apk
            gh release create v2.3 /tmp/OffexMail-v2.3.apk --repo "$GITHUB_REPOSITORY" --title "Offex Mail v2.3" --notes "History, multi-inbox fix, notifications" || gh release upload v2.3 /tmp/OffexMail-v2.3.apk --clobber --repo "$GITHUB_REPOSITORY"
          fi
