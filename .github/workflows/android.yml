name: Build Native APK
on: workflow_dispatch
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          set +e
          pip install --quiet pillow > /tmp/gen.txt 2>&1
          for f in gn_a gn_b gn_c gn_d gn_e gn_f gn_g gn_h gn_i; do python3 $f.py >> /tmp/gen.txt 2>&1; done
          SRC=android/app/src/main/java/online/mytempmail/app
          sed -i 's|__VER__|2.5|' $SRC/Config.java
          sed -i 's|setContentView(R.layout.activity_main);|setContentView(R.layout.activity_main);\n        Config.apply(this);|' $SRC/MainActivity.java
          sed -i 's|versionName "2.0"|versionName "2.5"|' android/app/build.gradle
          sed -i 's|versionCode 2|versionCode 7|' android/app/build.gradle
          grep -c 'Config.apply' $SRC/MainActivity.java
          cd android
          gradle wrapper --gradle-version 8.7 >> /tmp/gen.txt 2>&1
          ./gradlew assembleDebug --no-daemon > /tmp/b.txt 2>&1
          GR=$?
          {
            echo "gradle exit: $GR"
            echo "=== apk ==="
            ls -la app/build/outputs/apk/debug/ 2>&1
            echo "=== errors ==="
            grep -iE "error:|FAILED|What went wrong|AAPT" /tmp/b.txt | head -30
          } > /tmp/iss.txt 2>&1
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s /tmp/iss.txt ]; then echo "no log" > /tmp/iss.txt; fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "config receive build" --body-file /tmp/iss.txt || true
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            cp "$APK" /tmp/OffexMail-v2.5.apk
            gh release create v2.5 /tmp/OffexMail-v2.5.apk --repo "$GITHUB_REPOSITORY" --title "Offex Mail v2.5" --notes "Reads remote config: notification, banner, update" || gh release upload v2.5 /tmp/OffexMail-v2.5.apk --clobber --repo "$GITHUB_REPOSITORY"
          fi
