name: Build Native APK
on: workflow_dispatch
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          set +e
          # ---- 1) remove turnstile from proxy worker ----
          sed -i 's/const ok = await turnstileOk(request, env);/const ok = true;/' offex-proxy-worker.js
          sed -i '/challenges.cloudflare.com\/turnstile/d' public/index.html
          sed -i '/class="cf-turnstile"/d' public/index.html
          git config user.email "actions@users.noreply.github.com"
          git config user.name "actions"
          git add offex-proxy-worker.js public/index.html
          git commit -m "remove turnstile captcha (app + site)" || echo "no change"
          git push || true
          echo "--- worker deploy ---" > /tmp/w.txt
          npx --yes wrangler deploy --config wrangler.worker.toml >> /tmp/w.txt 2>&1
          echo "worker exit: $?" >> /tmp/w.txt
          # ---- 2) build app with English onboarding ----
          pip install --quiet pillow > /tmp/gen.txt 2>&1
          python3 gn_a.py >> /tmp/gen.txt 2>&1
          python3 gn_b.py >> /tmp/gen.txt 2>&1
          python3 gn_c.py >> /tmp/gen.txt 2>&1
          python3 gn_d.py >> /tmp/gen.txt 2>&1
          S=android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="ob1_body">.*</string>|<string name="ob1_body">Get a private disposable inbox in one tap - for OTPs, verification links and test emails.</string>|' $S
          sed -i 's|<string name="ob2_body">.*</string>|<string name="ob2_body">The app keeps checking in the background, so you get a notification the moment new mail arrives.</string>|' $S
          sed -i 's|<string name="ob3_body">.*</string>|<string name="ob3_body">No account, no password. Every inbox expires on its own after a while.</string>|' $S
          sed -i 's|<string name="no_messages">.*</string>|<string name="no_messages">No mail yet. Paste this address wherever you need it and mail will land here.</string>|' $S
          sed -i 's|versionName "2.0"|versionName "2.1"|' android/app/build.gradle
          sed -i 's|versionCode 2|versionCode 3|' android/app/build.gradle
          SRC=android/app/src/main/java/online/mytempmail/app
          sed -i 's/boolean notify()/boolean notifyOn()/g' $SRC/Prefs.java
          sed -i 's/Prefs\.notify()/Prefs.notifyOn()/g' $SRC/Notifier.java $SRC/AdminActivity.java
          cd android
          gradle wrapper --gradle-version 8.7 >> /tmp/gen.txt 2>&1
          ./gradlew assembleDebug --no-daemon > /tmp/b.txt 2>&1
          GR=$?
          {
            echo "gradle exit: $GR"
            echo "=== worker ==="
            tail -c 700 /tmp/w.txt
            echo "=== strings ==="
            grep -E 'ob1_body|ob2_body|no_messages' $S
            echo "=== apk ==="
            ls -la app/build/outputs/apk/debug/ 2>&1
            echo "=== errors ==="
            grep -iE "error:|FAILED|What went wrong" /tmp/b.txt | head -30
          } > /tmp/iss.txt 2>&1
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s /tmp/iss.txt ]; then echo "no log" > /tmp/iss.txt; fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "captcha removed + apk" --body-file /tmp/iss.txt || true
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            cp "$APK" /tmp/OffexMail-v2.1.apk
            gh release create v2.1 /tmp/OffexMail-v2.1.apk --repo "$GITHUB_REPOSITORY" --title "Offex Mail v2.1" --notes "Captcha removed, English onboarding" || gh release upload v2.1 /tmp/OffexMail-v2.1.apk --clobber --repo "$GITHUB_REPOSITORY"
          fi
