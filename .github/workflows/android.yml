name: Build Native APK
on: workflow_dispatch
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          set +e
          pip install --quiet pillow > /tmp/gen.txt 2>&1
          python3 gn_a.py >> /tmp/gen.txt 2>&1
          python3 gn_b.py >> /tmp/gen.txt 2>&1
          python3 gn_c.py >> /tmp/gen.txt 2>&1
          python3 gn_d.py >> /tmp/gen.txt 2>&1
          ls -R android/app/src/main >> /tmp/gen.txt 2>&1
          cd android
          gradle wrapper --gradle-version 8.7 >> /tmp/gen.txt 2>&1
          ./gradlew assembleDebug --no-daemon > /tmp/b.txt 2>&1
          GR=$?
          {
            echo "gradle exit: $GR"
            echo "=== generator ==="
            tail -c 800 /tmp/gen.txt
            echo "=== apk ==="
            ls -la app/build/outputs/apk/debug/ 2>&1
            echo "=== errors ==="
            grep -iE "error:|FAILED|What went wrong|Caused by|error" /tmp/b.txt | head -40
            echo "=== tail ==="
            tail -c 1000 /tmp/b.txt
          } > /tmp/iss.txt 2>&1
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s /tmp/iss.txt ]; then echo "no log captured - early failure" > /tmp/iss.txt; fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "native apk build" --body-file /tmp/iss.txt || true
