name: Build Native APK
on: workflow_dispatch
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          set +e
          pip install --quiet pillow > /tmp/gen.txt 2>&1
          for f in gn_a gn_b gn_c gn_d gn_e gn_f gn_g gn_h gn_i gn_j gn_k gn_l gn_m gn_n gn_o gn_p gn_q gn_r gn_s gn_t gn_u gn_v gn_w gn_x gn_y gn_z gn_aa gn_ab gn_ac gn_ad; do python3 $f.py >> /tmp/gen.txt 2>&1; done
          SRC=android/app/src/main/java/online/mytempmail/app
          UA='Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Mobile Safari/537.36'
          sed -i "s|OffexMail-Android/2.0|$UA|" $SRC/ApiClient.java
          sed -i 's|__VER__|4.7|' $SRC/Config.java
          sed -i '/AdminActivity/d' android/app/src/main/AndroidManifest.xml
          sed -i 's|versionName \"[^\"]*\"|versionName \"4.7\"|' android/app/build.gradle
          sed -i 's|versionCode [0-9]*|versionCode 37|' android/app/build.gradle
          grep -c 'AdminActivity' android/app/src/main/AndroidManifest.xml
          cd android
          gradle wrapper --gradle-version 8.7 >> /tmp/gen.txt 2>&1
          ./gradlew assembleDebug --no-daemon > /tmp/b.txt 2>&1
          GR=$?
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -f "$APK" ] && [ -n "$BT" ]; then
            "$BT/apksigner" sign --ks ../offex.keystore --ks-pass pass:offexpass123 --key-pass pass:offexpass123 --out /tmp/OffexMail.apk "$APK" >> /tmp/b.txt 2>&1
          fi
          cd ..
          if [ -f /tmp/OffexMail.apk ]; then
            cp /tmp/OffexMail.apk public/OffexMail.apk
            cp /tmp/OffexMail.apk public/OffexMail-v4.7.apk
            npx --yes wrangler pages deploy public --project-name offex-mail --branch main --commit-dirty=true > /tmp/p.txt 2>&1
            echo "pages exit: $?"
          fi
          {
            echo "gradle exit: $GR"
            ls -la public/OffexMail-v4.7.apk 2>&1
            echo "=== errors ==="
            grep -iE "error:|FAILED|What went wrong|AAPT" /tmp/b.txt | head -25
          } > /tmp/iss.txt 2>&1
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s /tmp/iss.txt ]; then echo "no log" > /tmp/iss.txt; fi
          gh issue create --repo \"$GITHUB_REPOSITORY\" --title \"v4.7 build\" --body-file /tmp/iss.txt || true
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/OffexMail.apk ]; then
            gh release create v4.7 /tmp/OffexMail.apk --repo \"$GITHUB_REPOSITORY\" --title \"Offex Mail v4.7\" --notes \"v4.7 changes: the main screen is now the supplied HTML UI rendered in a WebView, so it matches the approved design exactly and can be updated remotely later. The HTML is bundled as app/src/main/assets/offex_ui.html with everything inlined (CSS + SVG icons, no external requests). A JavaScript interface (OffexNative) bridges the page to the EXISTING native code - createInbox, refresh, deleteInbox, copyAddress, openMessage, switchTo, deleteSaved, openSettings, openMore, pickDomain, nav and openLink all call the same methods/API the old buttons did, so no business logic was reimplemented. Java pushes live data into the page via window.OffexUI.render(state): current address, message list (sender/subject/tags/timestamp/otp), saved inboxes, the N-new count, the live/expiry status, the section toggles, the announcement/banner text, and the remote appearance (accent/gradient/radius/titles) as CSS variables. An FCM push now refreshes the open WebView and still posts the system notification. Every view id the generated Java looks up is kept in the layout under the WebView, so nothing else had to change: the same API endpoints/JSON fields, the support screen, the bundled notification sounds, the AdMob placements, the notification-permission gate, the 7-locale multi-language support (English default + Hindi Devanagari + es/pt/ar/ru/in, driven by string resources), the install analytics, the OTP precision fix, the tappable verification links and the circular logo. Version bumped 4.6 to 4.7.\" || gh release upload v4.7 /tmp/OffexMail.apk --clobber --repo \"$GITHUB_REPOSITORY\"
          fi
