name: apply-seo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply favicon + sitemap fixes
        run: |
          set -e
          python3 -m pip install --quiet pillow
          python3 fix_seo.py
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          git add public/
          git commit -m "fix: real favicon (svg+ico) on all pages + complete sitemap.xml (366 urls)" || echo "no changes"
          git push
