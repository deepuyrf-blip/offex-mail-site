name: Set CF redirect
on:
  workflow_dispatch:
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - name: Create redirect rule
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "=== token check ==="
          curl -s -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | head -c 300; echo
          echo "=== zones visible to token ==="
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/zones?per_page=50" | python3 -c "import sys,json;d=json.load(sys.stdin);print('ok',d.get('success'));[print(z['name'],z['id']) for z in (d.get('result') or [])]"
          echo "=== put redirect ruleset ==="
          cat > /tmp/body.json <<'JSON'
          {"rules":[{"action":"redirect","action_parameters":{"from_value":{"status_code":301,"target_url":{"expression":"concat(\"https://mytemp-mail.online\", http.request.uri.path)"},"preserve_query_string":true}},"expression":"(http.host eq \"tempmail.offexmail.online\")","description":"tempmail subdomain -> main domain"}]}
          JSON
          curl -s -X PUT -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/body.json \
            "https://api.cloudflare.com/client/v4/zones/5c5fca6f2e8bf44362a8ca850dbb3b76/rulesets/phases/http_request_dynamic_redirect/entrypoint" | head -c 900; echo
