name: Set CF redirect
on: workflow_dispatch
permissions:
  contents: write
  issues: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          python3 patch_adblock.py > /tmp/o.txt 2>&1
          sed -i 's|/i18n.js?v=6|/i18n.js?v=7|' public/index.html
          git config user.email "actions@users.noreply.github.com"
          git config user.name "actions"
          git add public/i18n.js public/index.html
          git commit -m "feat(site): ad-blocker gate overlay + 10-language message" >> /tmp/o.txt 2>&1 || echo "no change" >> /tmp/o.txt
          git push >> /tmp/o.txt 2>&1
          head -c 3000 /tmp/o.txt > /tmp/iss.txt
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "adblock patch results" --body-file /tmp/iss.txt
