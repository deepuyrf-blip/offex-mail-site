name: Set CF redirect
on: workflow_dispatch
permissions:
  contents: read
  issues: write
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          pip install -q -U huggingface_hub
          python3 go_private.py > /tmp/o.txt 2>&1
          head -c 5000 /tmp/o.txt > /tmp/iss.txt
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "go-private results" --body-file /tmp/iss.txt
