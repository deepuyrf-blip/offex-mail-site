name: Set CF redirect
on: workflow_dispatch
permissions:
  contents: write
  issues: write
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          grep -n 'isHistory' offex-proxy-worker.js
          sed -i 's|const isHistory = path === "/history" \|\| path.startsWith("/history/");|const isHistory = path === "/history" \|\| path.startsWith("/history/") \|\| path === "/admin" \|\| path.startsWith("/admin/");|' offex-proxy-worker.js
          echo "--- after ---"
          grep -n 'isHistory' offex-proxy-worker.js
          git config user.email "actions@users.noreply.github.com"
          git config user.name "actions"
          git add offex-proxy-worker.js
          git commit -m "allow /admin through proxy" || echo "no change"
          git push || true
          npx --yes wrangler deploy --config wrangler.worker.toml > /tmp/w.txt 2>&1
          echo "worker exit: $?"
          tail -c 900 /tmp/w.txt
