name: Set CF redirect
on: workflow_dispatch
permissions:
  contents: read
  issues: write
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          python3 fix_redirect.py > /tmp/o.txt 2>&1
          echo "" >> /tmp/o.txt
          for h in audio.offexmail.online audia.offexmail.online offexmail.online; do
            echo -n "$h -> " >> /tmp/o.txt
            curl -s -o /dev/null -w "%{http_code} %{redirect_url}\n" --max-time 30 "https://$h/" >> /tmp/o.txt 2>&1
          done
          head -c 4000 /tmp/o.txt > /tmp/iss.txt
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "redirect results" --body-file /tmp/iss.txt
