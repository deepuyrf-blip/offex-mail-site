name: Set CF redirect
on: workflow_dispatch
permissions:
  contents: read
  issues: write
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          python3 verify_pwa.py > /tmp/o.txt 2>&1
          head -c 3000 /tmp/o.txt > /tmp/iss.txt
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "pwa verify results" --body-file /tmp/iss.txt
