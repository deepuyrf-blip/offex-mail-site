name: Temp isolate verify
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify app-ui isolate fix and live endpoint signature
        run: |
          fail=0
          check() {
            if [ "$2" = "$3" ]; then echo "PASS  $1  ($3)"; else echo "FAIL  $1  expected=$2 got=$3"; fail=1; fi
          }
          echo "===== APP-UI PAGE ====="
          CODE=$(curl -s -o appui.html -w '%{http_code}' --max-time 45 https://offexmail.online/app-ui)
          check "app-ui HTTP 200" "200" "$CODE"
          echo "app-ui bytes: $(wc -c < appui.html)"
          check "isolation fix marker ISOLATE_PARSE_FIX_2026" "1" "$(grep -cF 'ISOLATE_PARSE_FIX_2026' appui.html)"
          check "sepModelParam helper present" "1" "$(grep -cF 'function sepModelParam' appui.html)"
          check "Fast maps to Faster" "1" "$(grep -cF 'Fast":"Faster' appui.html)"
          check "vocals player wired" "1" "$(grep -cF 'audioVocals").src' appui.html)"
          check "bgm player wired" "1" "$(grep -cF 'audioBgm").src' appui.html)"
          check "two-output parse fileUrl(arr[0])" "1" "$(grep -cF 'fileUrl(arr[0])' appui.html)"
          check "isolation screen scr-isolate present" "1" "$(grep -cF 'scr-isolate' appui.html)"
          check "root page HTTP 200" "200" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 https://offexmail.online/)"
          echo ""
          echo "===== LIVE ENDPOINT SIGNATURE ====="
          curl -s --max-time 45 "https://offexmail.online/hf/gradio_api/info" -o info.json -w "info HTTP %{http_code}\n"
          echo "info bytes: $(wc -c < info.json)"
          python3 - <<'PY'
          import json
          d = json.load(open("info.json"))
          named = d.get("named_endpoints", {})
          ep = named.get("/isolate_voice_bgm")
          print("endpoint /isolate_voice_bgm present:", bool(ep))
          if ep:
              print("PARAMETERS:")
              for p in ep.get("parameters", []):
                  t = p.get("type", {})
                  choices = t.get("enum") if isinstance(t, dict) else None
                  print("  - name=%s | label=%s | component=%s | default=%s | choices=%s"
                        % (p.get("parameter_name"), p.get("label"), p.get("component"),
                           p.get("parameter_default"), choices))
              print("OUTPUTS (order matters):")
              for i, r in enumerate(ep.get("returns", [])):
                  ty = r.get("type", {})
                  ty = ty.get("type") if isinstance(ty, dict) else ty
                  print("  [%d] %s | type=%s" % (i, r.get("label"), ty))
          print("all named endpoints:", list(named.keys()))
          PY
          echo ""
          if [ "$fail" = "0" ]; then echo "ALL LIVE CHECKS PASSED"; else echo "SOME LIVE CHECKS FAILED"; exit 1; fi
