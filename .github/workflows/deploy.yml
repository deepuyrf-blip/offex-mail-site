name: Deploy Offex Mail site
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy Offex Mail (temp mail site)
        run: |
          npx --yes wrangler@3 pages project create offex-mail --production-branch=main || true
          echo "${{ secrets.HF_TOKEN }}" | npx --yes wrangler@3 pages secret put HF_TOKEN --project-name=offex-mail
          npx --yes wrangler@3 pages deploy public --project-name=offex-mail --branch=main
      - name: Deploy Offex Audio (with Monetag sw.js, keeping AdSense)
        run: |
          mkdir -p ad
          cp audio/index.html audio/about.html audio/blog.html audio/contact.html audio/privacy.html audio/terms.html ad/
          cp audio/clean-background-noise-voice-recordings.html audio/podcast-editing-workflow-for-beginners.html ad/
          cp audio/remove-silence-from-audio-guide.html audio/voice-bgm-separation-explained.html ad/
          cp audio/_worker.js audio/favicon.svg audio/robots.txt audio/sitemap.xml audio/ads.txt audio/sw.js ad/
          echo "== deploying these files =="; ls -la ad
          npx --yes wrangler@3 pages deploy ad --project-name=audio --branch=main
      - name: Verify
        run: |
          echo "offexmail root    : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://offexmail.online/)"
          echo "offexmail sw.js   : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://offexmail.online/sw.js)"
          echo "offexmail about   : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://offexmail.online/about.html)"
          echo "adsense meta kept : $(curl -s --max-time 30 https://offexmail.online/ | grep -c 'ca-pub-7802179098119853')"
          echo "tempmail sw.js    : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://tempmail.offexmail.online/sw.js)"
