name: Deploy Offex Mail site
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy Offex Mail (temp mail)
        run: |
          npx --yes wrangler@3 pages project create offex-mail --production-branch=main || true
          echo "${{ secrets.HF_TOKEN }}" | npx --yes wrangler@3 pages secret put HF_TOKEN --project-name=offex-mail
          npx --yes wrangler@3 pages deploy public --project-name=offex-mail --branch=main
      - name: Deploy Offex Audio
        run: |
          mkdir -p ad
          cp audio/*.html audio/_worker.js audio/_headers audio/favicon.svg audio/robots.txt audio/sitemap.xml audio/ads.txt audio/sw.js audio/promo.js audio/styles.css audio/audio-engine.js audio/gradio_client.js ad/
          npx --yes wrangler@3 pages deploy ad --project-name=audio --branch=main
      - name: Verify
        run: |
          M=$(curl -sL --max-time 30 https://tempmail.offexmail.online/)
          echo "MAIL load       : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://tempmail.offexmail.online/)"
          echo "MAIL detectOtp  : $(echo "$M" | grep -c 'detectOtp')"
          echo "MAIL otp-badge  : $(echo "$M" | grep -c 'otp-badge')"
          echo "MAIL otp-bar    : $(echo "$M" | grep -c 'otp-bar')"
          echo "MAIL autoOpened : $(echo "$M" | grep -c 'autoOpened')"
          echo "MAIL adsterra(0): $(echo "$M" | grep -c 'highperformanceformat\|profitableratecpmnetwork')"
          echo "AUDIO load      : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://offexmail.online/)"
          echo "AUDIO app-ui    : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://offexmail.online/app-ui)"
          echo "AUDIO app-ui htm: $(curl -s --max-time 30 https://offexmail.online/app-ui | grep -c 'scr-remove')"
          echo "AUDIO app-ui ver: $(curl -s --max-time 30 https://offexmail.online/app-ui | grep -c 'APPUI_VERSION=2.2')"
          echo "AUDIO upbox    : $(curl -s --max-time 30 https://offexmail.online/app-ui | grep -c 'OA-UPBOX-NAME-PCT')"
          echo "AUDIO upbox sel: $(curl -s --max-time 30 https://offexmail.online/app-ui | grep -c 'OA-UPBOX-SEL')"
          echo "AUDIO viz      : $(curl -s --max-time 30 https://offexmail.online/app-ui | grep -c 'OA-VIZ')"
          echo "AUDIO panel    : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 'https://api.mytemp-mail.online/audio-admin?code=Hyco')"
          echo "AUDIO app-ui cc : $(curl -sI --max-time 30 https://offexmail.online/app-ui | grep -i '^cache-control' | tr -d '\r')"
