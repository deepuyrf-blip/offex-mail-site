name: Deploy Offex Mail site
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy Offex Mail (temp mail)
        run: |
          npx --yes wrangler@3 pages project create offex-mail --production-branch=main || true
          echo "${{ secrets.HF_TOKEN }}" | npx --yes wrangler@3 pages secret put HF_TOKEN --project-name=offex-mail
          npx --yes wrangler@3 pages deploy public --project-name=offex-mail --branch=main
      - name: Deploy Offex Audio
        run: |
          mkdir -p ad
          cp audio/*.html audio/_worker.js audio/favicon.svg audio/robots.txt audio/sitemap.xml audio/ads.txt audio/sw.js audio/promo.js ad/
          npx --yes wrangler@3 pages deploy ad --project-name=audio --branch=main
      - name: Verify
        run: |
          H=$(curl -sL --max-time 30 https://tempmail.offexmail.online/)
          echo "MAIL monetag (want 0)   : $(echo "$H" | grep -c 'quge5')"
          echo "MAIL adsterra (want 0)  : $(echo "$H" | grep -c 'highperformanceformat\|profitableratecpmnetwork')"
          echo "MAIL ad slot hidden     : $(echo "$H" | grep -c 'id=.adSlot. style=.display:none.')"
          echo "MAIL page loads (200)   : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://tempmail.offexmail.online/)"
          echo "MAIL reward gate intact : $(echo "$H" | grep -c 'id=.rewardOv.')"
          echo "AUDIO monetag (want 0)  : $(curl -sL --max-time 30 https://offexmail.online/ | grep -c 'quge5')"
