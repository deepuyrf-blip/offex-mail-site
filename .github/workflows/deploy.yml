name: Deploy Offex Mail site
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy Offex Mail (temp mail)
        run: |
          npx --yes wrangler@3 pages project create offex-mail --production-branch=main || true
          echo "${{ secrets.HF_TOKEN }}" | npx --yes wrangler@3 pages secret put HF_TOKEN --project-name=offex-mail
          npx --yes wrangler@3 pages deploy public --project-name=offex-mail --branch=main
      - name: Deploy Offex Audio
        run: |
          mkdir -p ad
          cp audio/*.html audio/_worker.js audio/favicon.svg audio/robots.txt audio/sitemap.xml audio/ads.txt audio/sw.js audio/promo.js ad/
          npx --yes wrangler@3 pages deploy ad --project-name=audio --branch=main
      # Ad-config Worker. Non-fatal: needs "Workers KV Storage: Edit" on the API token.
      - name: Deploy ad-config Worker (offex-ads)
        continue-on-error: true
        working-directory: ad-worker
        run: |
          npx --yes wrangler@3 kv:namespace create AD_CONFIG --json > /tmp/kv.json 2>/dev/null || true
          KV_ID=$(python3 -c "import json;print(json.load(open('/tmp/kv.json'))['id'])" 2>/dev/null || true)
          if [ -z "$KV_ID" ]; then
            npx --yes wrangler@3 kv:namespace list --json > /tmp/kvl.json 2>/dev/null || true
            KV_ID=$(python3 -c "import json;d=json.load(open('/tmp/kvl.json'));print([x['id'] for x in d if 'AD_CONFIG' in x.get('title','')][0])" 2>/dev/null || true)
          fi
          echo "KV_ID=$KV_ID"
          if [ -z "$KV_ID" ]; then echo "::warning::KV namespace unavailable - add Workers KV Storage:Edit to the API token"; exit 0; fi
          sed "s/__KV_ID__/$KV_ID/" wrangler.toml > wrangler.run.toml
          npx --yes wrangler@3 deploy --config wrangler.run.toml
      - name: Verify
        run: |
          echo "MAIL page  : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://tempmail.offexmail.online/)"
          echo "AUDIO page : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://offexmail.online/)"
          echo "worker     : $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 'https://offex-ads.deepu-yrf.workers.dev/?site=mail')"
