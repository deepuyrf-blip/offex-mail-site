name: Build Offex Audio APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate project, build and sign the APK
        run: |
          set -euo pipefail
          pip install --quiet pillow
          for f in gna_1 gna_2 gna_3 gna_4 gna_5 gna_6; do
            echo "== generating $f =="
            python3 "$f.py"
          done
          echo "== project tree =="
          find android-audio -type f | sort
          cd android-audio
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "=== apk files produced by gradle ==="
          find app/build/outputs -name '*.apk' -print || true
          if [ ! -f "$APK" ]; then
            echo "::error::gradle finished but no APK was produced at android-audio/$APK"
            exit 1
          fi
          BT=$(ls -d "${ANDROID_HOME:-}"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "${BT:-}" ]; then
            echo "::error::no Android build-tools found under ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            exit 1
          fi
          echo "using build-tools: $BT"
          "$BT/apksigner" sign --ks ../offex.keystore --ks-pass pass:offexpass123 --key-pass pass:offexpass123 --out /tmp/OffexAudio.apk "$APK"
          cd ..
          if [ ! -f /tmp/OffexAudio.apk ]; then
            echo "::error::signing did not produce the expected APK at /tmp/OffexAudio.apk"
            exit 1
          fi
          ls -la /tmp/OffexAudio.apk
          "$BT/apksigner" verify --print-certs /tmp/OffexAudio.apk || true
      - name: Create or update GitHub Release audio-v1.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/notes.txt <<'NOTES'
          Offex Audio v1.1 - Android app for the Offex Audio website (offexmail.online).

          * FIXED: the tools now actually work. The app loads the REAL audio site in the
            WebView, so uploads show the real %, processing runs on the real Gradio/Hugging
            Face flow, and results are genuine. The old local file:// shell and the native
            request-interception that faked an instant "job finished" are removed.
          * Native shell kept: bottom tabs (Remove Silence / Enhance Audio / Voice-BGM /
            History / More), native notifications, Downloads-folder saving, History store,
            ads, and the multi-language switcher.
          * Tabs drive the loaded site (JS scrollIntoView) so you use the REAL tool UI.
          * File chooser (ACTION_OPEN_DOCUMENT, audio/* + video/*) works with the real page.
          * Downloads: page-triggered results and a native "Save result" button both save
            to the device's Downloads folder.
          * Multi-language: English, Hindi, Spanish, Portuguese, Arabic (RTL), Russian, Indonesian.
          * AdMob placements wired with Google's official TEST unit ids (panel-overridable).
          * Local History of finished jobs with re-download.

          Backend: the loaded site talks to the Hugging Face Space through its own /hf proxy
          (offexmail.online/hf); the site's Live badge reflects the real backend state.
          NOTES
          if ! gh release view audio-v1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create audio-v1.1 --repo "$GITHUB_REPOSITORY" --title "Offex Audio v1.1" --notes-file /tmp/notes.txt || true
          fi
          gh release edit audio-v1.1 --repo "$GITHUB_REPOSITORY" --title "Offex Audio v1.1" --notes-file /tmp/notes.txt --draft=false
          gh release upload audio-v1.1 /tmp/OffexAudio.apk --clobber --repo "$GITHUB_REPOSITORY"
          echo "=== release audio-v1.1 ==="
          gh release view audio-v1.1 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,assets
