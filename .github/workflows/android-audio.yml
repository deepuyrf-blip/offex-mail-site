name: Build Offex Audio APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate project, build and sign the APK
        run: |
          set -euo pipefail
          pip install --quiet pillow
          for f in gna_1 gna_2 gna_3 gna_4 gna_5 gna_6; do
            echo "== generating $f =="
            python3 "$f.py"
          done
          echo "== project tree =="
          find android-audio -type f | sort
          echo "== confirm the bundled custom UI + gradio client are present =="
          test -f android-audio/app/src/main/assets/offex_audio_ui.html || { echo "::error::bundled UI asset missing"; exit 1; }
          test -f android-audio/app/src/main/assets/gradio_client.js || { echo "::error::gradio client asset missing"; exit 1; }
          echo "== confirm the website-loading approach is gone =="
          if grep -Rqs "file:///android_asset" android-audio/app/src/main/java; then
            echo "::error::file:// asset loading still present"; exit 1
          fi
          if grep -Rqs "BackendProxy" android-audio/app/src/main/java; then
            echo "::error::native request interception still present"; exit 1
          fi
          echo "== confirm the app loads the site-hosted custom UI (same origin as /hf) =="
          grep -qs "https://offexmail.online/app-ui" android-audio/app/src/main/java/online/offexaudio/app/MainActivity.java || { echo "::error::app UI URL not set to https://offexmail.online/app-ui"; exit 1; }
          if grep -Rqs "appassets.androidplatform.net" android-audio/app/src/main/java; then
            echo "::error::appassets origin still present"; exit 1
          fi
          if grep -Rqs "WebViewAssetLoader" android-audio/app/src/main/java; then
            echo "::error::WebViewAssetLoader still present"; exit 1
          fi
          cd android-audio
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "=== apk files produced by gradle ==="
          find app/build/outputs -name '*.apk' -print || true
          if [ ! -f "$APK" ]; then
            echo "::error::gradle finished but no APK was produced at android-audio/$APK"
            exit 1
          fi
          BT=$(ls -d "${ANDROID_HOME:-}"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "${BT:-}" ]; then
            echo "::error::no Android build-tools found under ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            exit 1
          fi
          echo "using build-tools: $BT"
          "$BT/apksigner" sign --ks ../offex.keystore --ks-pass pass:offexpass123 --key-pass pass:offexpass123 --out /tmp/OffexAudio.apk "$APK"
          cd ..
          if [ ! -f /tmp/OffexAudio.apk ]; then
            echo "::error::signing did not produce the expected APK at /tmp/OffexAudio.apk"
            exit 1
          fi
          ls -la /tmp/OffexAudio.apk
          "$BT/apksigner" verify --print-certs /tmp/OffexAudio.apk || true
      - name: Create or update GitHub Release audio-v1.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/notes.txt <<'NOTES'
          Offex Audio v1.3 - Android app for the Offex Audio service (offexmail.online).

          * The app's OWN custom UI (the dark futuristic design with five tabs -
            Remove Silence / Enhance Audio / Voice-BGM / History / More, each with a
            file zone, options, a live progress meter and a result player) is now
            HOSTED ON THE SITE and loaded from https://offexmail.online/app-ui.
          * WHY: it shares the site's origin with the /hf proxy and /health, so the
            page's fetch/XHR/WebSocket calls are same-origin - the CORS problem that
            broke the Gradio/HF job flow in v1.2 is gone. No HF token in the app; the
            Cloudflare Pages worker injects it server-side.
          * REAL Gradio flow from that page: connect to https://offexmail.online/hf ->
            upload the file with real xhr.upload progress -> submit to /process_audio /
            /enhance_audio / /isolate_voice_bgm -> stream real progress -> resolve the
            real result URL. No fake instant completion.
          * Remove Silence default threshold is 0.02.
          * Native features kept: bottom tab bar driving the page, file chooser
            (onShowFileChooser -> ACTION_OPEN_DOCUMENT, audio/* + video/*, persisted
            read grant), saving results to the Downloads folder, notification-permission
            gate + FCM/local notifications, the History store, the multi-language
            switcher (English default + Hindi Devanagari + es/pt/ar/ru/in), and the
            AdMob placements wired with Google's official TEST unit ids
            (app ~3347511713, banner /6300978111, interstitial /1033173712,
            rewarded /5224354917, app-open /9257395921, native /2247696110),
            all panel-overridable.
          * Version bumped 1.2 -> 1.3 (versionCode 4).
          NOTES
          if ! gh release view audio-v1.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create audio-v1.3 --repo "$GITHUB_REPOSITORY" --title "Offex Audio v1.3" --notes-file /tmp/notes.txt || true
          fi
          gh release edit audio-v1.3 --repo "$GITHUB_REPOSITORY" --title "Offex Audio v1.3" --notes-file /tmp/notes.txt --draft=false
          gh release upload audio-v1.3 /tmp/OffexAudio.apk --clobber --repo "$GITHUB_REPOSITORY"
          echo "=== release audio-v1.3 ==="
          gh release view audio-v1.3 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,assets
