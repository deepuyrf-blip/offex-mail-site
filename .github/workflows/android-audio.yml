name: Build Offex Audio APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate project, build and sign the APK
        run: |
          set -euo pipefail
          pip install --quiet pillow
          for f in gna_1 gna_2 gna_3 gna_4 gna_5 gna_6; do
            echo "== generating $f =="
            python3 "$f.py"
          done
          echo "== project tree =="
          find android-audio -type f | sort
          echo "== confirm the bundled custom UI + gradio client are present =="
          test -f android-audio/app/src/main/assets/offex_audio_ui.html || { echo "::error::bundled UI asset missing"; exit 1; }
          test -f android-audio/app/src/main/assets/gradio_client.js || { echo "::error::gradio client asset missing"; exit 1; }
          echo "== confirm the website-loading approach is gone =="
          if grep -Rqs "file:///android_asset" android-audio/app/src/main/java; then
            echo "::error::file:// asset loading still present"; exit 1
          fi
          if grep -Rqs "BackendProxy" android-audio/app/src/main/java; then
            echo "::error::native request interception still present"; exit 1
          fi
          grep -qs "WebViewAssetLoader" android-audio/app/src/main/java/online/offexaudio/app/MainActivity.java || { echo "::error::WebViewAssetLoader not wired"; exit 1; }
          grep -qs "appassets.androidplatform.net" android-audio/app/src/main/java/online/offexaudio/app/MainActivity.java || { echo "::error::asset https origin not set"; exit 1; }
          cd android-audio
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "=== apk files produced by gradle ==="
          find app/build/outputs -name '*.apk' -print || true
          if [ ! -f "$APK" ]; then
            echo "::error::gradle finished but no APK was produced at android-audio/$APK"
            exit 1
          fi
          BT=$(ls -d "${ANDROID_HOME:-}"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "${BT:-}" ]; then
            echo "::error::no Android build-tools found under ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            exit 1
          fi
          echo "using build-tools: $BT"
          "$BT/apksigner" sign --ks ../offex.keystore --ks-pass pass:offexpass123 --key-pass pass:offexpass123 --out /tmp/OffexAudio.apk "$APK"
          cd ..
          if [ ! -f /tmp/OffexAudio.apk ]; then
            echo "::error::signing did not produce the expected APK at /tmp/OffexAudio.apk"
            exit 1
          fi
          ls -la /tmp/OffexAudio.apk
          "$BT/apksigner" verify --print-certs /tmp/OffexAudio.apk || true
      - name: Create or update GitHub Release audio-v1.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/notes.txt <<'NOTES'
          Offex Audio v1.2 - Android app for the Offex Audio website (offexmail.online).

          * RESTORED: the v1.0 custom, purpose-built UI (dark futuristic design; the
            app's OWN bundled HTML, NOT the website). Three tool tabs
            (Remove Silence / Enhance Audio / Voice-BGM) plus History and More, each
            with a file zone, options, a live progress meter and a result player.
          * FIXED the backend properly: the UI is now served from a REAL https origin
            (androidx.webkit WebViewAssetLoader -> https://appassets.androidplatform.net)
            instead of file://, so the page's normal fetch/XHR/WebSocket calls work.
            The v1.0 file:// + native request-interception (shouldInterceptRequest),
            which could not carry a POST body or a WebSocket and so faked an instant
            "job finished", is gone.
          * The page runs the REAL @gradio/client flow against the site's /hf proxy
            (https://offexmail.online/hf): connect -> upload the file (REAL upload %)
            -> submit the job -> stream the REAL processing progress -> fetch the
            result URL. No fake instant completion. The Live badge reads
            https://offexmail.online/health.
          * No HF token in the app - the Cloudflare proxy injects it server-side.
          * Remove Silence default threshold is 0.02 (as on the site).
          * Native features kept: bottom tab bar, file chooser (ACTION_OPEN_DOCUMENT,
            audio/* + video/*, persisted read grant), Downloads-folder saving,
            notification-permission gate + FCM/local notifications, History store,
            multi-language switcher (English default + Hindi + es/pt/ar/ru/in), and
            AdMob placements wired with Google's official TEST unit ids
            (panel-overridable).
          * Version bumped 1.1 -> 1.2 (versionCode 3).
          NOTES
          if ! gh release view audio-v1.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create audio-v1.2 --repo "$GITHUB_REPOSITORY" --title "Offex Audio v1.2" --notes-file /tmp/notes.txt || true
          fi
          gh release edit audio-v1.2 --repo "$GITHUB_REPOSITORY" --title "Offex Audio v1.2" --notes-file /tmp/notes.txt --draft=false
          gh release upload audio-v1.2 /tmp/OffexAudio.apk --clobber --repo "$GITHUB_REPOSITORY"
          echo "=== release audio-v1.2 ==="
          gh release view audio-v1.2 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,assets
