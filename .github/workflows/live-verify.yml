name: Live verify (temporary)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Live checks
        run: |
          set -u
          B="https://offexmail.online"
          CB="?cb=${{ github.run_id }}"
          H=$(curl -s --max-time 30 "$B/$CB")

          echo "== STATUS =="
          echo "home            : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$B/$CB")"
          for l in hi es pt ar ru id fr de; do
            echo "hub/$l          : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$B/$l/$CB")"
          done

          echo "== HOMEPAGE: OCCURRENCE COUNTS =="
          echo "oa-mosaic layer : $(printf '%s' "$H" | grep -o 'class="oa-mosaic" aria-hidden="true"' | wc -l)"
          echo "oa-row          : $(printf '%s' "$H" | grep -o 'class="oa-row"' | wc -l)"
          echo "oa-pill         : $(printf '%s' "$H" | grep -o 'class="oa-pill"' | wc -l)"
          echo "oa-hero-inner   : $(printf '%s' "$H" | grep -o 'class="oa-hero-inner"' | wc -l)"
          echo "hero h1         : $(printf '%s' "$H" | grep -o 'Cut the silence. Keep the signal.' | wc -l)"
          echo "hero-lede       : $(printf '%s' "$H" | grep -o 'class="hero-lede"' | wc -l)"
          echo "tool anchors    : $(printf '%s' "$H" | grep -o 'id="removeTool"\|id="enhanceTool"\|id="isolateTool"' | wc -l)"
          echo "tool-switcher   : $(printf '%s' "$H" | grep -o 'class="tool-switcher"' | wc -l)"
          echo "lang switcher   : $(printf '%s' "$H" | grep -o 'id="langSelect"' | wc -l)"
          echo "lang options    : $(printf '%s' "$H" | grep -o 'data-lang=' | wc -l)"
          echo "hreflang links  : $(printf '%s' "$H" | grep -o 'hreflang=' | wc -l)"
          echo "adsense meta    : $(printf '%s' "$H" | grep -o 'google-adsense-account' | wc -l)"
          echo "adsense script  : $(printf '%s' "$H" | grep -o 'adsbygoogle' | wc -l)"
          echo "css ?v=4 links  : $(printf '%s' "$H" | grep -o 'styles.css?v=4\|premium.css?v=4' | wc -l)"
          echo "live badge      : $(printf '%s' "$H" | grep -o 'id="footStatus"' | wc -l)"
          echo "heroWave        : $(printf '%s' "$H" | grep -o 'id="heroWave"' | wc -l)"
          echo "old stack order : $(printf '%s' "$H" | grep -o 'class="hero-wave" id="heroWave"></div><h1' | wc -l)  (expect 0)"

          echo "== LIVE premium.css RULES =="
          C=$(curl -s --max-time 30 "$B/premium.css?v=4&cb=${{ github.run_id }}")
          echo "bytes           : $(printf '%s' "$C" | wc -c)"
          echo "--- .oa-mosaic ---"
          printf '%s' "$C" | awk '/^\.oa-mosaic\{/{f=1} f{print} /^\}/{if(f){exit}}' | head -30
          echo "--- .oa-row ---"
          printf '%s' "$C" | awk '/^\.oa-row\{/{f=1} f{print} /^\}/{if(f){exit}}' | head -20
          echo "--- phone overrides ---"
          printf '%s' "$C" | grep -n -- '--mosaic-h:clamp(300px,80vw,344px)\|min-height:clamp(304px,86vw,348px)' | head
          echo "--- headers ---"
          curl -sI --max-time 30 "$B/premium.css?v=4&cb=${{ github.run_id }}" | grep -iE '^(HTTP|cache-control|content-type)' | tr -d '\r'

          echo "== /hf + /health =="
          echo "hf              : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$B/hf")"
          echo "health          : $(curl -s --max-time 30 "$B/health" | head -c 200)"
