name: Health check
on:
  workflow_dispatch:
jobs:
  hc:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - name: checks
        run: |
          set +e
          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Mobile Safari/537.36"
          MROOT=$(curl -s -o /tmp/m.html -w '%{http_code}' --max-time 30 -L -A "$UA" https://tempmail.offexmail.online/)
          MROOT2=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -L -A "$UA" https://mytemp-mail.online/)
          MSW=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -L -A "$UA" https://tempmail.offexmail.online/sw.js)
          MAPI=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -A "$UA" -H "Origin: https://tempmail.offexmail.online" -H "Referer: https://tempmail.offexmail.online/" https://api.mytemp-mail.online/api/status)
          MMON=$(grep -ci 'monetag' /tmp/m.html)
          echo "OFFEX MAIL: root_http=$MROOT, swjs_http=$MSW, proxy_http=$MAPI, monetag_tag=$MMON"
          echo "OFFEX MAIL EXTRA: root_mytemp=$MROOT2"
          AROOT=$(curl -s -o /tmp/a.html -w '%{http_code}' --max-time 30 -L -A "$UA" https://offexmail.online/)
          AROOT2=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -L -A "$UA" https://audio-2i8.pages.dev/)
          ASW=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -L -A "$UA" https://offexmail.online/sw.js)
          AMON=$(grep -ci 'monetag' /tmp/a.html)
          AADS=$(grep -ciE 'adsbygoogle|ca-pub-' /tmp/a.html)
          AHF=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -L -A "$UA" https://offexmail.online/health)
          AHF2=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -L -A "$UA" https://offexmail.online/hf/)
          echo "OFFEX AUDIO: root_http=$AROOT, swjs_http=$ASW, monetag_tag=$AMON, adsense_meta=$AADS, hf_proxy_http=$AHF"
          echo "OFFEX AUDIO EXTRA: root_pages=$AROOT2 health=$AHF hf_path=$AHF2"
          STAGE=$(curl -s --max-time 30 https://huggingface.co/api/spaces/hydui/ytvideo | python3 -c "import sys,json;print(json.load(sys.stdin).get('runtime',{}).get('stage'))" 2>/dev/null)
          echo "HF SPACE: space_stage=$STAGE"
          P=$(curl -s --max-time 40 "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects?per_page=100" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "CF RAW: $(echo "$P" | head -c 400)"
          echo "$P" | python3 -c "import sys,json;d=json.load(sys.stdin);names=[x.get('name') for x in (d.get('result') or [])];print('CF PROJECTS: offex_mail_project='+('offex-mail' if 'offex-mail' in names else 'MISSING')+', audio_project='+('audio' if 'audio' in names else 'MISSING'));print('CF ALL: '+','.join(names))"