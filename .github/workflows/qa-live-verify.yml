name: QA live verify
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Curl live site and check key markers
        run: |
          set +e
          BASE="https://mytemp-mail.online"
          PUB="ca-pub-9424904813990636"
          check() {
            url="$1"; shift
            body=$(curl -sL --max-time 40 -w "\n__CODE__%{http_code}" "$url")
            code=$(printf '%s' "$body" | tail -1 | sed 's/.*__CODE__//')
            html=$(printf '%s' "$body" | sed '$d')
            line="STATUS=$code URL=$url"
            for mk in "$@"; do
              if printf '%s' "$html" | grep -q -- "$mk"; then line="$line | $mk=OK"; else line="$line | $mk=MISSING"; fi
            done
            echo "$line"
          }
          echo "===== PAGES ====="
          check "$BASE/"            "canonical" "$PUB" "images/hero-inbox.svg" "hreflang" "detectOtp"
          check "$BASE/services"    "canonical" "$PUB"
          check "$BASE/amazon"      "canonical" "$PUB" "images/desktop-mobile.svg" "hreflang"
          check "$BASE/instagram"   "canonical" "$PUB" "hreflang"
          check "$BASE/netflix"     "canonical" "$PUB" "hreflang"
          check "$BASE/hi/"         "canonical" "$PUB" "hreflang"
          check "$BASE/es/"         "canonical" "$PUB" "hreflang"
          check "$BASE/de/"         "canonical" "$PUB" "hreflang"
          check "$BASE/blog/"       "canonical" "$PUB"
          check "$BASE/blog/how-disposable-inboxes-work" "canonical" "$PUB"
          check "$BASE/blog/temp-mail-safety-guide"      "canonical" "$PUB"
          check "$BASE/privacy"     "canonical" "$PUB"
          check "$BASE/terms"       "canonical" "$PUB"
          check "$BASE/disclaimer"  "canonical" "$PUB"
          check "$BASE/app-privacy" "canonical" "$PUB" "Offex Mail Android app privacy policy"
          check "$BASE/about"       "canonical"
          echo "===== ads.txt ====="
          curl -s -w "\nSTATUS=%{http_code}\n" "$BASE/ads.txt"
          echo "===== robots.txt ====="
          curl -s -w "\nSTATUS=%{http_code}\n" "$BASE/robots.txt"
          echo "===== sitemap.xml ====="
          curl -s -o /tmp/sm -w "STATUS=%{http_code} bytes=%{size_download}\n" "$BASE/sitemap.xml"
          echo "loc count      : $(grep -c '<loc>' /tmp/sm)"
          echo "app-privacy in : $(grep -c 'app-privacy' /tmp/sm)"
          echo "stale /youtube : $(grep -c '/youtube<' /tmp/sm)"
          echo "===== redirect for removed service ====="
          curl -s -o /dev/null -w "/youtube -> %{http_code} %{redirect_url}\n" "$BASE/youtube"
          echo "===== unknown path (expect 404) ====="
          curl -s -o /dev/null -w "/no-such-page-xyz -> %{http_code}\n" "$BASE/no-such-page-xyz"
