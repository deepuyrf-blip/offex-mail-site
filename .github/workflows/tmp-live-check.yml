name: tmp-live-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: bare vs browser headers
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36'
          ORIGIN='https://mytemp-mail.online'
          API=https://api.mytemp-mail.online
          echo "=== bare curl (default UA, no Origin/Referer) ==="
          curl -sS -o /dev/null -w "bare http=%{http_code}\n" --max-time 30 "$API/api/status" || true
          echo "=== browser UA + Origin + Referer ==="
          curl -sS -o /dev/null -w "browser http=%{http_code}\n" -A "$UA" -H "Origin: $ORIGIN" -H "Referer: $ORIGIN/" --max-time 30 "$API/api/status" || true
          echo "=== direct HF Space host /health ==="
          curl -sS -m 30 -A "$UA" "https://factblink514-compiled.hf.space/health" || true
          echo
          echo "=== direct HF Space host /api/status ==="
          curl -sS -m 30 -A "$UA" "https://factblink514-compiled.hf.space/api/status" || true
