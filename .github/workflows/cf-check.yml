name: cf-check
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  c:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      A: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - name: Check zones and email routing
        run: |
          set +e
          O=/tmp/o.txt
          : > "$O"
          echo "== zones ==" >> "$O"
          curl -s --max-time 30 -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/zones?per_page=50" | python3 -c "import sys,json;d=json.load(sys.stdin);[print(z['name'],z['id']) for z in (d.get('result') or [])]" >> "$O" 2>&1
          for zid in 5c5fca6f2e8bf44362a8ca850dbb3b76 900aba0bd69a63d84d137029b15da481; do
            echo "== email routing settings $zid ==" >> "$O"
            curl -s --max-time 30 -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/zones/$zid/email/routing" >> "$O" 2>&1
            echo >> "$O"
            echo "== catch_all $zid ==" >> "$O"
            curl -s --max-time 30 -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/zones/$zid/email/routing/rules/catch_all" >> "$O" 2>&1
            echo >> "$O"
            echo "== dns MX $zid ==" >> "$O"
            curl -s --max-time 30 -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/zones/$zid/dns_records?type=MX" | python3 -c "import sys,json;d=json.load(sys.stdin);[print(r['name'],r['content'],r['priority']) for r in (d.get('result') or [])]" >> "$O" 2>&1
          done
          head -c 8000 "$O" > /tmp/iss.txt
      - name: Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "cf-check results" --body-file /tmp/iss.txt
