name: cf-check
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Test multi-domain backend
        run: |
          set +e
          O=/tmp/o.txt
          : > "$O"
          B=https://factblink514-compiled.hf.space
          sleep 120
          echo "== /api/status ==" >> "$O"
          curl -s --max-time 60 "$B/api/status" | python3 -c "import sys,json;d=json.load(sys.stdin);print('domain:',d.get('domain'));print('domains:',d.get('domains'))" >> "$O" 2>&1
          echo "== create 8 random inboxes ==" >> "$O"
          for i in 1 2 3 4 5 6 7 8; do
            curl -s -X POST --max-time 60 -H 'content-type: application/json' -d '{}' "$B/api/inbox" | python3 -c "import sys,json;print(json.load(sys.stdin).get('address'))" >> "$O" 2>&1
          done
          echo "== forced mytemp-mail.online ==" >> "$O"
          curl -s -X POST --max-time 60 -H 'content-type: application/json' -d '{"domain":"mytemp-mail.online"}' "$B/api/inbox" >> "$O" 2>&1
          echo >> "$O"
          echo "== forced offexmail.online ==" >> "$O"
          curl -s -X POST --max-time 60 -H 'content-type: application/json' -d '{"domain":"offexmail.online"}' "$B/api/inbox" >> "$O" 2>&1
          echo >> "$O"
          head -c 6000 "$O" > /tmp/iss.txt
      - name: Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "multi-domain test results" --body-file /tmp/iss.txt
