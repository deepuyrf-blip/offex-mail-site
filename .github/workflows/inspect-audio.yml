name: Inspect audio site
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - name: Inspect
        run: |
          echo "== SIZE =="; curl -s --max-time 30 https://audio-2i8.pages.dev/ | wc -c
          echo "== HEAD =="; curl -s --max-time 30 https://audio-2i8.pages.dev/ | head -c 1200
          echo ""
          echo "== EXTERNAL REFS =="; curl -s --max-time 30 https://audio-2i8.pages.dev/ | grep -oE '(src|href)="[^"]+"' | sort -u | head -40
          echo "== PAGES PROJECT =="; curl -s --max-time 30 "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/audio-2i8" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | head -c 700
          echo ""
          echo "== PAGES PROJECT (audio) =="; curl -s --max-time 30 "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/audio" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | head -c 700
