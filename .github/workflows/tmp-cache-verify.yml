name: Temp verify cache-bust (delete me)
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live cache-bust on offexmail.online
        run: |
          set +e
          echo "===================== /app-ui ====================="
          echo "HTTP            : $(curl -s -o /tmp/appui -w '%{http_code}' --max-time 30 https://offexmail.online/app-ui)"
          echo "cache-control   : $(curl -sI --max-time 30 https://offexmail.online/app-ui | grep -i '^cache-control' | tr -d '\r')"
          echo "pragma          : $(curl -sI --max-time 30 https://offexmail.online/app-ui | grep -i '^pragma' | tr -d '\r')"
          echo "version marker  : $(grep -c 'APPUI_VERSION=2.0' /tmp/appui) occurrence(s) of APPUI_VERSION=2.0"
          echo "engine ref      : $(grep -o 'audio-engine.js?v=2' /tmp/appui | head -1)"
          echo "gradio ref      : $(grep -o 'gradio_client.js?v=2' /tmp/appui | head -1)"
          echo "sw-unregister   : $(grep -c 'retire any stale service worker' /tmp/appui) inline script block(s)"
          echo
          echo "===================== /sw.js ====================="
          echo "HTTP            : $(curl -s -o /tmp/sw -w '%{http_code}' --max-time 30 https://offexmail.online/sw.js)"
          echo "cache-control   : $(curl -sI --max-time 30 https://offexmail.online/sw.js | grep -i '^cache-control' | tr -d '\r')"
          echo "--- sw.js body (start) ---"
          cat /tmp/sw
          echo "--- sw.js body (end) ---"
          UNREG=$(grep -c 'self.registration.unregister' /tmp/sw || true)
          CDEL=$(grep -c 'caches.delete' /tmp/sw || true)
          FTH=$(grep -c "addEventListener('fetch')" /tmp/sw || true)
          echo "unregister call : $UNREG (expect 1)"
          echo "caches.delete   : $CDEL (expect 1)"
          echo "fetch handler   : $FTH (expect 0)"
          echo
          echo "===================== main pages (expect 200) ====================="
          for u in / /app-ui /about /contact /privacy /terms /blog /robots.txt /sitemap.xml /audio-engine.js /styles.css /promo.js /favicon.svg; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://offexmail.online$u)"
          done
          echo
          echo "===================== mail site ====================="
          echo "tempmail (follow) -> $(curl -sL -o /dev/null -w '%{http_code}' --max-time 30 https://tempmail.offexmail.online/)"
