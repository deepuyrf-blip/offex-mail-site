name: probe-api
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build functions and print routes
        run: |
          set +e
          OUT=/tmp/probe.txt
          : > "$OUT"
          echo "===== repo layout =====" >> "$OUT"
          ls -la >> "$OUT" 2>&1
          echo "--- functions tree ---" >> "$OUT"
          find functions -type f >> "$OUT" 2>&1
          echo "===== wrangler version =====" >> "$OUT"
          npx --yes wrangler@3 --version >> "$OUT" 2>&1
          echo "===== functions build =====" >> "$OUT"
          rm -rf /tmp/fx && npx --yes wrangler@3 pages functions build --outdir=/tmp/fx >> "$OUT" 2>&1
          echo "===== built files =====" >> "$OUT"
          find /tmp/fx -maxdepth 3 -type f >> "$OUT" 2>&1
          echo "===== routing config =====" >> "$OUT"
          for f in $(find /tmp/fx -name '*.json'); do echo "--- $f ---" >> "$OUT"; head -c 1500 "$f" >> "$OUT"; echo >> "$OUT"; done
          cat "$OUT"
      - name: Post results as an issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "probe-api build results" --body-file /tmp/probe.txt
