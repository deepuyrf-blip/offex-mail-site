name: probe-api
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Project info + redeploy with output
        run: |
          set +e
          OUT=/tmp/probe.txt
          : > "$OUT"
          echo "===== pages project offex-mail =====" >> "$OUT"
          curl -s --max-time 30 "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/offex-mail" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result') or {};print('name',r.get('name'));print('subdomain',r.get('subdomain'));print('domains',r.get('domains'));print('production_branch',r.get('production_branch'));print('source',json.dumps(r.get('source')));print('latest_deployment',json.dumps(r.get('latest_deployment'))[:1200])" >> "$OUT" 2>&1
          echo "===== latest deployment detail =====" >> "$OUT"
          curl -s --max-time 30 "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/offex-mail/deployments?per_page=2" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import sys,json;d=json.load(sys.stdin);print(json.dumps(d.get('result'),indent=1)[:2500])" >> "$OUT" 2>&1
          echo "===== redeploy (verbose) =====" >> "$OUT"
          npx --yes wrangler@3 pages deploy public --project-name=offex-mail --branch=main >> "$OUT" 2>&1
          cat "$OUT"
      - name: Post results as an issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "probe-api deploy results" --body-file /tmp/probe.txt
