name: probe-api
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fresh project test
        run: |
          set +e
          OUT=/tmp/probe.txt
          : > "$OUT"
          printf 'export function onRequest(){ return new Response("PONG_OK", {headers:{"content-type":"text/plain"}}); }' > functions/ping.js
          echo '{"version":1,"include":["/ping","/api/*"],"exclude":[]}' > public/_routes.json
          npx --yes wrangler@3 pages project create offex-mail-probe --production-branch=main >> "$OUT" 2>&1
          npx --yes wrangler@3 pages deploy public --project-name=offex-mail-probe --branch=main --commit-dirty=true >> "$OUT" 2>&1
          echo "== probe fresh project =/ping ==" >> "$OUT"
          code=$(curl -s -o /tmp/b -w "%{http_code}" --max-time 60 "https://offex-mail-probe.pages.dev/ping")
          echo "status=$code bytes=$(wc -c </tmp/b) body=$(head -c 120 /tmp/b)" >> "$OUT"
          echo "== delete fresh project ==" >> "$OUT"
          curl -s -X DELETE --max-time 30 "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/offex-mail-probe" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >> "$OUT" 2>&1
          echo >> "$OUT"
          head -c 8000 "$OUT" > /tmp/issue.txt
      - name: Post results as an issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "probe-api freshproject results" --body-file /tmp/issue.txt
