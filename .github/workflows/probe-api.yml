name: probe-api
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - name: Probe deployment URLs
        run: |
          set +e
          OUT=/tmp/probe.txt
          : > "$OUT"
          echo "== latest deployments ==" >> "$OUT"
          curl -s --max-time 30 "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/offex-mail/deployments?per_page=3" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import sys,json;d=json.load(sys.stdin);[print(r['id'][:8], r['environment'], r['url'], r.get('uses_functions'), r['deployment_trigger']['metadata'].get('commit_message')) for r in d.get('result',[])]" >> "$OUT" 2>&1
          for u in "https://dda6a5fd.offex-mail.pages.dev/ping" "https://dda6a5fd.offex-mail.pages.dev/api/status" "https://620cbe92.offex-mail.pages.dev/ping" "https://offex-mail.pages.dev/ping"; do
            echo "== $u ==" >> "$OUT"
            code=$(curl -s -o /tmp/b -w "%{http_code}" --max-time 60 "$u")
            echo "status=$code bytes=$(wc -c </tmp/b) ctype=$(curl -s -o /dev/null -w '%{content_type}' --max-time 60 "$u")" >> "$OUT"
            head -c 120 /tmp/b >> "$OUT"; echo >> "$OUT"
          done
          head -c 8000 "$OUT" > /tmp/issue.txt
      - name: Post results as an issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "probe-api deployment-url results" --body-file /tmp/issue.txt
