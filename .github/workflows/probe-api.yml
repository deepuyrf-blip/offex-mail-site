name: probe-api
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy with explicit _routes.json then probe
        run: |
          set +e
          OUT=/tmp/probe.txt
          : > "$OUT"
          echo '{"version":1,"include":["/api/*"],"exclude":[]}' > public/_routes.json
          echo "== _routes.json written ==" >> "$OUT"; cat public/_routes.json >> "$OUT"; echo >> "$OUT"
          echo "== deploy ==" >> "$OUT"
          npx --yes wrangler@3 pages deploy public --project-name=offex-mail --branch=main >> "$OUT" 2>&1
          echo "== probe GET /api/status ==" >> "$OUT"
          curl -s -D - --max-time 60 "https://offex-mail.pages.dev/api/status" -o /tmp/b >> "$OUT" 2>&1
          echo "bytes=$(wc -c < /tmp/b)" >> "$OUT"; echo "body:" >> "$OUT"; head -c 600 /tmp/b >> "$OUT"; echo >> "$OUT"
          echo "== probe POST /api/inbox ==" >> "$OUT"
          curl -s -D - --max-time 60 -X POST -H 'content-type: application/json' -d '{}' "https://offex-mail.pages.dev/api/inbox" -o /tmp/c >> "$OUT" 2>&1
          echo "bytes=$(wc -c < /tmp/c)" >> "$OUT"; echo "body:" >> "$OUT"; head -c 600 /tmp/c >> "$OUT"; echo >> "$OUT"
          head -c 14000 "$OUT" > /tmp/issue.txt
      - name: Post results as an issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "probe-api routesfix results" --body-file /tmp/issue.txt
