name: probe-api
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test worker proxy
        run: |
          set +e
          OUT=/tmp/probe.txt
          : > "$OUT"
          echo "== audio /hf worker check ==" >> "$OUT"
          echo "audio /hf status=$(curl -s -o /tmp/a -w '%{http_code}' --max-time 60 https://audio-2i8.pages.dev/hf) bytes=$(wc -c </tmp/a) body=$(head -c 100 /tmp/a)" >> "$OUT"
          rm -rf functions
          echo '' | base64 -d > public/_worker.js
          echo "== deploy ==" >> "$OUT"
          npx --yes wrangler@3 pages deploy public --project-name=offex-mail --branch=main --commit-dirty=true >> "$OUT" 2>&1
          echo "== GET /api/status ==" >> "$OUT"
          echo "status=$(curl -s -o /tmp/s -w '%{http_code}' --max-time 60 https://offex-mail.pages.dev/api/status) bytes=$(wc -c </tmp/s) body=$(head -c 300 /tmp/s)" >> "$OUT"
          echo "== POST /api/inbox ==" >> "$OUT"
          echo "status=$(curl -s -o /tmp/i -w '%{http_code}' --max-time 60 -X POST -H 'content-type: application/json' -d '{}' https://offex-mail.pages.dev/api/inbox) bytes=$(wc -c </tmp/i) body=$(head -c 300 /tmp/i)" >> "$OUT"
          echo "== GET / ==" >> "$OUT"
          echo "status=$(curl -s -o /tmp/r -w '%{http_code}' --max-time 60 https://offex-mail.pages.dev/) bytes=$(wc -c </tmp/r)" >> "$OUT"
          head -c 9000 "$OUT" > /tmp/issue.txt
      - name: Post results as an issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "probe-api workerfix2 results" --body-file /tmp/issue.txt
