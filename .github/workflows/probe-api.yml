name: probe-api
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test _worker.js advanced-mode proxy
        run: |
          set +e
          OUT=/tmp/probe.txt
          : > "$OUT"
          echo "== audio /hf worker check ==" >> "$OUT"
          echo "audio /hf status=$(curl -s -o /tmp/a -w '%{http_code}' --max-time 60 https://audio-2i8.pages.dev/hf) bytes=$(wc -c </tmp/a) body=$(head -c 100 /tmp/a)" >> "$OUT"
          rm -rf functions
          cat > public/_worker.js <<'EOF'
const DEFAULT_BACKEND = "https://factblink514-compiled.hf.space";

export default {
  async fetch(request, env) {
    const url = new URL(request.url);
    try {
      if (url.pathname === "/api" || url.pathname.startsWith("/api/")) {
        const backend = (env.BACKEND_URL || DEFAULT_BACKEND).replace(/\/+$/, "");
        const headers = new Headers(request.headers);
        headers.delete("host");
        headers.delete("cf-connecting-ip");
        headers.delete("cf-ipcountry");
        headers.delete("content-length");
        if (env.BACKEND_ACCESS_CODE) headers.set("x-access-code", env.BACKEND_ACCESS_CODE);
        if (env.HF_TOKEN) headers.set("authorization", "Bearer " + env.HF_TOKEN);
        const init = { method: request.method, headers, redirect: "follow" };
        if (request.method !== "GET" && request.method !== "HEAD") init.body = request.body;
        let resp;
        try {
          resp = await fetch(backend + url.pathname + url.search, init);
        } catch (e) {
          return new Response(JSON.stringify({ error: "Backend unreachable: " + e }), { status: 502, headers: { "content-type": "application/json", "access-control-allow-origin": "*" } });
        }
        const body = await resp.arrayBuffer();
        const outHeaders = new Headers();
        const ct = resp.headers.get("content-type");
        if (ct) outHeaders.set("content-type", ct);
        outHeaders.set("access-control-allow-origin", "*");
        outHeaders.set("cache-control", "no-store");
        return new Response(body, { status: resp.status, headers: outHeaders });
      }
    } catch (e) {}
    return env.ASSETS.fetch(request);
  }
};
EOF
          echo "== deploy worker =" >> "$OUT"
          npx --yes wrangler@3 pages deploy public --project-name=offex-mail --branch=main --commit-dirty=true >> "$OUT" 2>&1
          echo "== GET /api/status ==" >> "$OUT"
          echo "status=$(curl -s -o /tmp/s -w '%{http_code}' --max-time 60 https://offex-mail.pages.dev/api/status) bytes=$(wc -c </tmp/s) body=$(head -c 300 /tmp/s)" >> "$OUT"
          echo "== POST /api/inbox ==" >> "$OUT"
          echo "status=$(curl -s -o /tmp/i -w '%{http_code}' --max-time 60 -X POST -H 'content-type: application/json' -d '{}' https://offex-mail.pages.dev/api/inbox) bytes=$(wc -c </tmp/i) body=$(head -c 300 /tmp/i)" >> "$OUT"
          echo "== GET / (static still works?) ==" >> "$OUT"
          echo "status=$(curl -s -o /tmp/r -w '%{http_code}' --max-time 60 https://offex-mail.pages.dev/) bytes=$(wc -c </tmp/r)" >> "$OUT"
          head -c 9000 "$OUT" > /tmp/issue.txt
      - name: Post results as an issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "probe-api workerfix results" --body-file /tmp/issue.txt
