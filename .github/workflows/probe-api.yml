name: probe-api
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect
        run: |
          set +e
          OUT=/tmp/probe.txt
          : > "$OUT"
          echo "== live /_routes.json ==" >> "$OUT"
          curl -s -D - --max-time 30 "https://offex-mail.pages.dev/_routes.json" -o /tmp/r.txt >> "$OUT" 2>&1
          echo "[body]" >> "$OUT"; head -c 1200 /tmp/r.txt >> "$OUT"; echo >> "$OUT"
          echo "== build ==" >> "$OUT"
          rm -rf /tmp/fx && npx --yes wrangler@3 pages functions build --outdir=/tmp/fx >> "$OUT" 2>&1
          echo "== temp files ==" >> "$OUT"
          ls -la /tmp/wrangler-pages 2>&1 >> "$OUT"
          for f in /tmp/wrangler-pages/*; do echo "--- $f ---" >> "$OUT"; head -c 1500 "$f" >> "$OUT"; echo >> "$OUT"; done
          head -c 12000 "$OUT" > /tmp/issue.txt
          echo "== done =="
      - name: Post results as an issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "probe-api routes2 results" --body-file /tmp/issue.txt
