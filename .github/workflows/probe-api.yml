name: probe-api
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ping test
        run: |
          set +e
          OUT=/tmp/probe.txt
          : > "$OUT"
          printf 'export function onRequest(){ return new Response("PONG_OK_%s", {headers:{"content-type":"text/plain"}}); }' "$(date +%s)" > functions/ping.js
          echo '{"version":1,"include":["/ping","/api/*"],"exclude":[]}' > public/_routes.json
          npx --yes wrangler@3 pages deploy public --project-name=offex-mail --branch=main --commit-dirty=true >> "$OUT" 2>&1
          echo "== GET /ping ==" >> "$OUT"
          curl -s -D - --max-time 60 "https://offex-mail.pages.dev/ping" -o /tmp/p >> "$OUT" 2>&1
          echo "bytes=$(wc -c </tmp/p) body=$(cat /tmp/p | head -c 200)" >> "$OUT"
          echo "== GET /api/status ==" >> "$OUT"
          curl -s -D - --max-time 60 "https://offex-mail.pages.dev/api/status" -o /tmp/s >> "$OUT" 2>&1
          echo "bytes=$(wc -c </tmp/s) body=$(head -c 200 /tmp/s)" >> "$OUT"
          head -c 14000 "$OUT" > /tmp/issue.txt
      - name: Post results as an issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "probe-api ping results" --body-file /tmp/issue.txt
