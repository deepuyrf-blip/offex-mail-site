name: Verify Offex Audio app-ui (temp)
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live endpoints
        run: |
          set +e
          probe() {
            echo "--- $1 ---"
            curl -s -D - -o /tmp/body.$$ --max-time 40 "https://offexmail.online$1" \
              | grep -iE "^HTTP/|^location:|^content-type:|^content-length:" | tr -d '\r'
            echo "  size=$(wc -c < /tmp/body.$$)  scr-remove=$(grep -c 'scr-remove' /tmp/body.$$)  gradio=$(grep -c 'gradio_client.js' /tmp/body.$$)"
          }
          probe /app-ui
          probe /app-ui.html
          probe /app-ui/
          probe /about
          probe /about.html
          echo "=== assets ==="
          for u in /gradio_client.js /audio-engine.js; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code} %{size_download}b' --max-time 40 https://offexmail.online$u)"
          done
          echo "=== /health ==="
          curl -s -w "\nstatus=%{http_code}\n" --max-time 40 https://offexmail.online/health
          echo "=== /hf/gradio_api/info ==="
          curl -s -o /dev/null -w "status=%{http_code}\n" --max-time 90 https://offexmail.online/hf/gradio_api/info
          echo "=== marketing ==="
          for p in / /blog /ads.txt /sitemap.xml; do echo "$p -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 40 https://offexmail.online$p)"; done
