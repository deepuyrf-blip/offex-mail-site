name: Verify API (temp)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Curl live API with browser headers
        run: |
          UA='Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Mobile Safari/537.36'
          echo "===== GET /api/app-config ====="
          curl -s -m 45 -w "\nHTTP_CODE=%{http_code}\n" -A "$UA" \
            -H "Origin: https://mytemp-mail.online" \
            -H "Referer: https://mytemp-mail.online/" \
            "https://api.mytemp-mail.online/api/app-config" | head -c 2000
          echo
          echo "===== response headers ====="
          curl -s -m 45 -D - -o /dev/null -A "$UA" \
            -H "Origin: https://mytemp-mail.online" \
            -H "Referer: https://mytemp-mail.online/" \
            "https://api.mytemp-mail.online/api/app-config" | head -25
          echo
          echo "===== GET /api/domains ====="
          curl -s -m 45 -w "\nHTTP_CODE=%{http_code}\n" -A "$UA" \
            -H "Origin: https://mytemp-mail.online" \
            -H "Referer: https://mytemp-mail.online/" \
            "https://api.mytemp-mail.online/api/domains" | head -c 1000
          echo
