name: apply-fe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend and commit
        run: |
          set -e
          python3 patch_fe.py
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          git add public/
          git commit -m "feat: domain selector for the 2 mail domains" || echo "no changes"
          git push
