name: tmp-audio-verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the API proxy worker (adds /audio-admin to the allowlist)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
        run: |
          set +e
          npx --yes wrangler@3 deploy --config wrangler.worker.toml 2>&1 | tail -25
      - name: Verify live audio site + backend
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          ORG='-H Origin:https://offexmail.online -H Referer:https://offexmail.online/app-ui'
          echo "===== SITE ====="
          echo "app-ui status : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://offexmail.online/app-ui)"
          UI=$(curl -s --max-time 30 https://offexmail.online/app-ui)
          echo "app-ui upbox marker : $(printf '%s' "$UI" | grep -c 'OA-UPBOX-NAME-PCT')"
          echo "app-ui viz marker   : $(printf '%s' "$UI" | grep -c 'OA-VIZ')"
          echo "app-ui file-name el : $(printf '%s' "$UI" | grep -c 'fileRemoveName')"
          echo "app-ui viz ids      : $(printf '%s' "$UI" | grep -o 'id="viz[A-Za-z]*"' | sort -u | tr '\n' ' ')"
          echo "app-ui version 2.1  : $(printf '%s' "$UI" | grep -c 'APPUI_VERSION=2.1')"
          echo "home status   : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://offexmail.online/)"
          echo "===== BACKEND via api.mytemp-mail.online ====="
          echo "audio-config status : $(curl -s -o /dev/null -w '%{http_code}' --max-time 45 $ORG https://api.mytemp-mail.online/api/audio-app-config)"
          echo "audio-config body   : $(curl -s --max-time 45 $ORG https://api.mytemp-mail.online/api/audio-app-config | head -c 320)"
          echo "audio-admin status  : $(curl -s -o /dev/null -w '%{http_code}' --max-time 45 'https://api.mytemp-mail.online/audio-admin?code=Hyco')"
          A=$(curl -s --max-time 45 'https://api.mytemp-mail.online/audio-admin?code=Hyco')
          echo "audio-admin marker  : $(printf '%s' "$A" | grep -c 'OFFEX-AUDIO-ADMIN-V2')"
          echo "audio-admin history : $(printf '%s' "$A" | grep -c 'Audio history')"
          echo "audio-admin cfg ep  : $(printf '%s' "$A" | grep -c '/api/audio-app-config')"
          echo "mail-admin status   : $(curl -s -o /dev/null -w '%{http_code}' --max-time 45 'https://api.mytemp-mail.online/admin?code=Hyco')"
          echo "mail-admin marker   : $(curl -s --max-time 45 'https://api.mytemp-mail.online/admin?code=Hyco' | grep -c 'OFFEX-ADMIN-V2')"
          echo "audio-history POST  : $(curl -s -o /dev/null -w '%{http_code}' --max-time 45 $ORG -X POST -H 'Content-Type: application/json' -d '{"tool":"Verify","file":"probe.mp3","package":"online.offexaudio.app","version":"1.3"}' https://api.mytemp-mail.online/api/audio-history)"
          echo "audio-hist admin    : $(curl -s --max-time 45 -H 'x-admin-code: Hyco' https://api.mytemp-mail.online/api/admin/audio-history | head -c 220)"
          echo "===== BACKEND direct on the Space ====="
          echo "space config status : $(curl -s -o /dev/null -w '%{http_code}' --max-time 45 -H "Authorization: Bearer $HF_TOKEN" https://factblink514-compiled.hf.space/api/audio-app-config)"
          echo "space audio-admin   : $(curl -s -o /dev/null -w '%{http_code}' --max-time 45 -H "Authorization: Bearer $HF_TOKEN" 'https://factblink514-compiled.hf.space/audio-admin?code=Hyco')"
          echo "space mail-admin    : $(curl -s -o /dev/null -w '%{http_code}' --max-time 45 -H "Authorization: Bearer $HF_TOKEN" 'https://factblink514-compiled.hf.space/admin?code=Hyco')"
