name: apply-11lab
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  a:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: |
          set +e
          python3 fix_11lab.py > /tmp/o.txt 2>&1
          head -c 6000 /tmp/o.txt > /tmp/iss.txt
      - name: Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "apply-11lab results" --body-file /tmp/iss.txt
