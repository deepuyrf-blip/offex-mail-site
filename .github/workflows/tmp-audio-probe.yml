name: tmp-audio-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe audio-history endpoint
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          ORG='-H Origin:https://offexmail.online -H Referer:https://offexmail.online/app-ui'
          BODY='{"tool":"Verify","file":"probe.mp3","detail":"probe","package":"online.offexaudio.app","version":"1.3","at":1}'
          echo "proxy POST body : $(curl -s --max-time 45 $ORG -X POST -H 'Content-Type: application/json' -d "$BODY" https://api.mytemp-mail.online/api/audio-history)"
          echo "space POST body : $(curl -s --max-time 45 -H "Authorization: Bearer $HF_TOKEN" -H 'Content-Type: application/json' -d "$BODY" https://factblink514-compiled.hf.space/api/audio-history)"
          echo "space audio-log : $(curl -s --max-time 45 -H "Authorization: Bearer $HF_TOKEN" -H 'x-admin-code: Hyco' https://factblink514-compiled.hf.space/api/admin/audio-log)"
          echo "space audio-hist: $(curl -s --max-time 45 -H "Authorization: Bearer $HF_TOKEN" -H 'x-admin-code: Hyco' https://factblink514-compiled.hf.space/api/admin/audio-history)"
          echo "space config    : $(curl -s --max-time 45 -H "Authorization: Bearer $HF_TOKEN" https://factblink514-compiled.hf.space/api/audio-app-config | head -c 120)"
