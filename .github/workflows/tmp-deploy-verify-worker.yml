name: tmp-deploy-verify-worker
on: workflow_dispatch
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy worker (wrangler)
        run: |
          set +e
          npx --yes wrangler@3 deploy --config wrangler.worker.toml 2>&1 | tee /tmp/deploy.txt
          echo "wrangler_exit=${PIPESTATUS[0]}"
      - name: Confirm deployed module content
        run: |
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/offex-api-proxy" -o meta.txt
          echo "deployed_has_PANEL_PATHS=$(grep -c PANEL_PATHS meta.txt)"
          echo "deployed_has_SecFetchSite=$(grep -c 'Sec-Fetch-Site' meta.txt)"
          echo "deployed_has_isPanel=$(grep -c 'isPanel' meta.txt)"
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify panels without Referer (real browser navigation)
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          A='https://api.mytemp-mail.online'
          echo "=== NO Referer / NO Origin (typed URL) ==="
          c1=$(curl -s -o /tmp/a.html -w '%{http_code}' --max-time 40 -A "$UA" "$A/admin?code=Hyco")
          echo "GET /admin?code=Hyco        -> HTTP $c1  OFFEX-ADMIN-V2=$(grep -c OFFEX-ADMIN-V2 /tmp/a.html)"
          c2=$(curl -s -o /tmp/b.html -w '%{http_code}' --max-time 40 -A "$UA" "$A/audio-admin?code=Hyco")
          echo "GET /audio-admin?code=Hyco  -> HTTP $c2  OFFEX-AUDIO-ADMIN-V2=$(grep -c OFFEX-AUDIO-ADMIN-V2 /tmp/b.html)"
          echo "=== WITH Referer/Origin (no regression) ==="
          c3=$(curl -s -o /tmp/c.html -w '%{http_code}' --max-time 40 -A "$UA" -H 'Origin: https://mytemp-mail.online' -H 'Referer: https://mytemp-mail.online/' "$A/admin?code=Hyco")
          echo "GET /admin (ref)            -> HTTP $c3  OFFEX-ADMIN-V2=$(grep -c OFFEX-ADMIN-V2 /tmp/c.html)"
          c4=$(curl -s -o /tmp/d.html -w '%{http_code}' --max-time 40 -A "$UA" -H 'Origin: https://mytemp-mail.online' -H 'Referer: https://mytemp-mail.online/' "$A/audio-admin?code=Hyco")
          echo "GET /audio-admin (ref)      -> HTTP $c4  OFFEX-AUDIO-ADMIN-V2=$(grep -c OFFEX-AUDIO-ADMIN-V2 /tmp/d.html)"
          echo "=== API endpoints (must still work) ==="
          e1=$(curl -s -o /tmp/e.json -w '%{http_code}' --max-time 40 -A "$UA" -H 'Origin: https://mytemp-mail.online' -H 'Referer: https://mytemp-mail.online/' "$A/api/app-config")
          echo "GET /api/app-config (ref)   -> HTTP $e1"
          e2=$(curl -s -o /tmp/f.json -w '%{http_code}' --max-time 40 -A "$UA" -H 'Origin: https://mytemp-mail.online' -H 'Referer: https://mytemp-mail.online/' "$A/api/audio-app-config")
          echo "GET /api/audio-app-config   -> HTTP $e2"
          echo "=== API protection still in force ==="
          e3=$(curl -s -o /dev/null -w '%{http_code}' --max-time 40 -A "$UA" "$A/api/app-config")
          echo "GET /api/app-config (no hdr)          -> HTTP $e3 (expect 403)"
          echo "=== panel same-origin calls when browser omits Referer ==="
          e4=$(curl -s -o /dev/null -w '%{http_code}' --max-time 40 -A "$UA" -H 'Sec-Fetch-Site: same-origin' -H 'Sec-Fetch-Mode: cors' "$A/api/app-config")
          echo "GET /api/app-config (Sec-Fetch-Site: same-origin) -> HTTP $e4 (expect 200)"
          e5=$(curl -s -o /dev/null -w '%{http_code}' --max-time 40 -A "$UA" -H 'Sec-Fetch-Site: cross-site' "$A/api/app-config")
          echo "GET /api/app-config (Sec-Fetch-Site: cross-site)  -> HTTP $e5 (expect 403)"
