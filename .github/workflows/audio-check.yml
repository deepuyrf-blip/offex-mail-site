name: audio-check
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - name: Check audio URLs
        run: |
          set +e
          O=/tmp/o.txt
          : > "$O"
          for u in "https://offexmail.online/" "https://offexmail.online/blog.html" "https://offexmail.online/blog" "https://offexmail.online/about.html" "https://offexmail.online/about" "https://offexmail.online/remove-silence-from-audio-guide.html" "https://offexmail.online/remove-silence-from-audio-guide"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 40 "$u")
            loc=$(curl -s -o /dev/null -D - --max-time 40 "$u" | grep -i "^location:" | tr -d '\r')
            echo "$u -> $code | $loc" >> "$O"
          done
          head -c 4000 "$O" > /tmp/iss.txt
      - name: Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "audio-check results" --body-file /tmp/iss.txt
