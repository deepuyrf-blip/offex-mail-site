name: Temp verify app-ui Gradio flow
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live app-ui page and HF backend
        run: |
          set -uo pipefail
          UI="https://offexmail.online/app-ui"
          echo "===== app-ui page ====="
          code=$(curl -s -o /tmp/appui.html -w '%{http_code}' --max-time 40 "$UI")
          echo "app-ui HTTP                 : $code"
          echo "bytes                       : $(wc -c < /tmp/appui.html)"
          echo "=== ESM client import (same one index.html uses) ==="
          echo "jsdelivr ESM import present : $(grep -c 'cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js' /tmp/appui.html)"
          echo "unpkg fallback present      : $(grep -c 'unpkg.com/@gradio/client/dist/index.min.js' /tmp/appui.html)"
          echo "window.GradioClient assigned: $(grep -c 'window.GradioClient = { Client: mod.Client, handle_file: mod.handle_file }' /tmp/appui.html)"
          echo "=== old broken job path removed ==="
          echo "old no-job-handle reject    : $(grep -c 'reject(new Error("no job handle"))' /tmp/appui.html)"
          echo "asyncIterator job branch    : $(grep -c 'job\[Symbol.asyncIterator\]' /tmp/appui.html)"
          echo "keepSec default 0.02        : $(grep -c 'id="keepSec"[^>]*value="0.02"' /tmp/appui.html)"
          echo "=== index.html (working main site) sanity ==="
          codei=$(curl -s -o /tmp/index.html -w '%{http_code}' --max-time 40 "https://offexmail.online/")
          echo "index HTTP                  : $codei"
          echo "index jsdelivr ESM import   : $(grep -c 'cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js' /tmp/index.html)"
          echo "===== HF backend through the /hf proxy ====="
          code2=$(curl -s -o /tmp/info.json -w '%{http_code}' --max-time 60 "https://offexmail.online/hf/gradio_api/info")
          echo "/hf/gradio_api/info HTTP    : $code2"
          echo "named_endpoints             : $(python3 -c "import json;d=json.load(open('/tmp/info.json'));print(list((d.get('named_endpoints') or {}).keys()))" 2>/dev/null || echo parse-failed)"
          echo "process_audio in info       : $(grep -c 'process_audio' /tmp/info.json)"
          echo "enhance_audio in info       : $(grep -c 'enhance_audio' /tmp/info.json)"
          echo "isolate_voice_bgm in info   : $(grep -c 'isolate_voice_bgm' /tmp/info.json)"
          echo "===== assertions ====="
          fail=0
          [ "$code" = "200" ] || { echo "::error::app-ui did not return HTTP 200"; fail=1; }
          grep -q 'cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js' /tmp/appui.html || { echo "::error::ESM jsdelivr client import missing from app-ui"; fail=1; }
          grep -q 'unpkg.com/@gradio/client/dist/index.min.js' /tmp/appui.html || { echo "::error::unpkg ESM fallback missing from app-ui"; fail=1; }
          grep -q 'window.GradioClient = { Client: mod.Client, handle_file: mod.handle_file }' /tmp/appui.html || { echo "::error::app-ui does not expose window.GradioClient from the ESM module"; fail=1; }
          grep -q 'job\[Symbol.asyncIterator\]' /tmp/appui.html || { echo "::error::async-iterable Job handling missing from app-ui"; fail=1; }
          if grep -q 'reject(new Error("no job handle"))' /tmp/appui.html; then echo "::error::old classic-script-only job path (no job handle) still present"; fail=1; fi
          grep -q 'id="keepSec"[^>]*value="0.02"' /tmp/appui.html || { echo "::error::Remove Silence default is not 0.02"; fail=1; }
          [ "$code2" = "200" ] || { echo "::error::/hf/gradio_api/info did not return HTTP 200"; fail=1; }
          grep -q 'process_audio' /tmp/info.json || { echo "::error::process_audio missing from info"; fail=1; }
          grep -q 'enhance_audio' /tmp/info.json || { echo "::error::enhance_audio missing from info"; fail=1; }
          grep -q 'isolate_voice_bgm' /tmp/info.json || { echo "::error::isolate_voice_bgm missing from info"; fail=1; }
          if [ "$fail" != "0" ]; then echo "VERIFICATION FAILED"; exit 1; fi
          echo "ALL LIVE CHECKS PASSED"
