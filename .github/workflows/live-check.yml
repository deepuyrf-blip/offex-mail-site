name: Temp live design verification
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify warm-glass redesign is live
        run: |
          CB="cb=$(date +%s)"
          probe () {
            URL="$1"
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H 'Cache-Control: no-cache' "$URL")
            B=$(curl -s --max-time 30 -H 'Cache-Control: no-cache' "$URL")
            echo "==== $URL  HTTP=$CODE  bytes=$(printf '%s' "$B" | wc -c)"
            echo "  design   mosaic=$(printf '%s' "$B" | grep -c 'class="oa-mosaic"') pills=$(printf '%s' "$B" | grep -o 'class="oa-pill"' | wc -l) waveforms=$(printf '%s' "$B" | grep -o 'class="oa-wv"' | wc -l) timestamps=$(printf '%s' "$B" | grep -o 'class="oa-ts"' | wc -l) avatars=$(printf '%s' "$B" | grep -o 'class="oa-ava"' | wc -l)"
            echo "  seo/lang lang-switcher=$(printf '%s' "$B" | grep -c 'lang-select') adsense-meta=$(printf '%s' "$B" | grep -c 'google-adsense-account') adsense-client=$(printf '%s' "$B" | grep -c 'ca-pub-9424904813990636') hreflang=$(printf '%s' "$B" | grep -c 'hreflang')"
            echo "  tools    removeTool=$(printf '%s' "$B" | grep -c 'id="removeTool"') enhanceTool=$(printf '%s' "$B" | grep -c 'id="enhanceTool"') isolateTool=$(printf '%s' "$B" | grep -c 'id="isolateTool"') fileInput=$(printf '%s' "$B" | grep -c 'id="fileInput"') removeBtn=$(printf '%s' "$B" | grep -c 'id="removeBtn"') hf-proxy=$(printf '%s' "$B" | grep -c '/hf/') engine=$(printf '%s' "$B" | grep -c 'audio-engine.js') live-badge=$(printf '%s' "$B" | grep -c 'oa-status')"
            echo "  theme    dark-default=$(printf '%s' "$B" | grep -c 'saved === "light"\|savedTheme === "light"')"
          }
          probe "https://offexmail.online/"
          probe "https://offexmail.online/hi/"
          probe "https://offexmail.online/es/"
          probe "https://offexmail.online/ar/"
          probe "https://offexmail.online/blog"
          probe "https://offexmail.online/remove-silence-from-audio-guide"
          probe "https://offexmail.online/privacy"
          probe "https://offexmail.online/app-ui"
          echo "==== CSS"
          echo "  premium.css warm-glass markers: $(curl -s --max-time 30 "https://offexmail.online/premium.css" | grep -c 'glass-fill\|oa-pill\|bokeh\|oaDrift')"
          echo "  styles.css  content markers:    $(curl -s --max-time 30 "https://offexmail.online/styles.css" | grep -c 'oa-hero::after\|glass-fill\|oa-tile')"
          echo "  premium.css bytes: $(curl -s --max-time 30 "https://offexmail.online/premium.css" | wc -c)"
          echo "  styles.css  bytes: $(curl -s --max-time 30 "https://offexmail.online/styles.css" | wc -c)"
          echo "==== /hf proxy endpoint: $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 'https://offexmail.online/hf/config')"
          echo "==== sitemap urls: $(curl -s --max-time 30 'https://offexmail.online/sitemap.xml' | grep -c '<loc>')"
