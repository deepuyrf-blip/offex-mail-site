name: verify-live

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live content
        run: |
          BASE="https://mytemp-mail.online"
          chk () {
            code=$(curl -sL -o /tmp/p -w '%{http_code}' --max-time 30 "$1")
            words=$(sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<[^>]*>/ /g' /tmp/p | tr -s ' \n\t' ' ' | wc -w)
            imgs=$(grep -o '<img ' /tmp/p | wc -l)
            echo "$2 | $1 | HTTP $code | words=$words | imgs=$imgs"
          }
          echo "===== CORE PAGES ====="
          chk "$BASE/" "home"
          chk "$BASE/services" "services"
          chk "$BASE/about" "about"
          chk "$BASE/privacy" "privacy"
          echo "===== NEW GUIDES ====="
          for g in why-verification-codes-expire temp-mail-for-free-trials how-to-spot-phishing-email data-brokers-and-your-email temp-mail-for-newsletters-and-downloads what-not-to-use-temp-mail-for custom-domain-vs-temp-mail; do
            chk "$BASE/blog/$g" "guide:$g"
          done
          echo "===== BLOG INDEX ====="
          chk "$BASE/blog/" "blog-index"
          echo "===== LANGUAGE HUBS ====="
          for L in hi es fr de pt ru ar zh ja; do
            chk "$BASE/$L/" "hub:$L"
          done
          echo "===== NEW SVGs ====="
          for s in inbox-timeline comparison-columns phishing-alert data-broker spam-sources cleanup-checklist dev-testing otp-arrives digital-footprint secure-form; do
            echo "svg:$s -> $(curl -s -o /dev/null -w 'HTTP %{http_code} | type=%{content_type} | bytes=%{size_download}' --max-time 20 $BASE/images/$s.svg)"
          done
          echo "===== INTEGRITY CHECKS ====="
          H=$(curl -sL --max-time 30 "$BASE/")
          echo "home adsense pub-9424904813990636 : $(printf '%s' "$H" | grep -c 'pub-9424904813990636')"
          echo "home stray dup markers (offex-deep) : $(printf '%s' "$H" | grep -c 'offex-deep')"
          echo "home canonical : $(printf '%s' "$H" | grep -o 'rel=\"canonical\" href=\"[^\"]*\"')"
          echo "home tool marker (new inbox btn) : $(printf '%s' "$H" | grep -c 'Create inbox\|createInbox\|new inbox')"
          echo "===== SITEMAP ====="
          S=$(curl -sL --max-time 30 "$BASE/sitemap.xml")
          echo "sitemap url count : $(printf '%s' "$S" | grep -c '<url>')"
          echo "sitemap has new guide : $(printf '%s' "$S" | grep -c 'why-verification-codes-expire')"
          echo "===== LEGAL/REDIRECT ====="
          echo "terms -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 $BASE/terms)"
          echo "disclaimer -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 $BASE/disclaimer)"
