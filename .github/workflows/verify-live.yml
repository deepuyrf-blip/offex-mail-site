name: verify-live

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live content
        run: |
          BASE="https://mytemp-mail.online"
          chk () {
            code=$(curl -sL -o /tmp/p -w '%{http_code}' --max-time 30 "$1")
            words=$(sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<[^>]*>/ /g' /tmp/p | tr -s ' \n\t' ' ' | wc -w)
            imgs=$(grep -o '<img ' /tmp/p | wc -l)
            echo "$2 | HTTP $code | words=$words | imgs=$imgs"
          }
          echo "===== CORE ====="
          chk "$BASE/" "home"
          chk "$BASE/services" "services"
          chk "$BASE/about" "about"
          chk "$BASE/privacy" "privacy"
          chk "$BASE/terms" "terms"
          chk "$BASE/disclaimer" "disclaimer"
          echo "===== NEW GUIDES ====="
          for g in why-verification-codes-expire temp-mail-for-free-trials how-to-spot-phishing-email data-brokers-and-your-email temp-mail-for-newsletters-and-downloads what-not-to-use-temp-mail-for custom-domain-vs-temp-mail; do
            chk "$BASE/blog/$g" "guide:$g"
          done
          chk "$BASE/blog/" "blog-index"
          echo "===== HUBS ====="
          for L in hi es fr de pt ru ar zh ja; do chk "$BASE/$L/" "hub:$L"; done
          echo "===== NEW ILLUSTRATIONS ON HUB + SERVICE PAGE ====="
          echo "ja hub fig marker : $(curl -sL --max-time 30 $BASE/ja/ | grep -c 'offex-hub-fig')"
          echo "ja hub img file   : $(curl -sL --max-time 30 $BASE/ja/ | grep -o '/images/[a-z0-9-]*\.svg' | head -1)"
          echo "instagram fig mkr : $(curl -sL --max-time 30 $BASE/instagram | grep -c 'offex-svc-fig')"
          echo "instagram img file: $(curl -sL --max-time 30 $BASE/instagram | grep -o '/images/[a-z0-9-]*\.svg' | head -1)"
          echo "===== NEW SVG ASSETS ====="
          for s in inbox-timeline comparison-columns phishing-alert data-broker spam-sources cleanup-checklist dev-testing otp-arrives digital-footprint secure-form domain-reputation desktop-mobile verification-3ways; do
            echo "svg:$s -> $(curl -s -o /dev/null -w 'HTTP %{http_code} type=%{content_type} bytes=%{size_download}' --max-time 20 $BASE/images/$s.svg)"
          done
          echo "===== INTEGRITY ====="
          H=$(curl -sL --max-time 30 "$BASE/")
          echo "home adsense pub    : $(printf '%s' "$H" | grep -c 'pub-9424904813990636')"
          echo "home stray dup mkrs : $(printf '%s' "$H" | grep -c 'offex-deep')"
          echo "home canonical      : $(printf '%s' "$H" | grep -o 'rel=\"canonical\" href=\"[^\"]*\"')"
          echo "home new section    : $(printf '%s' "$H" | grep -c 'Choose the right address for the job')"
          S=$(curl -sL --max-time 30 "$BASE/sitemap.xml")
          echo "sitemap urls        : $(printf '%s' "$S" | grep -c '<url>')"
          echo "sitemap new guide   : $(printf '%s' "$S" | grep -c 'why-verification-codes-expire')"
          echo "redirect /gmail     : $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 $BASE/gmail)"
