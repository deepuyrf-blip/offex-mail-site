name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - name: Debug KV namespace create
        run: |
          echo "--- wrangler version ---"
          npx --yes wrangler@3 --version
          echo "--- kv:namespace create (stderr shown) ---"
          npx --yes wrangler@3 kv:namespace create AD_CONFIG --json 2>&1 | head -40
          echo "--- kv namespace list ---"
          npx --yes wrangler@3 kv namespace list --json 2>&1 | head -20
          echo "--- token verify ---"
          curl -s --max-time 20 "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | head -c 400
