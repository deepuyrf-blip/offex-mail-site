name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: AdSense readiness health check
        run: |
          echo "site root        : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://offexmail.online/)"
          echo "about page       : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://offexmail.online/about.html)"
          echo "privacy page     : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://offexmail.online/privacy.html)"
          echo "contact page     : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://offexmail.online/contact.html)"
          echo "tool proxy /hf/  : $(curl -s -o /dev/null -w '%{http_code}' --max-time 40 https://offexmail.online/hf/)"
          echo "hf space stage   : $(curl -s --max-time 30 https://huggingface.co/api/spaces/hydui/ytvideo | python3 -c \"import sys,json;d=json.load(sys.stdin);print(d.get('runtime',{}).get('stage','?'))\" 2>/dev/null)"
          echo "robots.txt       : $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://offexmail.online/robots.txt)"
          echo "sitemap.xml      : $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://offexmail.online/sitemap.xml)"
