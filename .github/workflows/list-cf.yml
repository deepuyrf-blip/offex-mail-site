name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Verify backend OTP field
        run: |
          echo "mail site      : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://tempmail.offexmail.online/)"
          echo "api/status     : $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://tempmail.offexmail.online/api/status)"
          echo "--- create inbox + check otp key ---"
          INBOX=$(curl -s --max-time 30 -X POST https://tempmail.offexmail.online/api/inbox -H 'content-type: application/json' -d '{}')
          echo "inbox resp: $(echo "$INBOX" | head -c 200)"
          ADDR=$(echo "$INBOX" | python3 -c "import sys,json;print(json.load(sys.stdin).get('address',''))" 2>/dev/null)
          echo "address: $ADDR"
          if [ -n "$ADDR" ]; then
            MSGS=$(curl -s --max-time 30 "https://tempmail.offexmail.online/api/inbox/$ADDR/messages")
            echo "messages resp: $(echo "$MSGS" | head -c 300)"
            echo "has otp key  : $(echo "$MSGS" | grep -c 'otp')"
          fi
