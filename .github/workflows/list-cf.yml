name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://mytemp-mail.online
          echo "===== RAW STATS ====="
          for p in "" "privacy"; do
            curl -sL --max-time 30 "$B/$p" -o /tmp/page.html
            echo "/$p bytes: $(wc -c </tmp/page.html)"
            echo "/$p mytemp-mail.online: $(grep -o 'mytemp-mail\.online' /tmp/page.html | wc -l)"
            echo "/$p offexmail.online: $(grep -o 'offexmail\.online' /tmp/page.html | wc -l)"
            echo "/$p matches:"
            grep -o '.\{18\}mytemp-mail\.online.\{4\}' /tmp/page.html
            echo "/$p offexmail matches:"
            grep -o '.\{18\}offexmail\.online.\{4\}' /tmp/page.html
          done
          echo "===== TITLES ====="
          for p in privacy services instagram hi/instagram; do
            echo "/$p: $(curl -sL --max-time 30 "$B/$p" | grep -o '<title>[^<]*</title>' | head -1)"
          done
