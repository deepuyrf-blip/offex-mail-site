name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - name: Probe audio pages project
        run: |
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/audio" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/p.json
          echo "PROJ name: $(jq -r .result.name /tmp/p.json)"
          echo "PROJ subdomain: $(jq -r .result.subdomain /tmp/p.json)"
          echo "PROJ domains: $(jq -c .result.domains /tmp/p.json)"
          echo "PROJ source: $(jq -c .result.source /tmp/p.json)"
          echo "PROJ build: $(jq -c .result.build_config /tmp/p.json)"
          echo "PROJ branch: $(jq -r .result.production_branch /tmp/p.json)"
      - name: Sitemaps
        run: |
          echo "SITEMAP audio-2i8:"; curl -s https://audio-2i8.pages.dev/sitemap.xml | tr -d '\n' | head -c 1200; echo ""
          echo "SITEMAP offexmail:"; curl -s https://offexmail.online/sitemap.xml | tr -d '\n' | head -c 1200; echo ""
          echo "ROOT offexmail: $(curl -s -o /dev/null -w '%{http_code}' https://offexmail.online/)"
