name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== OLD SUBDOMAIN (should 301) ==="
          for p in "" "instagram" "hi/instagram" "services" "privacy"; do
            echo "/$p => $(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' --max-time 25 https://tempmail.offexmail.online/$p)"
          done
          echo "=== NEW DOMAIN (should 200) ==="
          for p in "" "instagram" "privacy" "services"; do
            echo "/$p => $(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://mytemp-mail.online/$p)"
          done
          echo "=== NEW DOMAIN TITLES ==="
          echo "home: $(curl -sL --max-time 25 https://mytemp-mail.online/ | grep -o '<title>[^<]*</title>' | head -1)"
          echo "privacy: $(curl -sL --max-time 25 https://mytemp-mail.online/privacy | grep -o '<title>[^<]*</title>' | head -1)"
