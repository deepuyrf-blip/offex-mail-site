name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://api.mytemp-mail.online
          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Mobile Safari/537.36"
          H1="x-admin-code: Hyco"
          APK=https://github.com/deepuyrf-blip/offex-mail-site/releases/download/v3.5/OffexMail.apk
          curl -s --max-time 30 -A "$UA" -H "$H1" -H "Origin: https://api.mytemp-mail.online" -H "Referer: https://api.mytemp-mail.online/admin?code=Hyco" "$A/api/app-config" > /tmp/cfg.json
          echo "BEFORE: $(python3 -c "import json;d=json.load(open('/tmp/cfg.json'));print(json.dumps(d.get('update')))")"
          python3 - <<PY
          import json
          c=json.load(open('/tmp/cfg.json'))
          u=c.get('update') or {}
          u['latest']='3.5'
          u['url']='$APK'
          u['force']=False
          c['update']=u
          json.dump(c,open('/tmp/new.json','w'))
          print("NEW:", json.dumps(u))
          PY
          curl -s -X POST --max-time 30 -A "$UA" -H "$H1" -H "Content-Type: application/json" -H "Origin: https://api.mytemp-mail.online" -H "Referer: https://api.mytemp-mail.online/admin?code=Hyco" --data @/tmp/new.json "$A/api/admin/app-config" > /dev/null
          sleep 3
          echo "VERIFY: $(curl -s --max-time 30 -A "$UA" -H "$H1" -H "Origin: https://api.mytemp-mail.online" -H "Referer: https://api.mytemp-mail.online/admin?code=Hyco" "$A/api/app-config" | python3 -c "import sys,json;d=json.load(sys.stdin);print(json.dumps(d.get('update')));print('ads.app_id =',(d.get('ads') or {}).get('app_id'))")"
