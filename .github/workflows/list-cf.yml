name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "YT-TITLE: $(curl -sL --max-time 25 https://tempmail.offexmail.online/youtube | grep -o '<title>[^<]*</title>' | head -1)"
          echo "YT-CODE: $(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://tempmail.offexmail.online/youtube)"
          echo "YT-BODY: $(curl -sL --max-time 25 https://tempmail.offexmail.online/youtube | grep -o '404\|Not Found\|YouTube' | head -3 | tr '\n' ',')"
          echo "IG-TITLE: $(curl -sL --max-time 25 https://tempmail.offexmail.online/instagram | grep -o '<title>[^<]*</title>' | head -1)"
