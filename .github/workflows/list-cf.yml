name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Landing pages live check
        run: |
          for u in "" "instagram" "discord" "elevenlabs" "youtube" "services" "images/inbox.svg" "landing-sitemap.xml"; do
            echo "/$u -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://tempmail.offexmail.online/$u)"
          done
          echo "--- title check ---"
          curl -sL --max-time 25 https://tempmail.offexmail.online/instagram | grep -o '<title>[^<]*</title>' | head -1
          echo "--- hub cards ---"
          curl -sL --max-time 25 https://tempmail.offexmail.online/services | grep -c 'temp-mail-for\|href='
