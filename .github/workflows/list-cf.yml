name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          GB="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          echo "=== GOOGLEBOT sitemap ==="
          curl -sS -o /tmp/s -w "code=%{http_code} type=%{content_type} size=%{size_download}\n" --max-time 25 -A "$GB" "https://offex.cyou/sitemap.xml"
          head -c 200 /tmp/s; echo
          echo "=== GOOGLEBOT robots ==="
          curl -sS -o /tmp/r -w "code=%{http_code}\n" --max-time 25 -A "$GB" "https://offex.cyou/robots.txt"
          cat /tmp/r
          echo "=== GOOGLEBOT home ==="
          curl -sS -o /dev/null -w "code=%{http_code}\n" --max-time 25 -A "$GB" "https://offex.cyou/"
          echo "=== cf headers ==="
          curl -sSI --max-time 25 -A "$GB" "https://offex.cyou/sitemap.xml" | head -25
          echo "=== sitemap first 3 locs ==="
          grep -o "<loc>[^<]*</loc>" /tmp/s | head -3
          echo "=== sitemap loc count ==="
          grep -c "<loc>" /tmp/s
