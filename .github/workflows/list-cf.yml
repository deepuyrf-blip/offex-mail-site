name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Bg space
        run: |
          echo "root      : $(curl -s -o /dev/null -w '%{http_code}' --max-time 40 https://factblink514-bg.hf.space/)"
          echo "health    : $(curl -s --max-time 30 https://factblink514-bg.hf.space/health)"
          echo "root body : $(curl -sL --max-time 40 https://factblink514-bg.hf.space/ | head -c 300)"
          echo "title     : $(curl -sL --max-time 40 https://factblink514-bg.hf.space/ | grep -o '<title>[^<]*</title>')"
