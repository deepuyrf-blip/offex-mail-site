name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://mytemp-mail.online
          echo "===== DOMAIN COUNTS (target old=0, new>0) ====="
          for p in "" "instagram" "hi/instagram" "privacy" "services"; do
            H=$(curl -sL --max-time 30 "$B/$p")
            echo "/$p offexmail.online count  : $(printf '%s' "$H" | grep -o 'offexmail\.online' | wc -l)"
            echo "/$p mytemp-mail.online count: $(printf '%s' "$H" | grep -o 'mytemp-mail\.online' | wc -l)"
          done
          echo "===== CANONICALS ====="
          for p in instagram hi/instagram; do
            echo "/$p canonical: $(curl -sL --max-time 30 "$B/$p" | grep -o '<link rel="canonical" href="[^"]*"' | head -1)"
          done
          echo "===== TITLES (must be own real titles) ====="
          for p in privacy services; do
            echo "/$p title: $(curl -sL --max-time 30 "$B/$p" | grep -o '<title>[^<]*</title>' | head -1)"
          done
          echo "/ title: $(curl -sL --max-time 30 "$B/" | grep -o '<title>[^<]*</title>' | head -1)"
