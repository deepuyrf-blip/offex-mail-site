name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Bg (downloader + transcript)
        run: |
          echo "root      : $(curl -s -o /dev/null -w '%{http_code}' --max-time 45 https://factblink514-bg.hf.space/)"
          echo "body head : $(curl -sL --max-time 45 https://factblink514-bg.hf.space/ | head -c 220)"
          echo "title     : $(curl -sL --max-time 45 https://factblink514-bg.hf.space/ | grep -o '<title>[^<]*</title>' | head -1)"
          echo "gradio cfg: $(curl -s -o /dev/null -w '%{http_code}' --max-time 45 https://factblink514-bg.hf.space/config)"
