name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          B=https://mytemp-mail.online
          echo "===== COUNTS (old,new,bytes,md5) ====="
          for p in "" "instagram" "hi/instagram" "privacy" "services"; do
            H=$(curl -sL --max-time 30 "$B/$p")
            echo "/$p old=$(printf '%s' "$H" | grep -o 'offexmail\.online' | wc -l) new=$(printf '%s' "$H" | grep -o 'mytemp-mail\.online' | wc -l) bytes=$(printf '%s' "$H" | wc -c) md5=$(printf '%s' "$H" | md5sum | cut -c1-12)"
          done
          echo "===== PRIVACY DETAIL ====="
          curl -sL --max-time 30 "$B/privacy" -o /tmp/p.html
          echo "support emails:"; grep -o 'support@[a-z.-]*' /tmp/p.html | sort | uniq -c
          echo "code example:"; grep -o 'example <code>[^<]*' /tmp/p.html
          echo "canonical:"; grep -o '<link rel="canonical" href="[^"]*"' /tmp/p.html
          echo "===== CANONICALS ====="
          for p in instagram hi/instagram; do echo "/$p $(curl -sL --max-time 30 "$B/$p" | grep -o '<link rel="canonical" href="[^"]*"' | head -1)"; done
          echo "===== TITLES ====="
          for p in privacy services; do echo "/$p $(curl -sL --max-time 30 "$B/$p" | grep -o '<title>[^<]*</title>' | head -1)"; done
