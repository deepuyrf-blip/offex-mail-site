name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Check i18n + promo
        run: |
          echo "i18n p_tag count   : $(curl -s --max-time 30 https://tempmail.offexmail.online/i18n.js | grep -c 'p_tag')"
          echo "i18n p_title count : $(curl -s --max-time 30 https://tempmail.offexmail.online/i18n.js | grep -c 'p_title')"
          echo "i18n size          : $(curl -s --max-time 30 https://tempmail.offexmail.online/i18n.js | wc -c)"
          echo "i18n cache hdr     : $(curl -sI --max-time 30 https://tempmail.offexmail.online/i18n.js | grep -i 'cache-control')"
          echo "promo in html      : $(curl -sL --max-time 30 https://tempmail.offexmail.online/ | grep -c 'id=\"promoOv\"')"
          echo "script tag         : $(curl -sL --max-time 30 https://tempmail.offexmail.online/ | grep -o 'i18n.js[^\"]*' | head -1)"
