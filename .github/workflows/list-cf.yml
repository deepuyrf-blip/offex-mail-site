name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== ADMIN PANEL PROBE ==="
          for u in "https://api.mytemp-mail.online/admin?code=Hyco" "https://api.mytemp-mail.online/" "https://api.mytemp-mail.online/history?code=Hyco"; do
            echo "URL: $u"
            echo "  code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -L "$u")"
            echo "  title=$(curl -sL --max-time 30 "$u" | grep -o '<title>[^<]*</title>' | head -1)"
            echo "  bytes=$(curl -sL --max-time 30 "$u" | wc -c)"
            echo "  h2s=$(curl -sL --max-time 30 "$u" | grep -o '<h2[^>]*>[^<]*' | head -6 | tr '\n' '|')"
          done
