name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: run
        run: |
          set -x
          A=https://api.mytemp-mail.online
          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Mobile Safari/537.36"
          curl -s --max-time 30 -A "$UA" -H "x-admin-code: Hyco" -H "Origin: $A" -H "Referer: $A/admin?code=Hyco" "$A/api/app-config" -o cfg.json
          echo "CFG_BYTES: $(wc -c < cfg.json)"
          python3 -c "import json;d=json.load(open('cfg.json'));u=d.setdefault('update',{});u['latest']='4.3';u['force']=False;u['url']='https://github.com/deepuyrf-blip/offex-mail-site/releases/download/v4.3/OffexMail.apk';json.dump(d,open('new.json','w'));print('APPEARANCE_KEYS:',len(d.get('appearance') or {}));print('ACCENT:',(d.get('appearance') or {}).get('accent'))"
          curl -s -X POST --max-time 30 -A "$UA" -H "x-admin-code: Hyco" -H "Content-Type: application/json" -H "Origin: $A" -H "Referer: $A/admin?code=Hyco" --data @new.json "$A/api/admin/app-config" -o post.json
          echo "POST: $(head -c 120 post.json)"
          sleep 3
          curl -s --max-time 30 -A "$UA" -H "x-admin-code: Hyco" -H "Origin: $A" -H "Referer: $A/admin?code=Hyco" "$A/api/app-config" -o after.json
          python3 -c "import json;d=json.load(open('after.json'));print('AFTER_UPDATE:',json.dumps(d.get('update')))"
          curl -sL --max-time 30 -A "$UA" "$A/admin?code=Hyco" -o adm.html
          echo "ADM_BYTES: $(wc -c < adm.html)"
          echo "DEVICES_CARD: $(grep -c OFFEX-DEVICES-CARD adm.html)"
          echo "APPEARANCE_CARD: $(grep -c OFFEX-APPEARANCE-CARD adm.html)"
          echo "SUPPORT_CARD: $(grep -c OFFEX-SUPPORT-CARD adm.html)"
