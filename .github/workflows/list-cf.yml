name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== RELEASES ==="
          gh release list --limit 8 || true
          echo "=== v3.8 ASSETS ==="
          gh release view v3.8 --json tagName,name,assets -q '.tagName, .name, (.assets[]|"\(.name) \(.size)")' || echo "v3.8 NOT FOUND"
          echo "=== DOWNLOAD v3.8 APK ==="
          mkdir -p pub
          gh release download v3.8 -p OffexMail.apk -D pub --clobber || echo "download failed"
          ls -la pub/ || true
          echo "=== COMMIT APK FOR FETCH ==="
          git config user.name "gha"; git config user.email "gha@local"
          cp pub/OffexMail.apk public/OffexMail-v3.8.apk || true
          git add public/OffexMail-v3.8.apk || true
          git commit -m "publish v3.8 apk for fetch" || echo "nothing to commit"
          git push || echo "push failed"
