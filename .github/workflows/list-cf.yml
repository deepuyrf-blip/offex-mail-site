name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://api.mytemp-mail.online
          echo "=== PUBLIC APP CONFIG ==="
          curl -s --max-time 30 "$A/api/app-config" | head -c 1500; echo
          echo "=== ADMIN APP CONFIG (code=Hyco) ==="
          curl -s --max-time 30 "$A/api/admin/app-config?code=Hyco" | head -c 1500; echo
          echo "=== ADMIN PANEL FORM FIELDS ==="
          curl -sL --max-time 30 "$A/admin?code=Hyco" | grep -oE 'name="[^"]*"|id="[^"]*"|action="[^"]*"|<input[^>]*>|<textarea[^>]*>' | head -40
          echo "=== ADMIN PAGE SCRIPT (endpoints) ==="
          curl -sL --max-time 30 "$A/admin?code=Hyco" | grep -oE "/api/[a-zA-Z0-9/_{}-]*" | sort -u | head -20
