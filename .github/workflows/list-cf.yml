name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Multilingual check
        run: |
          for u in "hi/instagram" "es/discord" "fr/elevenlabs" "de/youtube" "pt/amazon" "ru/telegram" "ar/facebook" "zh/tiktok" "ja/netflix" "instagram" "services" "landing-sitemap.xml"; do
            echo "/$u -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://tempmail.offexmail.online/$u)"
          done
          echo "TITLE-HI: $(curl -sL --max-time 25 https://tempmail.offexmail.online/hi/instagram | grep -o '<title>[^<]*</title>' | head -1)"
          echo "AR-RTL: $(curl -sL --max-time 25 https://tempmail.offexmail.online/ar/facebook | grep -c 'dir=.rtl.')"
