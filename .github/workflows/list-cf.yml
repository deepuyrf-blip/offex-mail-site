name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://mytemp-mail.online
          echo "###1 CORE PAGES"
          for p in "" services privacy about contact terms disclaimer instagram discord elevenlabs paytm swiggy; do
            echo "$p -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 25 -L $B/$p)"
          done
          echo "###2 LANGUAGE HUBS"
          for l in hi es fr de pt ru ar zh ja; do
            echo "$l -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 25 -L $B/$l)"
          done
          echo "###3 LANGUAGE PAGES"
          for p in hi/instagram es/discord ar/facebook ja/netflix ru/telegram; do
            echo "$p -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 25 -L $B/$p)"
          done
          echo "###4 OLD DOMAIN REDIRECT"
          for p in "" instagram hi/instagram; do
            echo "$p -> $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 25 https://tempmail.offexmail.online/$p)"
          done
          echo "###5 REMOVED PAGES (should 301)"
          for p in youtube gmail google whatsapp telegram; do
            echo "$p -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 25 $B/$p)"
          done
          echo "###6 ADSENSE + I18N + TITLES"
          H=$(curl -sL --max-time 30 $B/)
          echo "home-adsense: $(printf '%s' "$H" | grep -c adsbygoogle)"
          echo "home-i18n-script: $(printf '%s' "$H" | grep -o 'i18n.js?v=[0-9]*')"
          echo "home-title: $(printf '%s' "$H" | grep -o '<title>[^<]*</title>' | head -1)"
          echo "privacy-adsense: $(curl -sL --max-time 25 $B/privacy | grep -c adsbygoogle)"
          echo "insta-adsense: $(curl -sL --max-time 25 $B/instagram | grep -c adsbygoogle)"
          echo "hi-insta-adsense: $(curl -sL --max-time 25 $B/hi/instagram | grep -c adsbygoogle)"
          echo "###7 SEO FILES"
          for f in robots.txt sitemap.xml landing-sitemap.xml ads.txt; do
            echo "$f -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 25 $B/$f)"
          done
          echo "sitemap-urls: $(curl -sL --max-time 25 $B/sitemap.xml | grep -o '<loc>' | wc -l)"
          echo "landing-urls: $(curl -sL --max-time 25 $B/landing-sitemap.xml | grep -o '<loc>' | wc -l)"
          echo "###8 CANONICALS"
          echo "insta-canon: $(curl -sL --max-time 25 $B/instagram | grep -o '<link rel=.canonical. href=.[^\"]*' | head -1)"
          echo "hi-insta-canon: $(curl -sL --max-time 25 $B/hi/instagram | grep -o '<link rel=.canonical. href=.[^\"]*' | head -1)"
