name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: list
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "=== PAGES PROJECTS ==="
          curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/d33504e28650ba4603dc9cafc46d0ec9/pages/projects?per_page=50" | python3 -c "
import sys,json
d=json.load(sys.stdin)
print('success:',d.get('success'))
for p in (d.get('result') or []):
    print('  PAGES:',p.get('name'),'| subdomain:',p.get('subdomain'),'| created:',p.get('created_on'))
"
          echo "=== WORKERS (scripts) ==="
          curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/d33504e28650ba4603dc9cafc46d0ec9/workers/scripts" | python3 -c "
import sys,json
d=json.load(sys.stdin)
print('success:',d.get('success'))
for w in (d.get('result') or []):
    print('  WORKER:',w.get('id'),'| modified:',w.get('modified_on'))
"
          echo "=== WORKER ROUTES (zones) ==="
          for z in 5c5fca6f2e8bf44362a8ca850dbb3b76 900aba0bd69a63d84d137029b15da481; do
            echo "zone $z:"
            curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/zones/$z/workers/routes" | python3 -c "
import sys,json
d=json.load(sys.stdin)
for r in (d.get('result') or []):
    print('   ROUTE:',r.get('pattern'),'->',r.get('script'))
"
          done
