name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
    steps:
      - name: List Pages projects
        run: |
          echo "== PAGES PROJECTS =="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects?per_page=50" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result') or []; print('count', len(r)); [print(' -', p.get('name'), '|', p.get('subdomain'), '| domains:', p.get('domains')) for p in r]" || echo "err"
      - name: List zones
        run: |
          echo "== ZONES =="
          curl -s "https://api.cloudflare.com/client/v4/zones?per_page=50" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result') or []; print('count', len(r)); [print(' -', z.get('name'), z.get('status')) for z in r]" || echo "err"
