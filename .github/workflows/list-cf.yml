name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://api.mytemp-mail.online
          curl -sL --max-time 30 "$A/admin?code=Hyco" > /tmp/a.html
          echo "=== SCRIPT BLOCK ==="
          python3 - <<'PY'
          import re
          h=open('/tmp/a.html',encoding='utf-8').read()
          for m in re.findall(r'<script[^>]*>(.*?)</script>', h, re.S):
              if 'app-config' in m or 'fetch' in m:
                  print(m[:3000])
          PY
          echo "=== ADMIN GET (verbose) ==="
          curl -s -i --max-time 30 "$A/api/admin/app-config?code=Hyco" | head -c 800; echo
