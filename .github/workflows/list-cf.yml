name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          H=$(curl -sL --max-time 30 https://tempmail.offexmail.online/)
          echo "HOME-LEN: ${#H}"
          echo "SVC-SECTION: $(printf '%s' "$H" | grep -c 'id=.services.')"
          echo "SVC-LINKS: $(printf '%s' "$H" | grep -o 'class=.svc.' | wc -l)"
          echo "LANGPILLS: $(printf '%s' "$H" | grep -o 'langpill' | wc -l)"
          echo "LINK-INSTA: $(printf '%s' "$H" | grep -c 'href=./instagram.')"
          echo "LINK-HI: $(printf '%s' "$H" | grep -c 'href=./hi.')"
          echo "LINK-ALLSVC: $(printf '%s' "$H" | grep -c 'href=./services.')"
