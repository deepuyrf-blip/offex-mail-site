name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://api.mytemp-mail.online
          APK=https://github.com/deepuyrf-blip/offex-mail-site/releases/download/v3.1/OffexMail.apk
          curl -s --max-time 30 -H "x-admin-code: Hyco" "$A/api/app-config" > /tmp/cfg.json
          echo "=== BEFORE ==="; cat /tmp/cfg.json | head -c 1200; echo
          python3 - <<PY
          import json
          c=json.load(open('/tmp/cfg.json'))
          u=c.get('update') or {}
          u['latest']='3.1'
          u['url']='$APK'
          c['update']=u
          json.dump(c,open('/tmp/new.json','w'))
          print("NEW update:", json.dumps(u))
          PY
          echo "=== POST ==="
          curl -s -X POST --max-time 30 -H "x-admin-code: Hyco" -H "Content-Type: application/json" \
            --data @/tmp/new.json "$A/api/admin/app-config" | head -c 400; echo
          sleep 3
          echo "=== AFTER ==="
          curl -s --max-time 30 -H "x-admin-code: Hyco" "$A/api/app-config" | python3 -c "import sys,json;d=json.load(sys.stdin);print('update =',json.dumps(d.get('update')))"
