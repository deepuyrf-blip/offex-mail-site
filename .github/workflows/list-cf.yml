name: verify-adsense
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live pages for AdSense snippet
        run: |
          set -e
          for url in \
            https://mytemp-mail.online/ \
            https://mytemp-mail.online/privacy \
            https://mytemp-mail.online/services \
            https://mytemp-mail.online/instagram \
            https://mytemp-mail.online/hi/instagram ; do
            body=$(curl -s -L --max-time 30 "$url" || true)
            a=$(printf '%s' "$body" | grep -o 'adsbygoogle' | wc -l | tr -d ' ')
            b=$(printf '%s' "$body" | grep -o 'ca-pub-7802179098119853' | wc -l | tr -d ' ')
            echo "PAGE $url adsbygoogle=$a ca-pub=$b"
          done
