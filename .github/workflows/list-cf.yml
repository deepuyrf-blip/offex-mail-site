name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          H=$(curl -sL --max-time 30 https://tempmail.offexmail.online/)
          echo "SCRIPT-TAG: $(printf '%s' "$H" | grep -o 'i18n.js?v=[0-9]*')"
          echo "EL-ATTR: $(printf '%s' "$H" | grep -c 'data-i18n=.el_head.')"
          echo "SVC-ATTR: $(printf '%s' "$H" | grep -c 'data-i18n=.svc_head.')"
          echo "SVC-ALL-ATTR: $(printf '%s' "$H" | grep -c 'data-i18n=.svc_all.')"
          J=$(curl -sL --max-time 30 "https://tempmail.offexmail.online/i18n.js?v=5")
          echo "JS-EL_HEAD-COUNT: $(printf '%s' "$J" | grep -o 'el_head' | wc -l)"
          echo "JS-ES-EL_HEAD: $(printf '%s' "$J" | grep -o 'Correo temporal para ElevenLabs' | head -1)"
