name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://api.mytemp-mail.online
          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Mobile Safari/537.36"
          H1="x-admin-code: Hyco"
          curl -s --max-time 30 -A "$UA" -H "$H1" -H "Origin: $A" -H "Referer: $A/admin?code=Hyco" "$A/api/app-config" > /tmp/cfg.json
          echo "BEFORE: $(python3 -c "import json;d=json.load(open('/tmp/cfg.json'));print(json.dumps({'update':d.get('update'),'ads_keys':list((d.get('ads') or {}).keys())}))")"
          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/cfg.json'))
          u=c.setdefault('update',{})
          u['latest']="4.0"; u['force']=False
          u['url']="https://github.com/deepuyrf-blip/offex-mail-site/releases/download/v4.0/OffexMail.apk"
          a=c.setdefault('ads',{}); a['on']=True
          ann=c.setdefault('announcement',{}); ann['on']=True
          if not ann.get('text'): ann['text']="Good morning 🌅"
          json.dump(c,open('/tmp/new.json','w'))
          print("NEW update:", json.dumps(u))
          print("ads kept:", json.dumps(a))
          PY
          curl -s -X POST --max-time 30 -A "$UA" -H "$H1" -H "Content-Type: application/json" -H "Origin: $A" -H "Referer: $A/admin?code=Hyco" --data @/tmp/new.json "$A/api/admin/app-config" > /dev/null
          sleep 3
          echo "AFTER: $(curl -s --max-time 30 -A "$UA" -H "$H1" -H "Origin: $A" -H "Referer: $A/admin?code=Hyco" "$A/api/app-config" | python3 -c "import sys,json;d=json.load(sys.stdin);print(json.dumps(d.get('update')));print('banner:',(d.get('ads') or {}).get('banner'));print('app_id:',(d.get('ads') or {}).get('app_id'))")"
