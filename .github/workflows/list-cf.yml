name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://api.mytemp-mail.online
          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Mobile Safari/537.36"
          H1="x-admin-code: Hyco"
          curl -s --max-time 30 -A "$UA" -H "$H1" -H "Origin: $A" -H "Referer: $A/admin?code=Hyco" "$A/api/app-config" > /tmp/cfg.json
          echo "BEFORE ads: $(python3 -c "import json;print(json.dumps(json.load(open('/tmp/cfg.json')).get('ads')))")"
          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/cfg.json'))
          a=c.setdefault('ads',{})
          a['on']=True
          a['app_id']="ca-app-pub-7802179098119853~8006460361"
          a['banner']="ca-app-pub-7802179098119853/6769612342"
          a['interstitial']="ca-app-pub-7802179098119853/4351332568"
          a['rewarded']="ca-app-pub-7802179098119853/3317452492"
          a['app_open']="ca-app-pub-7802179098119853/9412087553"
          a['native']="ca-app-pub-7802179098119853/1623342855"
          c['ads']=a
          ann=c.setdefault('announcement',{}); ann['on']=True
          if not ann.get('text'): ann['text']="Good morning 🌅"
          u=c.setdefault('update',{})
          u['latest']="3.8"; u['force']=False
          u['url']="https://github.com/deepuyrf-blip/offex-mail-site/releases/download/v3.8/OffexMail.apk"
          json.dump(c,open('/tmp/new.json','w'))
          print("NEW ads:", json.dumps(a))
          PY
          curl -s -X POST --max-time 30 -A "$UA" -H "$H1" -H "Content-Type: application/json" -H "Origin: $A" -H "Referer: $A/admin?code=Hyco" --data @/tmp/new.json "$A/api/admin/app-config" > /dev/null
          sleep 3
          echo "AFTER ads: $(curl -s --max-time 30 -A "$UA" -H "$H1" -H "Origin: $A" -H "Referer: $A/admin?code=Hyco" "$A/api/app-config" | python3 -c "import sys,json;d=json.load(sys.stdin);print(json.dumps(d.get('ads')))")"
