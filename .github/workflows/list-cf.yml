name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://mytemp-mail.online
          echo "=== FAVICON ASSETS ==="
          for u in favicon.ico favicon-32.png favicon-192.png icon-512.png apple-touch-icon.png; do
            echo "$u -> $(curl -s -o /dev/null -w 'HTTP %{http_code} type=%{content_type} bytes=%{size_download}' --max-time 25 $B/$u)"
          done
          H=$(curl -sL --max-time 30 $B/)
          echo "home rel=icon: $(printf '%s' "$H" | grep -o 'rel="icon"' | wc -l)"
          echo "home apple-touch: $(printf '%s' "$H" | grep -o 'apple-touch-icon' | wc -l)"
          echo "home favicon-32 ref: $(printf '%s' "$H" | grep -o 'favicon-32.png' | wc -l)"
          echo "=== PRIVACY old-domain ==="
          P=$(curl -sL --max-time 30 $B/privacy)
          echo "privacy offexmail.online: $(printf '%s' "$P" | grep -o 'offexmail.online' | wc -l)"
          echo "privacy mytemp-mail.online: $(printf '%s' "$P" | grep -o 'mytemp-mail.online' | wc -l)"
          echo "privacy rel=icon: $(printf '%s' "$P" | grep -o 'rel="icon"' | wc -l)"
          echo "=== TERMS ==="
          T=$(curl -sL --max-time 30 $B/terms)
          echo "terms offexmail.online: $(printf '%s' "$T" | grep -o 'offexmail.online' | wc -l)"
          echo "=== HI HUB ==="
          echo "hi rel=icon: $(curl -sL --max-time 30 $B/hi | grep -o 'rel="icon"' | wc -l)"
