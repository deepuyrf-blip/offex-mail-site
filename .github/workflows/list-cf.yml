name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Verify audio ads
        run: |
          for p in "" "about.html" "blog.html" "privacy.html" "remove-silence-from-audio-guide.html" "voice-bgm-separation-explained.html"; do
            B=$(curl -s --max-time 25 "https://offexmail.online/$p")
            echo "page '$p' -> tag:$(echo "$B" | grep -c 'quge5.com/88/tag.min.js') adsense:$(echo "$B" | grep -c 'ca-pub-7802179098119853')"
          done
          echo "sw.js        : $(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://offexmail.online/sw.js)"
          echo "sw content   : $(curl -s --max-time 25 https://offexmail.online/sw.js | tr -d '\n' | head -c 120)"
