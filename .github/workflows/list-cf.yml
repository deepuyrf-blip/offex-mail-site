name: Health check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d33504e28650ba4603dc9cafc46d0ec9
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Health
        run: |
          echo "=== OFFEX MAIL ==="
          echo "root_http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://tempmail.offexmail.online/)"
          echo "swjs_http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://tempmail.offexmail.online/sw.js)"
          echo "proxy_http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://tempmail.offexmail.online/api/status)"
          echo "monetag_tag=$(curl -sL --max-time 30 https://tempmail.offexmail.online/ | grep -c 'quge5.com/88/tag.min.js')"
          echo "=== OFFEX AUDIO ==="
          echo "root_http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://offexmail.online/)"
          echo "swjs_http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://offexmail.online/sw.js)"
          echo "monetag_tag=$(curl -sL --max-time 30 https://offexmail.online/ | grep -c 'quge5.com/88/tag.min.js')"
          echo "adsense_meta=$(curl -sL --max-time 30 https://offexmail.online/ | grep -c 'ca-pub-7802179098119853')"
          echo "hf_proxy_http=$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 https://offexmail.online/hf/)"
          echo "=== HF SPACE ==="
          echo "space_stage=$(curl -s --max-time 30 https://huggingface.co/api/spaces/factblink514/Compiled -H "Authorization: Bearer $HF_TOKEN" | jq -r .runtime.stage)"
          echo "=== CF PROJECTS ==="
          echo "offex_mail_project=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/offex-mail" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result.name // "MISSING"')"
          echo "audio_project=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/audio" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result.name // "MISSING"')"
          echo "=== END ==="
