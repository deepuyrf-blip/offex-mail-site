name: list-cf
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live homepage
        run: |
          B=https://mytemp-mail.online
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -L "$B/")
          H=$(curl -sL --max-time 30 "$B/")
          echo "HTTP code: $CODE"
          echo "TITLE: $(printf '%s' "$H" | grep -o '<title>[^<]*</title>' | head -1)"
          echo "adsbygoogle count: $(printf '%s' "$H" | grep -o 'adsbygoogle' | wc -l)"
          echo "data-i18n count: $(printf '%s' "$H" | grep -o 'data-i18n' | wc -l)"
          echo "i18n.js version: $(printf '%s' "$H" | grep -o 'i18n.js?v=[0-9]*' | head -1)"
          echo "svc cards count: $(printf '%s' "$H" | grep -o 'class="svc"' | wc -l)"
