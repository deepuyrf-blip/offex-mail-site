name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Mobile Safari/537.36"
          for u in "https://offex.cyou/sitemap.xml" "https://offex.cyou/robots.txt" "https://offex.cyou/" "https://offex.cyou/hi/"; do
            echo "=== $u"
            curl -sS -o /tmp/out -w "code=%{http_code} type=%{content_type} size=%{size_download} ip=%{remote_ip}\n" --max-time 25 -A "$UA" "$u" || echo "curl failed: $?"
            head -c 220 /tmp/out; echo; echo
          done
          echo "=== DNS ==="
          getent hosts offex.cyou || echo "no DNS"
