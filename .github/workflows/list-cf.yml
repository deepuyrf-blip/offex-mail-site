name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://tempmail.offexmail.online
          for p in "" "privacy" "about" "contact" "terms" "disclaimer" "cookies" "refund" "services" "instagram"; do
            T=$(curl -sL --max-time 20 $B/$p | grep -o '<title>[^<]*</title>' | head -1)
            echo "/$p  ==>  $T"
          done
