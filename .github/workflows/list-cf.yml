name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://api.mytemp-mail.online
          echo "1 query-param:  $(curl -s --max-time 25 "$A/api/app-config?code=Hyco" | head -c 200)"
          echo "2 x-admin-code: $(curl -s --max-time 25 -H "x-admin-code: Hyco" "$A/api/app-config" | head -c 200)"
          echo "3 x-admin-code lower: $(curl -s --max-time 25 -H "X-Admin-Code: Hyco" "$A/api/app-config" | head -c 200)"
          echo "4 authorization: $(curl -s --max-time 25 -H "Authorization: Hyco" "$A/api/app-config" | head -c 200)"
          echo "5 x-admin: $(curl -s --max-time 25 -H "x-admin: Hyco" "$A/api/app-config" | head -c 200)"
          echo "6 no-auth: $(curl -s --max-time 25 "$A/api/app-config" | head -c 200)"
          echo "--- app-config via admin page host path ---"
          echo "7 /api/status: $(curl -s --max-time 25 "$A/api/status" | head -c 250)"
