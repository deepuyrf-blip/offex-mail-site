name: List CF assets
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Mobile Safari/537.36"
          A=https://api.mytemp-mail.online
          for u in "/admin?code=Hyco" "/audio-admin?code=Hyco" "/api/app-config" "/api/audio-app-config" "/api/status"; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 25 -A "$UA" -H "Origin: https://mytemp-mail.online" -H "Referer: https://mytemp-mail.online/" "$A$u")"
          done
          echo "--- body of audio-admin ---"
          curl -s --max-time 25 -A "$UA" "$A/audio-admin?code=Hyco" | head -c 300
          echo
          echo "--- body of admin ---"
          curl -s --max-time 25 -A "$UA" "$A/admin?code=Hyco" | head -c 200
          echo
