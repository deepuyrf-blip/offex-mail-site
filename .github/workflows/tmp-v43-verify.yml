name: temp v4.3 verify
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: verify devices / messages / delete / appearance round-trip
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, random, copy

          UA = ('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 '
                '(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36')
          BASE = 'https://api.mytemp-mail.online'

          def req(path, method='GET', body=None, admin=False, origin='https://mytemp-mail.online'):
              data = json.dumps(body).encode() if body is not None else None
              r = urllib.request.Request(BASE + path, data=data, method=method)
              r.add_header('User-Agent', UA)
              r.add_header('Accept', 'application/json')
              r.add_header('Origin', origin)
              r.add_header('Referer', origin + '/')
              if body is not None:
                  r.add_header('Content-Type', 'application/json')
              if admin:
                  r.add_header('x-admin-code', 'Hyco')
              try:
                  with urllib.request.urlopen(r, timeout=45) as resp:
                      return resp.status, resp.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', 'replace')

          def show(tag, s, t, n=500):
              print('--- %s -> HTTP %s ---' % (tag, s))
              print(t[:n])

          # 1. public config + appearance keys
          s, t = req('/api/app-config')
          cfg = json.loads(t)
          print('appearance keys:', sorted(cfg.get('appearance', {}).keys()))
          print('appearance sample:', json.dumps({k: cfg['appearance'].get(k) for k in
                ('theme_mode','accent','accent2','radius','hero_title','show_features')}))
          print('ads still present:', sorted(cfg.get('ads', {}).keys()), 'on=', cfg.get('ads',{}).get('on'))

          # 2. auth gate
          s, t = req('/api/admin/devices')
          print('devices WITHOUT admin code -> HTTP', s, '(expect 403)')
          s, t = req('/api/admin/devices', admin=True)
          dev0 = json.loads(t)
          print('devices WITH admin code -> HTTP', s, 'count=', dev0.get('count'))

          # 3. synthetic device: create -> list -> delete -> list
          iid = 'v43-selftest-' + ''.join(random.choice('abcdef0123456789') for _ in range(10))
          s, t = req('/api/app/install', 'POST', {'install_id': iid, 'manufacturer': 'Selftest',
                    'model': 'V43Probe', 'brand': 'Selftest', 'device': 'Selftest V43Probe',
                    'android_version': '14', 'sdk': 34, 'app_version': '4.3', 'version_code': 33,
                    'locale': 'en_IN', 'screen': '411x891'})
          print('create device -> HTTP', s, t[:160])
          s, t = req('/api/admin/devices', admin=True)
          present = any(d.get('install_id') == iid for d in json.loads(t).get('devices', []))
          print('device listed after create:', present)
          s, t = req('/api/admin/devices/delete', 'POST', {'install_id': iid}, admin=True)
          print('delete device -> HTTP', s, t[:160])
          s, t = req('/api/admin/devices', admin=True)
          still = any(d.get('install_id') == iid for d in json.loads(t).get('devices', []))
          print('device still listed after delete:', still, '(expect False)')

          # 4. synthetic message: create -> find id -> delete -> confirm
          tag = 'v43 selftest ' + ''.join(random.choice('abcdef0123456789') for _ in range(8))
          s, t = req('/api/support', 'POST', {'message': tag, 'category': 'Other',
                    'address': 'selftest@offex', 'version': '4.3', 'device': 'Selftest V43Probe'})
          print('create message -> HTTP', s, t[:160])
          s, t = req('/api/admin/support', admin=True)
          msgs = json.loads(t).get('messages', [])
          mid = next((m['id'] for m in msgs if m.get('message') == tag), None)
          print('message id found:', mid)
          s, t = req('/api/admin/support/delete', 'POST', {'id': mid}, admin=True)
          print('delete message -> HTTP', s, t[:160])
          s, t = req('/api/admin/support', admin=True)
          gone = not any(m.get('message') == tag for m in json.loads(t).get('messages', []))
          print('message gone after delete:', gone, '(expect True)')
          print('real user message still present:',
                any('Not working' in (m.get('message') or '') for m in json.loads(t).get('messages', [])))

          # 5. appearance round-trip (full config, then restore)
          orig = copy.deepcopy(cfg); orig.pop('stats', None)
          mod = copy.deepcopy(orig)
          mod.setdefault('appearance', {})
          mod['appearance']['accent'] = '#00C2FF'
          mod['appearance']['theme_mode'] = 'dark'
          mod['appearance']['banner_on'] = True
          mod['appearance']['banner_text'] = 'Selftest banner'
          s, t = req('/api/admin/app-config', 'POST', mod, admin=True, origin='https://api.mytemp-mail.online')
          print('push appearance -> HTTP', s)
          s, t = req('/api/app-config')
          ap = json.loads(t)['appearance']
          print('after push: accent=%s theme=%s banner_on=%s banner_text=%s' %
                (ap['accent'], ap['theme_mode'], ap['banner_on'], ap['banner_text']))
          s, t = req('/api/admin/app-config', 'POST', orig, admin=True, origin='https://api.mytemp-mail.online')
          print('restore -> HTTP', s)
          s, t = req('/api/app-config')
          ap2 = json.loads(t)['appearance']
          print('after restore: accent=%s theme=%s banner_on=%s' %
                (ap2['accent'], ap2['theme_mode'], ap2['banner_on']))
          print('ads preserved after round-trip:', json.loads(t).get('ads'))
          print('DONE')
          PY
