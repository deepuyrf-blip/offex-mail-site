name: Verify Install API
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the install + admin aggregate endpoints
        run: |
          UA='Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Mobile Safari/537.36'
          ID="ci-verify-$(date +%s)"
          echo "install_id=$ID"
          echo "--- POST /api/app/install ---"
          curl -s -w '\nHTTP %{http_code}\n' -X POST "https://api.mytemp-mail.online/api/app/install" -H "Content-Type: application/json" -H "User-Agent: $UA" -H "Origin: https://mytemp-mail.online" -H "Referer: https://mytemp-mail.online/" -d "{\"install_id\":\"$ID\",\"manufacturer\":\"GitHub\",\"model\":\"ActionsRunner\",\"brand\":\"GitHub\",\"device\":\"GitHub ActionsRunner\",\"android_version\":\"14\",\"sdk\":34,\"app_version\":\"3.9\",\"version_code\":29,\"locale\":\"en_IN\",\"screen\":\"412x915\"}"
          echo
          echo "--- GET /api/admin/installs ---"
          curl -s -w '\nHTTP %{http_code}\n' "https://api.mytemp-mail.online/api/admin/installs" -H "x-admin-code: Hyco" -H "User-Agent: $UA" -H "Origin: https://mytemp-mail.online" -H "Referer: https://mytemp-mail.online/"
          echo
