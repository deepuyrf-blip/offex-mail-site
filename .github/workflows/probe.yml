name: Probe Support API
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          set -x
          BASE="https://api.mytemp-mail.online"
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36'
          MARK="PROBE_SUPPORT_E2E_$GITHUB_RUN_ID"
          echo "MARK=$MARK"

          echo "=== (0) health/config ==="
          curl -sS -o /dev/null -w "app-config http=%{http_code}\n" "$BASE/api/app-config" -H "User-Agent: $UA" -H "Origin: https://mytemp-mail.online" -H "Referer: https://mytemp-mail.online/"

          echo "=== (a) POST /api/support (expect 200) ==="
          curl -sS -i -X POST "$BASE/api/support" \
            -H "User-Agent: $UA" -H "Origin: https://mytemp-mail.online" -H "Referer: https://mytemp-mail.online/" \
            -H "Content-Type: application/json" \
            -d "{\"message\":\"$MARK end-to-end support test from GH Actions\",\"category\":\"Bug\",\"address\":\"probe123@mytemp-mail.online\",\"version\":\"3.7\",\"device\":\"GH Actions Probe\"}"
          echo

          echo "=== (a2) POST /api/support empty message (expect 400) ==="
          curl -sS -o /tmp/empty.txt -w "empty http=%{http_code}\n" -X POST "$BASE/api/support" \
            -H "User-Agent: $UA" -H "Origin: https://mytemp-mail.online" -H "Referer: https://mytemp-mail.online/" \
            -H "Content-Type: application/json" -d '{"message":"   "}'
          cat /tmp/empty.txt; echo

          echo "=== (b) GET /api/admin/support (x-admin-code) ==="
          curl -sS -i "$BASE/api/admin/support?limit=100" \
            -H "User-Agent: $UA" -H "Origin: https://mytemp-mail.online" -H "Referer: https://mytemp-mail.online/" \
            -H "x-admin-code: Hyco"
          echo
          echo "--- marker present in admin list? ---"
          curl -sS "$BASE/api/admin/support?limit=100" -H "User-Agent: $UA" -H "x-admin-code: Hyco" | grep -o "$MARK" | head -1

          echo "=== (c) GET /admin?code=Hyco (panel markup) ==="
          curl -sS -o /tmp/panel.html -w "admin http=%{http_code}\n" "$BASE/admin?code=Hyco" \
            -H "User-Agent: $UA" -H "Origin: https://mytemp-mail.online" -H "Referer: https://mytemp-mail.online/"
          echo "OFFEX-SUPPORT-CARD count: $(grep -c 'OFFEX-SUPPORT-CARD' /tmp/panel.html)"
          echo "loadSupport count: $(grep -c 'function loadSupport()' /tmp/panel.html)"
          echo "Support/Messages heading count: $(grep -c 'Support / Messages' /tmp/panel.html)"
          echo "OFFEX-ADMIN-V2 still present: $(grep -c 'OFFEX-ADMIN-V2' /tmp/panel.html)"
