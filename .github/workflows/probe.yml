name: Probe API
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live API
        run: |
          UA='Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Mobile Safari/537.36'
          H=(-A "$UA" -H "Origin: https://mytemp-mail.online" -H "Referer: https://mytemp-mail.online/")
          echo "===== GET /health ====="
          curl -s -m 40 "${H[@]}" -w "\nHTTP %{http_code}\n" https://api.mytemp-mail.online/health
          echo "===== POST /api/device (valid) ====="
          curl -s -m 40 -X POST "${H[@]}" -H "Content-Type: application/json" \
            -d '{"token":"PROBE_TOKEN_DELETE_ME","address":"probe@mytemp-mail.online","platform":"android"}' \
            -w "\nHTTP %{http_code}\n" https://api.mytemp-mail.online/api/device
          echo "===== POST /api/device (missing token -> expect 400) ====="
          curl -s -m 40 -X POST "${H[@]}" -H "Content-Type: application/json" \
            -d '{}' -w "\nHTTP %{http_code}\n" https://api.mytemp-mail.online/api/device
          echo "===== GET /api/status ====="
          curl -s -m 40 "${H[@]}" -w "\nHTTP %{http_code}\n" https://api.mytemp-mail.online/api/status
