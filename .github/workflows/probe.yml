name: probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe backend api
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36'
          BASE='https://api.mytemp-mail.online'
          H=(-A "$UA" -H "Origin: https://mytemp-mail.online" -H "Referer: https://mytemp-mail.online/" -H "x-admin-code: Hyco")
          echo "== health =="
          curl -sS -m 40 "${H[@]}" -w "\nhttp=%{http_code}\n" "$BASE/health"
          echo "== support BEFORE =="
          curl -sS -m 40 "${H[@]}" -w "\nhttp=%{http_code}\n" "$BASE/api/admin/support"
          echo "== cleanup =="
          curl -sS -m 60 "${H[@]}" -H "Content-Type: application/json" -X POST -d '{}' -w "\nhttp=%{http_code}\n" "$BASE/api/admin/cleanup"
          echo "== support AFTER =="
          curl -sS -m 40 "${H[@]}" -w "\nhttp=%{http_code}\n" "$BASE/api/admin/support"
          echo "== app-config =="
          curl -sS -m 40 "${H[@]}" -w "\nhttp=%{http_code}\n" "$BASE/api/app-config"
