name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Offex backend
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          ORG="https://offex.example"
          BASE="https://factblink514-compiled.hf.space"
          echo "=== (a) GET /admin?code=Hyco ==="
          curl -s -o /tmp/admin.html -w "HTTP_CODE=%{http_code}\n" -A "$UA" -H "Authorization: Bearer $HF_TOKEN" -H "Origin: $ORG" -H "Referer: $ORG/" "$BASE/admin?code=Hyco"
          echo "--- Support card heading count ---"
          grep -c "Support / Messages" /tmp/admin.html || true
          echo "--- supList id count ---"
          grep -c "supList" /tmp/admin.html || true
          echo "--- fix marker count (d) ---"
          grep -c "OFFEX-ADMIN-V3-HARDENED" /tmp/admin.html || true
          echo "--- remaining literal loading... count ---"
          grep -o "loading\.\.\." /tmp/admin.html | wc -l
          echo "--- logbox default ---"
          grep -o 'id="logbox" class="logbox">[^<]*' /tmp/admin.html || true
          echo "--- supList default ---"
          grep -o 'id="supList" class="logbox">[^<]*' /tmp/admin.html || true
          echo "--- api() timeout/onErr present ---"
          grep -c "Request timed out" /tmp/admin.html || true
          echo "=== (b) GET /api/admin/support ==="
          curl -s -w "\nHTTP_CODE=%{http_code}\n" -A "$UA" -H "Authorization: Bearer $HF_TOKEN" -H "Origin: $ORG" -H "Referer: $ORG/" -H "x-admin-code: Hyco" "$BASE/api/admin/support"
          echo "=== (c) GET /api/admin/app-log ==="
          curl -s -w "\nHTTP_CODE=%{http_code}\n" -A "$UA" -H "Authorization: Bearer $HF_TOKEN" -H "Origin: $ORG" -H "Referer: $ORG/" -H "x-admin-code: Hyco" "$BASE/api/admin/app-log"
