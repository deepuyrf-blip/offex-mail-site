name: apply-fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run patch and commit
        run: |
          set -e
          python3 patch_el.py
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          git add public/
          git commit -m "fix: ElevenLabs claim 100% -> 85%" || echo "no changes"
          git push
