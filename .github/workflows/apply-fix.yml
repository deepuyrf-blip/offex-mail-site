name: apply-fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html and commit
        run: |
          set -e
          echo '' | base64 -d > /tmp/p.py
          python3 /tmp/p.py
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          git add public/index.html
          git commit -m "fix: call backend directly (Cloudflare Pages proxy not executing)" || echo "no changes"
          git push
