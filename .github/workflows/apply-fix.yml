name: apply-fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix inbox domain copy and commit
        run: |
          set -e
          echo '' | base64 -d > /tmp/f.py
          python3 /tmp/f.py
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          git add public/
          git commit -m "fix: inbox domain copy says offexmail.online (not mytemp-mail.online)" || echo "no changes"
          git push
