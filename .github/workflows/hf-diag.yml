name: hf-diag
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live
        run: |
          set +e
          O=/tmp/o.txt
          : > "$O"
          sleep 30
          for u in "https://mytemp-mail.online/" "https://offex-mail.pages.dev/" "https://offex-mail.pages.dev/api/status"; do
            echo "== $u ==" >> "$O"
            code=$(curl -s -L -o /tmp/b -w "%{http_code}" --max-time 60 "$u")
            echo "status=$code bytes=$(wc -c </tmp/b) api_base_hits=$(grep -c 'factblink514-compiled' /tmp/b)" >> "$O"
            grep -o 'Error 1046' /tmp/b | head -1 >> "$O"
          done
          head -c 2500 "$O" > /tmp/iss.txt
      - name: Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "live-verify results" --body-file /tmp/iss.txt
