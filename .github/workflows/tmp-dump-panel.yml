name: tmp-dump-panel
on: workflow_dispatch
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: fetch panels
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          A='https://api.mytemp-mail.online'
          curl -sS --max-time 40 -A "$UA" "$A/admin?code=Hyco" -o admin.html
          curl -sS --max-time 40 -A "$UA" "$A/audio-admin?code=Hyco" -o audio.html
          echo "=== sizes ==="; wc -c admin.html audio.html
          echo "=== ADMIN external refs ==="
          grep -oE '(src|href)="[^"]*"' admin.html | sort -u | head -60
          echo "=== ADMIN fetch()/XHR refs ==="
          grep -oE "fetch\([^)]*\)|XMLHttpRequest|/api/[A-Za-z0-9_./-]*" admin.html | sort -u | head -60
          echo "=== ADMIN referer/origin/code logic ==="
          grep -niE 'referer|origin|location\.|document\.referrer|history\.|code=' admin.html | head -40
          echo "=== AUDIO external refs ==="
          grep -oE '(src|href)="[^"]*"' audio.html | sort -u | head -60
          echo "=== AUDIO fetch()/XHR refs ==="
          grep -oE "fetch\([^)]*\)|XMLHttpRequest|/api/[A-Za-z0-9_./-]*" audio.html | sort -u | head -60
          echo "=== AUDIO referer/origin/code logic ==="
          grep -niE 'referer|origin|location\.|document\.referrer|history\.|code=' audio.html | head -40
          echo "=== ADMIN title/head 1200 ==="
          head -c 1200 admin.html
          echo
          echo "=== AUDIO title/head 1200 ==="
          head -c 1200 audio.html
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: panels
          path: |
            admin.html
            audio.html
