name: tmp-diag-panels
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: probe matrix
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          A='https://api.mytemp-mail.online'
          probe() {
            label="$1"; url="$2"; shift 2
            out=/tmp/b.txt
            code=$(curl -sS -o $out -D /tmp/h.txt -w '%{http_code}' --max-time 40 -A "$UA" "$@" "$url")
            ct=$(grep -i '^content-type' /tmp/h.txt | head -1 | tr -d '\r')
            loc=$(grep -i '^location' /tmp/h.txt | head -1 | tr -d '\r')
            xp=$(grep -i '^x-offex-proxy' /tmp/h.txt | head -1 | tr -d '\r')
            sz=$(wc -c < $out)
            echo "[$label] code=$code size=$sz | $ct | $xp | $loc"
            echo "    first80: $(head -c 80 $out | tr '\n' ' ')"
            echo "    marker ADMIN=$(grep -c 'OFFEX-ADMIN-V2' $out) AUDIO=$(grep -c 'OFFEX-AUDIO-ADMIN-V2' $out) forbidden=$(grep -c 'forbidden' $out)"
          }
          echo "############ NO Referer/Origin ############"
          probe "admin-nohdr"      "$A/admin?code=Hyco"
          probe "audioadmin-nohdr" "$A/audio-admin?code=Hyco"
          probe "appconfig-nohdr"  "$A/api/app-config"
          probe "audioappcfg-nohdr" "$A/api/audio-app-config"
          echo "############ WITH Referer/Origin ############"
          probe "admin-ref"        "$A/admin?code=Hyco"        -H 'Origin: https://mytemp-mail.online' -H 'Referer: https://mytemp-mail.online/'
          probe "audioadmin-ref"   "$A/audio-admin?code=Hyco"  -H 'Origin: https://mytemp-mail.online' -H 'Referer: https://mytemp-mail.online/'
          probe "appconfig-ref"    "$A/api/app-config"         -H 'Origin: https://mytemp-mail.online' -H 'Referer: https://mytemp-mail.online/'
          probe "audioappcfg-ref"  "$A/api/audio-app-config"   -H 'Origin: https://mytemp-mail.online' -H 'Referer: https://mytemp-mail.online/'
          echo "############ follow redirects (no hdr) ############"
          echo "admin -L: $(curl -sS -o /dev/null -L -w '%{http_code} final=%{url_effective}' --max-time 40 -A "$UA" "$A/admin?code=Hyco")"
          echo "############ headers dump for admin-nohdr ############"
          curl -sS -o /dev/null -D - --max-time 40 -A "$UA" "$A/admin?code=Hyco"
