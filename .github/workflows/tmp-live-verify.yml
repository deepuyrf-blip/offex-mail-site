name: temp-live-verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the live audio site and its eight hubs
        shell: bash
        run: |
          set +e
          SITE="https://offexmail.online"
          CB="cb=$GITHUB_RUN_ID$RANDOM"

          echo "==================== HOMEPAGES ===================="
          for L in "" hi es pt ar ru id fr de; do
            URL="$SITE/$L/?$CB"
            BODY=$(curl -sL --max-time 30 "$URL")
            CODE=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 30 "$URL")
            LANG=$(echo "$BODY" | grep -o '<html lang="[a-zA-Z-]*"' | head -1 | sed 's/.*lang="//;s/"//')
            DIR=$(echo "$BODY" | grep -o 'dir="[a-z]*"' | head -1 | sed 's/dir="//;s/"//')
            TITLE=$(echo "$BODY" | grep -o '<title>[^<]*</title>' | head -1 | sed 's/<[^>]*>//g')
            CANON=$(echo "$BODY" | grep -o 'rel="canonical" href="[^"]*"' | head -1 | sed 's/.*href="//;s/"//')
            HREF=$(echo "$BODY" | grep -o 'rel="alternate" hreflang="[^"]*"' | wc -l)
            ADS=$(echo "$BODY" | grep -o 'name="google-adsense-account" content="ca-pub-9424904813990636"' | wc -l)
            LOADER=$(echo "$BODY" | grep -o 'adsbygoogle.js?client=ca-pub-9424904813990636' | wc -l)
            PREM=$(echo "$BODY" | grep -o '/premium.css' | wc -l)
            SWITCH=$(echo "$BODY" | grep -o 'id="langSelect"' | wc -l)
            T1=$(echo "$BODY" | grep -o 'id="removeTool"' | wc -l)
            T2=$(echo "$BODY" | grep -o 'id="enhanceTool"' | wc -l)
            T3=$(echo "$BODY" | grep -o 'id="isolateTool"' | wc -l)
            echo "/$L/"
            echo "   status=$CODE lang=$LANG dir=$DIR hreflang=$HREF"
            echo "   title=$TITLE"
            echo "   canonical=$CANON"
            echo "   adsense-meta=$ADS loader=$LOADER premium.css=$PREM switcher=$SWITCH tools=$T1$T2$T3"
            echo "   bytes=$(echo -n "$BODY" | wc -c)"
          done

          echo "==================== ENGLISH TOOL PAGE ===================="
          H=$(curl -sL --max-time 30 "$SITE/?$CB")
          echo "removeBtn=$(echo "$H" | grep -o 'id="removeBtn"' | wc -l) \
          enhanceBtn=$(echo "$H" | grep -o 'id="enhanceBtn"' | wc -l) \
          isolateBtn=$(echo "$H" | grep -o 'id="isolateBtn"' | wc -l) \
          engine=$(echo "$H" | grep -o '/audio-engine.js' | wc -l) \
          hfproxy=$(echo "$H" | grep -o 'location.origin+"/hf"' | wc -l) \
          health=$(echo "$H" | grep -o 'checkHealth' | wc -l) \
          endpoints=$(echo "$H" | grep -o 'process_audio\|enhance_audio\|isolate_voice_bgm' | wc -l) \
          deadmodals=$(echo "$H" | grep -o 'openModal\|closeModal' | wc -l) \
          hreflang=$(echo "$H" | grep -o 'rel="alternate" hreflang="[^"]*"' | wc -l)"

          echo "==================== GUIDES / OTHER PAGES ===================="
          for P in blog app-ui about why-is-my-recording-noisy remove-silence-from-audio-guide separate-vocals-from-a-song; do
            BODY=$(curl -sL --max-time 30 "$SITE/$P?$CB")
            CODE=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 30 "$SITE/$P?$CB")
            echo "/$P status=$CODE switcher=$(echo "$BODY" | grep -o 'id="langSelect"' | wc -l) premium.css=$(echo "$BODY" | grep -o '/premium.css' | wc -l) adsense=$(echo "$BODY" | grep -o 'name="google-adsense-account"' | wc -l)"
          done

          echo "==================== ASSETS ===================="
          for A in lang-switch.js premium.css styles.css images/og-cover.png sitemap.xml robots.txt ads.txt _worker.js audio-engine.js; do
            echo "/$A status=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 30 "$SITE/$A?$CB")"
          done

          echo "==================== CACHE HEADERS ===================="
          echo "home  : $(curl -sI --max-time 30 "$SITE/?$CB" | grep -i '^cache-control' | tr -d '\r')"
          echo "hi hub: $(curl -sI --max-time 30 "$SITE/hi/?$CB" | grep -i '^cache-control' | tr -d '\r')"
          echo "css   : $(curl -sI --max-time 30 "$SITE/premium.css?$CB" | grep -i '^cache-control' | tr -d '\r')"

          echo "==================== SITEMAP ===================="
          SM=$(curl -sL --max-time 30 "$SITE/sitemap.xml?$CB")
          echo "urls=$(echo "$SM" | grep -o '<loc>' | wc -l) hubs=$(echo "$SM" | grep -o '/\(hi\|es\|pt\|ar\|ru\|id\|fr\|de\)/</loc>' | wc -l)"

          echo "==================== RTL SPOT CHECK ===================="
          AR=$(curl -sL --max-time 30 "$SITE/ar/?$CB")
          echo "ar dir=rtl present: $(echo "$AR" | grep -o 'dir="rtl"' | wc -l)"
          echo "ar arabic text    : $(echo "$AR" | grep -c '[أ-ي]')"
