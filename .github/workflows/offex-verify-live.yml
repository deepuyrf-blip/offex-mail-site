name: Offex live verify (temp)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deploy to propagate
        run: sleep 150
      - name: Check URLs (HTTP code + canonical)
        run: |
          BASE="https://mytemp-mail.online"
          check() {
            u="$1"
            body=$(curl -sL --max-time 40 -A 'Mozilla/5.0' "$u")
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 40 -A 'Mozilla/5.0' "$u")
            canon=$(printf '%s' "$body" | grep -io '<link[^>]*rel="canonical"[^>]*>' | head -1 | sed -E 's/.*href="([^"]+)".*/\1/')
            title=$(printf '%s' "$body" | grep -io '<title>[^<]*' | head -1 | sed 's/<title>//i')
            echo "URL=$u | HTTP=$code | CANONICAL=$canon | TITLE=$title"
          }
          for p in / /services /instagram /adobe /apple /microsoft /twitter /x /openai /chatgpt /paypal /playstation /zoom /hi/instagram /es/adobe /hi/adobe /youtube /temp-mail-for-instagram /favicon-48.png /favicon.ico /favicon.svg /manifest.webmanifest; do
            check "$BASE$p"
          done
      - name: Favicon asset content-type and size
        run: |
          BASE="https://mytemp-mail.online"
          for f in favicon.ico favicon-32.png favicon-48.png favicon-192.png apple-touch-icon.png icon-512.png favicon.svg; do
            echo "$f -> $(curl -s -o /dev/null -w 'HTTP %{http_code} | type=%{content_type} | bytes=%{size_download}' --max-time 30 $BASE/$f)"
          done
      - name: Homepage favicon markup
        run: |
          H=$(curl -sL --max-time 30 https://mytemp-mail.online/)
          echo "rel=icon count       : $(printf '%s' "$H" | grep -o 'rel="icon"' | wc -l)"
          echo "apple-touch-icon     : $(printf '%s' "$H" | grep -o 'apple-touch-icon' | wc -l)"
          echo "favicon-48.png ref   : $(printf '%s' "$H" | grep -o 'favicon-48.png' | wc -l)"
