name: tmp-verify-audio
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live audio site
        run: |
          set +e
          probe() {
            u="$1"
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 30 "$u")
            title=$(grep -oiP '<title>\K[^<]*' /tmp/body | head -1)
            canon=$(grep -oiP 'rel="canonical" href="\K[^"]*' /tmp/body | head -1)
            bytes=$(wc -c < /tmp/body)
            echo "HTTP=$code BYTES=$bytes URL=$u"
            echo "   TITLE=$title"
            echo "   CANONICAL=$canon"
          }
          for u in \
            "https://offexmail.online/" \
            "https://offexmail.online/blog" \
            "https://offexmail.online/remove-echo-reverb" \
            "https://offexmail.online/audio-noise-reduction-online" \
            "https://offexmail.online/podcast-audio-editor-online" \
            "https://offexmail.online/remove-vocals-from-song-online" \
            "https://offexmail.online/sitemap.xml" \
            "https://offexmail.online/robots.txt" \
            "https://offexmail.online/styles.css" \
            "https://offexmail.online/audio-engine.js" \
            "https://offexmail.online/ads.txt" ; do
            probe "$u"
          done
          echo "== HEALTH ENDPOINT =="
          curl -s --max-time 30 https://offexmail.online/health; echo
          echo "== HOME health badge markup =="
          H=$(curl -s --max-time 30 https://offexmail.online/)
          echo "footStatus: $(printf '%s' "$H" | grep -o 'id="footStatus"[^>]*' | head -1)"
          echo "oa-status count: $(printf '%s' "$H" | grep -c 'oa-status')"
          echo "engine script ref: $(printf '%s' "$H" | grep -c 'audio-engine.js')"
          echo "styles ref: $(printf '%s' "$H" | grep -c 'styles.css')"
          echo "== HF refs on home (expect 0) =="
          printf '%s' "$H" | grep -ic 'hf.space\|hydui\|gradio'
          echo "== sitemap url count =="
          curl -s --max-time 30 https://offexmail.online/sitemap.xml | grep -c '<loc>'
