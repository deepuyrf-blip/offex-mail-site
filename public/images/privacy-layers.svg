<svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram separating a private real inbox from a throwaway inbox used for signups"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d4dff"/><stop offset="1" stop-color="#9b6dff"/></linearGradient><linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d4dff"/><stop offset="1" stop-color="#0ea5b7"/></linearGradient></defs><rect width="480" height="340" rx="20" fill="#f1edff"/><g font-family="Inter,-apple-system,Segoe UI,Roboto,sans-serif"><rect x="40" y="44" width="400" height="96" rx="16" fill="#ffffff" stroke="#e3dffb"/><circle cx="92" cy="92" r="26" fill="url(#g)"/><text x="78" y="100" font-size="22" fill="#fff">&#128274;</text><text x="136" y="86" font-size="15" fill="#1a1730" font-weight="800">Your real inbox</text><text x="136" y="110" font-size="13" fill="#5b5776">Bank, work, family &#8212; keep it private</text><rect x="40" y="164" width="400" height="96" rx="16" fill="#ffffff" stroke="#e3dffb"/><circle cx="92" cy="212" r="26" fill="url(#gc)"/><text x="78" y="220" font-size="22" fill="#fff">&#9993;</text><text x="136" y="206" font-size="15" fill="#1a1730" font-weight="800">Throwaway inbox</text><text x="136" y="230" font-size="13" fill="#5b5776">Signups, trials, one-off codes</text><text x="40" y="302" font-size="13" fill="#5b5776">Give each site the address it deserves</text></g></svg>
