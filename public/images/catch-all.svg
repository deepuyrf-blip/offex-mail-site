<svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of a catch-all mail server routing any address on the domain into a single inbox"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d4dff"/><stop offset="1" stop-color="#9b6dff"/></linearGradient><linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d4dff"/><stop offset="1" stop-color="#0ea5b7"/></linearGradient></defs><rect width="560" height="340" rx="20" fill="#f1edff"/><g font-family="Inter,-apple-system,Segoe UI,Roboto,sans-serif"><text x="30" y="86" font-size="12" fill="#1a1730">alice@</text><text x="30" y="126" font-size="12" fill="#1a1730">my-test@</text><text x="30" y="166" font-size="12" fill="#1a1730">random@</text><path d="M110 80 h70 M110 120 h70 M110 160 h70" stroke="#6d4dff" stroke-width="3" stroke-dasharray="6 5"/><rect x="190" y="60" width="150" height="140" rx="16" fill="#ffffff" stroke="url(#g)" stroke-width="4"/><text x="214" y="112" font-size="13" fill="#1a1730" font-weight="800">Catch-all</text><text x="214" y="134" font-size="13" fill="#1a1730" font-weight="800">mail server</text><text x="212" y="162" font-size="11" fill="#5b5776">one domain, any name</text><path d="M344 130 h60" stroke="#6d4dff" stroke-width="4"/><path d="M396 122 l10 8 l-10 8" fill="none" stroke="#6d4dff" stroke-width="4"/><rect x="410" y="80" width="120" height="100" rx="16" fill="url(#g)"/><text x="432" y="128" font-size="30" fill="#fff">&#128235;</text><text x="432" y="160" font-size="12" fill="#fff" font-weight="700">Your inbox</text><text x="30" y="286" font-size="13" fill="#5b5776">Any address on the domain routes to the inbox you are viewing</text></g></svg>
