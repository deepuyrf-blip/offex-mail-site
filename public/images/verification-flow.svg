<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Email verification flow: form submitted, email sent, inbox receives, account verified"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d4dff"/><stop offset="1" stop-color="#9b6dff"/></linearGradient><linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d4dff"/><stop offset="1" stop-color="#0ea5b7"/></linearGradient></defs><rect width="760" height="330" rx="20" fill="#f1edff"/><g font-family="Inter,-apple-system,Segoe UI,Roboto,sans-serif"><rect x="30" y="40" width="700" height="250" rx="18" fill="#ffffff" stroke="#e3dffb"/><circle cx="112" cy="120" r="30" fill="url(#g)"/><text x="96" y="129" font-size="26" fill="#fff">&#9993;</text><text x="70" y="176" font-size="13" fill="#1a1730" font-weight="700">Form</text><text x="66" y="194" font-size="13" fill="#1a1730" font-weight="700">submitted</text><path d="M158 120 h58" stroke="#6d4dff" stroke-width="4"/><path d="M208 112 l10 8 l-10 8" fill="none" stroke="#6d4dff" stroke-width="4"/><circle cx="280" cy="120" r="30" fill="url(#gc)"/><text x="264" y="129" font-size="24" fill="#fff">&#9993;</text><text x="228" y="176" font-size="13" fill="#1a1730" font-weight="700">Email</text><text x="236" y="194" font-size="13" fill="#1a1730" font-weight="700">sent</text><path d="M326 120 h58" stroke="#6d4dff" stroke-width="4"/><path d="M376 112 l10 8 l-10 8" fill="none" stroke="#6d4dff" stroke-width="4"/><circle cx="448" cy="120" r="30" fill="url(#g)"/><text x="432" y="129" font-size="24" fill="#fff">&#128235;</text><text x="396" y="176" font-size="13" fill="#1a1730" font-weight="700">Inbox</text><text x="384" y="194" font-size="13" fill="#1a1730" font-weight="700">receives</text><path d="M494 120 h58" stroke="#6d4dff" stroke-width="4"/><path d="M544 112 l10 8 l-10 8" fill="none" stroke="#6d4dff" stroke-width="4"/><circle cx="616" cy="120" r="30" fill="#0f9d63"/><path d="M602 120 l10 12 l20 -24" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="576" y="176" font-size="13" fill="#1a1730" font-weight="700">Verified</text><text x="250" y="256" font-size="13" fill="#5b5776">OTP code or confirmation link &#8212; usually within seconds</text></g></svg>
