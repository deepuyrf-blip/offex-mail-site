<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three-step diagram: a site asks for an email, you paste a temp address, the code lands in your inbox"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d4dff"/><stop offset="1" stop-color="#9b6dff"/></linearGradient><linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d4dff"/><stop offset="1" stop-color="#0ea5b7"/></linearGradient></defs><rect width="760" height="300" rx="20" fill="#f1edff"/><g font-family="Inter,-apple-system,Segoe UI,Roboto,sans-serif"><rect x="34" y="80" width="200" height="140" rx="16" fill="#ffffff" stroke="#e3dffb"/><circle cx="134" cy="126" r="26" fill="url(#g)"/><text x="122" y="134" font-size="24" fill="#fff">1</text><text x="70" y="176" font-size="14" fill="#1a1730" font-weight="700">Site asks for</text><text x="70" y="196" font-size="14" fill="#1a1730" font-weight="700">an email</text><path d="M240 150 h44" stroke="#6d4dff" stroke-width="4" fill="none"/><path d="M276 142 l10 8 l-10 8" fill="none" stroke="#6d4dff" stroke-width="4"/><rect x="290" y="80" width="200" height="140" rx="16" fill="#ffffff" stroke="#e3dffb"/><circle cx="390" cy="126" r="26" fill="url(#g)"/><text x="378" y="134" font-size="24" fill="#fff">2</text><text x="326" y="176" font-size="14" fill="#1a1730" font-weight="700">Paste your</text><text x="326" y="196" font-size="14" fill="#1a1730" font-weight="700">temp address</text><path d="M496 150 h44" stroke="#6d4dff" stroke-width="4" fill="none"/><path d="M532 142 l10 8 l-10 8" fill="none" stroke="#6d4dff" stroke-width="4"/><rect x="546" y="80" width="180" height="140" rx="16" fill="#ffffff" stroke="#e3dffb"/><circle cx="636" cy="126" r="26" fill="url(#gc)"/><text x="624" y="134" font-size="24" fill="#fff">3</text><text x="580" y="176" font-size="14" fill="#1a1730" font-weight="700">Code lands</text><text x="580" y="196" font-size="14" fill="#1a1730" font-weight="700">in your inbox</text></g></svg>
