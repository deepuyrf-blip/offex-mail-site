<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three cards showing verification types: OTP code, magic link and confirm button"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d4dff"/><stop offset="1" stop-color="#9b6dff"/></linearGradient><linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d4dff"/><stop offset="1" stop-color="#0ea5b7"/></linearGradient></defs><rect width="600" height="340" rx="20" fill="#f1edff"/><g font-family="Inter,-apple-system,Segoe UI,Roboto,sans-serif"><rect x="30" y="50" width="170" height="240" rx="16" fill="#ffffff" stroke="#e3dffb"/><text x="86" y="118" font-size="34">&#128273;</text><text x="62" y="176" font-size="14" fill="#1a1730" font-weight="800">OTP code</text><text x="52" y="204" font-size="11.5" fill="#5b5776">6-digit code you</text><text x="52" y="222" font-size="11.5" fill="#5b5776">type back in</text><rect x="215" y="50" width="170" height="240" rx="16" fill="#ffffff" stroke="#e3dffb"/><text x="272" y="118" font-size="34">&#128279;</text><text x="246" y="176" font-size="14" fill="#1a1730" font-weight="800">Magic link</text><text x="238" y="204" font-size="11.5" fill="#5b5776">one tap confirms</text><text x="238" y="222" font-size="11.5" fill="#5b5776">the address</text><rect x="400" y="50" width="170" height="240" rx="16" fill="#ffffff" stroke="#e3dffb"/><text x="458" y="118" font-size="34">&#9989;</text><text x="426" y="176" font-size="14" fill="#1a1730" font-weight="800">Confirm button</text><text x="424" y="204" font-size="11.5" fill="#5b5776">verify inside the</text><text x="424" y="222" font-size="11.5" fill="#5b5776">email itself</text></g></svg>
