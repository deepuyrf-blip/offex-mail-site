<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two-column diagram listing what a disposable inbox can and cannot protect"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d4dff"/><stop offset="1" stop-color="#9b6dff"/></linearGradient><linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d4dff"/><stop offset="1" stop-color="#0ea5b7"/></linearGradient></defs><rect width="600" height="340" rx="20" fill="#f1edff"/><g font-family="Inter,-apple-system,Segoe UI,Roboto,sans-serif"><rect x="30" y="40" width="256" height="260" rx="16" fill="#ffffff" stroke="#e3dffb"/><rect x="30" y="40" width="256" height="46" rx="16" fill="#0f9d63"/><rect x="30" y="66" width="256" height="20" fill="#0f9d63"/><text x="52" y="70" font-size="15" fill="#fff" font-weight="800">A disposable inbox CAN</text><g fill="#1a1730" font-size="12.5"><text x="52" y="120">&#10003; keep your real address private</text><text x="52" y="152">&#10003; absorb marketing &amp; one-off mail</text><text x="52" y="184">&#10003; cut spam at the source</text><text x="52" y="216">&#10003; test signup &amp; reset flows</text><text x="52" y="248">&#10003; leave nothing behind</text></g><rect x="314" y="40" width="256" height="260" rx="16" fill="#ffffff" stroke="#e3dffb"/><rect x="314" y="40" width="256" height="46" rx="16" fill="#df3d5c"/><rect x="314" y="66" width="256" height="20" fill="#df3d5c"/><text x="336" y="70" font-size="15" fill="#fff" font-weight="800">It does NOT</text><g fill="#1a1730" font-size="12.5"><text x="336" y="120">&#10007; secure a bank or gov account</text><text x="336" y="152">&#10007; recover an account later</text><text x="336" y="184">&#10007; hide mail from anyone who</text><text x="352" y="204">knows the address</text><text x="336" y="236">&#10007; replace a real mailbox</text></g></g></svg>
